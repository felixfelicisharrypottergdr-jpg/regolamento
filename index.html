ncome Oggetti da collezionismo e non come ingredienti, e che per questo possono essereprelevate soltanto con la forza tramite Remuvo. Di conseguenza, la\nloro vendita o il loro acquisto sono illegali.\n• Alcune Creature sono <strong>sempre ostili<\/strong>: in assenza dei requisiti indicati dal sistema o\ndallo specchietto della singola specie attaccano autoconclusivamente i PG. L'Ostilità non\ndetermina di per sé l'illegalità della Domesticazione o dell'Allevamento, che dipende invece\ndalla Legalità e dalle eventuali regole specifiche della Creatura.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>• <strong>Attenzione:<\/strong> tutti i Parametri delle Bestie si riferiscono all'età\n<strong>Adulta<\/strong>.<\/p>\n<ul>\n<li>Se la Bestia trovata ONGame è <strong>Infante<\/strong>, i Parametri si riducono del <strong>75%<\/strong>.<\/li>\n<li>Se è <strong>Adolescente<\/strong>, i Parametri si riducono del <strong>25%<\/strong>.<\/li>\n<li>Se è <strong>Anziana<\/strong>, i Parametri si riducono del <strong>50%<\/strong>.\nEventuali risultati decimali vengono <strong>arrotondati per difetto<\/strong>. Un Parametro non può\ntuttavia scendere al di sotto di <strong>1<\/strong>: se l'applicazione della riduzione porterebbe il\nvalore a 0 o a un valore inferiore a 1, il Parametro si considera pari a <strong>1<\/strong>. Un\nParametro che possiede già valore <strong>1<\/strong> rimane pertanto invariato.\n• L'acquisto di Ingredienti provenienti da Creature Magiche contrassegnati da è illegale per tutti i PG, in certi casi ad eccezione di Pozionisti di\nmestiere. In quest'ultimo caso il contrassegno è ( ✔)<\/li>\n<\/ul>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>•PG Studenti e Adulti subiscono ONGame una ferita da taglio per via di una Creatura\nMagica contraggono l'Artigliatite se, lanciando 1d15,\npescano 1-3.\n• PG che allevano (il dado va lanciato assieme ad ogni dado di Produzione degli Ingredienti)\nuna Creatura Magica XXXX o XXXXX contraggono l'Ira se,\nlanciando 1d20, pescano 1.<\/p>\n<h2 id=\"riconoscimento-della-creatura-magica\">Riconoscimento della Creatura Magica<\/h2>\n<p>•* Creature Magiche di ogni Classificazione<em>: vengono\ninsegnate ad Hogwarts e sono quindi conosciute a livello teorico da tutti i PG Adulti e dai PG\nStudenti in base al proprio anno di studi. Possono riconoscerle autoconclusivamente.\n• *Creature Magiche Esotiche<\/em>: fanno parte delle Conoscenze Extra di Magizoologia. E'\nnecessario acquistare il pacchetto per poter conoscere a livello teorico questo genere di\nCreature oppure sviluppare Sapienza Magizoologica per conoscerne la teoria gratuitamente.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>• Non riuscire a riconoscere una Creatura non preclude la possibilità di interazione: ci\nsaranno soltanto meno possibilità di riuscita.<\/p>\n<p><strong>COSA SUCCEDE SE NON\nRICONOSCO LA CREATURA?<\/strong>Non riconoscere la Creatura significa avere meno possibilità di riuscire ad infondere Fiducia\nnella Creatura Magica poiché non si riconoscono le sue caratteristiche e dunque i suoi punti\ndi forza e debolezza.<\/p>\n<p>Un PG Studente del V anno durante una Quest si trova a fronteggiare una Salamandra.\nEssa, essendo parte del piano di studi del VI anno, non può essere riconosciuta dal PG.\nAvrebbe potuto riconoscerla ottenendo o acquistando in precedenza la conoscenza della\nSalamandra.<\/p>\n<p><strong>Il Generatore: La Magizoologia<\/strong>\nPer facilitare la Ricerca e la gestione delle Creature Magiche è disponibile il\nGeneratore di Magizoologia, che permette anzitutto di registrare\ni dati del proprio PG utili alle diverse procedure e accompagna poi il Personaggio sia nella\n<em>Ricerca Creature Magiche<\/em> sia nelle successive fasi della <em>Guida alla\nMagizoologia<\/em>: Riconoscimento, Fiducia, Cura -comprese Scoperta del problema e\nConvalescenza -, Domesticazione e Allevamento.\nDurante la Ricerca il Generatore tiene conto della Zona in cui si svolge la role, del tipo di\nRicerca, degli eventuali spostamenti necessari, della Valigia Magica e degli Oggetti,\nIncantesimi, Tecniche o Conoscenze utilizzati; prepara i codici dei dadi da copiare sul forum\ne, una volta inseriti i risultati ottenuti, determina automaticamente soglie ed esiti e guida il\nPG attraverso i diversi Incontri, individuando Classificazione, specie, numero degli\nesemplari, Sesso e Fase Vitale secondo le tabelle previste dal regolamento. Tiene inoltre\nconto delle eventuali regole particolari legate alla Zona o alla Creatura incontrata. Ogni\nRicerca viene salvata come sessione separata, può essere interrotta e ripresa\nsuccessivamente e, una volta individuata una Creatura, i dati del ritrovamento possono\nessere importati direttamente nella Guida senza doverli ricompilare.\nNella Guida il Generatore controlla la corretta successione delle fasi e i relativi prerequisiti,\napplica automaticamente requisiti, bonus, malus e Fatica, registra i tentativi effettuati e\ngestisce ritentativi, fallimenti, conseguenze ed eventuali effetti che devono propagarsi alle\nfasi successive. Tiene inoltre conto delle particolarità delle singole specie, delle Creature\nillegali, degli Oggetti, delle Conoscenze e degli Incantesimi utilizzati, delle relative limitazioni\ne degli eventuali dadi secondari o conseguenze specifiche. Quando necessario segnala\nanche i casi nei quali deve intervenire il Narratore.\nLa sezione dedicata all'<em>Allevamento<\/em> gestisce Produzione, Crescita, Schiusa e\nRiproduzione, determinando l'esito dei Cicli, i Post necessari e la quantità di Ingredienti o\ncuccioli ottenuti. Quando previsto assiste inoltre nell'ottenimento degli Ingredienti attraverso\n<em>Remuvo<\/em> o mediante le procedure di estrazione specifiche della Creatura,\nmantenendo distinte le diverse modalità previste dal regolamento.\nQuando l'effetto di una Conoscenza, Tecnica o Incantesimo dipende dalla sua riuscita, il\nGeneratore può collegarsi direttamente a <em>Riuscita, Forza e Utilizzi<\/em>, predisponendo i dati necessari e importando poi automaticamente l'esito\nottenuto. Al termine della Guida viene prodotto un riepilogo complessivo della Creatura,\ndegli esiti delle diverse fasi, della Fatica consumata, dei bonus, dei malus e delle\nconseguenze ancora attive, insieme ai dati già preparati da copiare ne <em>Il Mio Elfo\nDomestico<\/em> (Adulti - Studenti)\nper aggiornare il Recinto o la Riserva del PG. Quando il regolamento richiede un dadopubblico, il Generatore non sostituisce il tiro sul forum: prepara il codice necessario e\nattende l'inserimento del risultato realmente ottenuto.<\/p>\n<h2 id=\"fiducia\">Fiducia<\/h2>\n<p>La procedura completa è nella pagina <a href=\"fiducia/\">Fiducia<\/a>: requisiti, costo in Fatica, bonus, esempi e conseguenze del fallimento.<\/p>\n<h2 id=\"infondere-fiducia-nella-creatura-magica-1d30\">Infondere Fiducia nella Creatura Magica: 1d30<\/h2>\n<p>Consulta il <a href=\"fiducia/#infondere-fiducia-nella-creatura-magica-1d30\">lancio di Fiducia e i relativi esempi<\/a>.<\/p>\n<h2 id=\"cura\">Cura<\/h2>\n<p><strong>Tool interattivo:<\/strong> La Magizoologia Facile\nIl PG che ha ottenuto la Fiducia di una Creatura Magica ferita, ammalata o in difficoltà può\ntentare di comprenderne il problema e intervenire per curarla attraverso rimedi non magici,\nPozioni, Incantesimi o altri strumenti a propria disposizione.\nMaggiore è l'Empatia e la conoscenza del PG riguardo alla Creatura Magica di riferimento,\nmaggiori sono le possibilità di intervenire correttamente; più è alta la Classificazione della\nCreatura, maggiore è invece la difficoltà della procedura.\n<strong>La Cura di una Creatura Magica si divide in tre fasi distinte e consequenziali:<\/strong><\/p>\n<ol>\n<li>Scoperta del problema della Creatura<\/li>\n<li>Cura del problema<\/li>\n<li>Convalescenza della Creatura\nPer completare la Cura è necessario effettuare due lanci di dado: il primo per la\n<strong>Scoperta del Problema<\/strong> e il secondo per la <strong>Cura del Problema<\/strong>. Nelle free\nrole si applica la seguente modalità di gestione:<\/li>\n<\/ol>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Gestione autonoma della Cura<\/strong>\n• Nelle <strong>free role<\/strong> la Cura può essere gestita interamente dai player, senza richiedere\nl'intervento preventivo del Narratore.\n• I player possono descrivere liberamente la condizione della Creatura, mentre <strong>Scoperta\ne Cura del Problema sono determinate dai dadi<\/strong> e dalle eventuali meccaniche utilizzate.\n• Il Narratore deve essere contattato soltanto se, in seguito agli esiti previsti dalla procedura,\nla Creatura <strong>diventa ostile<\/strong>.<\/p>\n<h2 id=\"limiti-della-gestione-autonoma\">Limiti della gestione autonoma<\/h2>\n<p>• Lo stato della Creatura scelto dai player ha valore narrativo e <strong>non modifica la difficoltà\ndella Cura<\/strong>.• La situazione descritta deve essere coerente con la specie e con il contesto dell'incontro.\nNon possono essere introdotti autonomamente nuove Malattie, proprietà della specie,\nIngredienti, Oggetti, effetti di sistema, PNG, responsabili dell'accaduto, eventi esterni,\nelementi di trama o altre conseguenze non già previste dal regolamento.\n• Durante la Scoperta del Problema il player può descrivere liberamente i sintomi osservabili,\nma il PG può determinarne la natura soltanto in seguito a un esito positivo del relativo dado.\n• Eventuali bonus o malus possono derivare esclusivamente da Conoscenze, Tecniche,\nOggetti, Pozioni o altre meccaniche che li prevedano espressamente. <strong>Non vengono\nassegnati bonus in base alla qualità della narrazione.<\/strong>\n• Ogni tentativo di Scoperta o Cura viene effettuato da un solo PG. Altri personaggi possono\npartecipare narrativamente alla scena, ma non sommano Parametri o bonus al tiro salvo che\nuna specifica meccanica lo consenta.\n• I fallimenti accumulati appartengono alla procedura relativa a quella specifica Creatura e\nnon vengono azzerati se un altro PG prosegue i tentativi.\n• Nelle Quest, negli Eventi e nelle role già gestite da un Narratore, la condizione della\nCreatura e lo svolgimento della Cura vengono inseriti nella narrazione in corso.<\/p>\n<p><strong>SCOPERTA DEL PROBLEMA DELLA\nCREATURA<\/strong>\nIn questa fase il PG cerca di comprendere la natura del problema che affligge la Creatura a\npartire dai sintomi, dalle ferite e dagli altri elementi osservabili nella scena.\nIl dado può essere lanciato autonomamente dal PG nelle free role.\nSvolgere questa azione costa <strong>-1 Fatica<\/strong>.<\/p>\n<h2 id=\"dado-cura-1-scoperta-del-problema-1d35\">Dado Cura 1: Scoperta del problema - 1d35<\/h2>\n<p><strong>Lancio 1d35<\/strong>: la Scoperta del Problema avviene positivamente se il PG pesca un\nesito compreso fra 1 e la sua Empatia + bonus legato al voto nella singola Creatura/valore\nAdulto o Livello di Custode delle Creature + Classificazione della Creatura + l'eventuale uso\ndi Oggetti/Conoscenze che forniscono un bonus in Possibilità per questo lancio.\n<strong>Base:<\/strong> 1 - Empatia su 1d35\n<strong>Aumento Possibilità in base al Voto nella singola Creatura (PG Studenti)<\/strong>\n<strong>T:<\/strong> //\n<strong>D:<\/strong> +1 Possibilità\n<strong>S:<\/strong> +2 Possibilità\n<strong>A:<\/strong> +3 Possibilità\n<strong>O:<\/strong> +4 Possibilità\n<strong>E:<\/strong> +5 Possibilità<strong>PG Studente con Custode delle Creature Magiche I:<\/strong> +2 Possibilità al valore previsto\ndal proprio voto nella singola Creatura\n<strong>Possibilità per PG Adulti<\/strong>\n<strong>PG Adulto senza Custode delle Creature Magiche, che non ha frequentato CDCM:<\/strong>\n+2 Possibilità\n<strong>PG Adulto senza Custode delle Creature Magiche, che ha frequentato CDCM:<\/strong> +6\nPossibilità\n<strong>Aumento Possibilità in base al livello di Custode delle Creature Magiche:<\/strong>\n<strong>PG Adulto con Custode delle Creature Magiche Lv I:<\/strong> +7 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv II:<\/strong> +8 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv III:<\/strong> +9 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv IV:<\/strong> +10 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv V:<\/strong> +11 Possibilità\n<strong>Aumento Possibilità in base alla Classificazione della Creatura Magica:<\/strong>\n<strong>X:<\/strong> +3 Possibilità\n<strong>XX:<\/strong> +2 Possibilità\n<strong>XXX:<\/strong> //\n<strong>XXXX:<\/strong> -2 Possibilità\n<strong>XXXXX:<\/strong> -3 Possibilità\n<strong>1d35:<\/strong> 1 - Empatia + Voto nella singola Creatura/Lv. Custode delle Creature (+2 se\nPG Studente con Custode I) + Classificazione Creatura + Uso di Oggetti/Conoscenze su 35<\/p>\n<p>• Se il PG <strong>riesce<\/strong> nella Scoperta del Problema, può determinarne la natura e passare\nalla fase di Cura del Problema, ottenendo <strong>+3 Possibilità<\/strong> al relativo lancio.\n• Se il PG <strong>fallisce<\/strong>, il problema non viene ancora individuato correttamente e il\ntentativo può essere ripetuto. Per ogni fallimento accumulato si applica <strong>-3 Possibilità<\/strong>\nal successivo lancio di Cura del Problema.\nSe le Possibilità complessive per la Cura del Problema raggiungono o scendono sotto\n<strong>0<\/strong>, la Creatura non può più essere curata e muore.\nSe durante la Scoperta del Problema viene accumulato almeno <strong>1 fallimento<\/strong>, la\nCreatura riceve inoltre i seguenti malus in fase di Allevamento:\n• <strong>-1d2 cuccioli<\/strong>;\n• <strong>+5 post<\/strong> necessari per completare ogni Ciclo di Allevamento.\nUlteriori fallimenti nella sola fase di Scoperta del Problema non aumentano questi due\nmalus.<\/p>\n<p><strong>CURA DEL\nPROBLEMA<\/strong>Una volta individuato il problema, il PG deve ruolare il trattamento che ritiene più coerente\ncon la condizione della Creatura, utilizzando magia, Pozioni, Oggetti, strumenti, rimedi non\nmagici o altre risorse effettivamente a propria disposizione.\nLa riuscita del trattamento viene determinata dal relativo dado e <strong>non dipende da una\nvalutazione qualitativa del post<\/strong>.\nSvolgere questa azione costa <strong>-1 Fatica<\/strong>.<\/p>\n<h2 id=\"dado-cura-2-cura-del-problema-1d35\">Dado Cura 2: Cura del problema - 1d35<\/h2>\n<p><strong>Lancio 1d35<\/strong>: la Cura del Problema avviene positivamente se il PG pesca un esito\ncompreso fra 1 e la sua Empatia + bonus legato al voto nella singola Creatura/valore Adulto\no Livello di Custode delle Creature + Classificazione, aggiungendo o sottraendo il\nbonus/malus ottenuto durante la Scoperta del Problema + l'eventuale uso di\nOggetti/Conoscenze che forniscono un bonus in Possibilità per questo lancio.\n<strong>Base:<\/strong> 1 - Empatia su 1d35\n<strong>Aumento Possibilità in base al Voto nella singola Creatura (PG Studenti)<\/strong>\n<strong>T:<\/strong> //\n<strong>D:<\/strong> +1 Possibilità\n<strong>S:<\/strong> +2 Possibilità\n<strong>A:<\/strong> +3 Possibilità\n<strong>O:<\/strong> +4 Possibilità\n<strong>E:<\/strong> +5 Possibilità\n<strong>PG Studente con Custode delle Creature Magiche I:<\/strong> +2 Possibilità al valore previsto\ndal proprio voto nella singola Creatura\n<strong>Possibilità per PG Adulti<\/strong>\n<strong>PG Adulto senza Custode delle Creature Magiche, che non ha frequentato CDCM:<\/strong>\n+2 Possibilità\n<strong>PG Adulto senza Custode delle Creature Magiche, che ha frequentato CDCM:<\/strong> +6\nPossibilità\n<strong>Aumento Possibilità in base al livello di Custode delle Creature Magiche:<\/strong>\n<strong>PG Adulto con Custode delle Creature Magiche Lv I:<\/strong> +7 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv II:<\/strong> +8 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv III:<\/strong> +9 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv IV:<\/strong> +10 Possibilità\n<strong>PG Adulto con Custode delle Creature Magiche Lv V:<\/strong> +11 Possibilità\n<strong>Aumento Possibilità in base alla Classificazione della Creatura:<\/strong>\n<strong>X:<\/strong> +3 Possibilità\n<strong>XX:<\/strong> +2 Possibilità\n<strong>XXX:<\/strong> //\n<strong>XXXX:<\/strong> -2 Possibilità\n<strong>XXXXX:<\/strong> -3 PossibilitàAggiungere o sottrarre il bonus o i malus ottenuti durante la Scoperta del\nProblema.\n<strong>1d35:<\/strong> 1 - Empatia + Voto nella singola Creatura/Lv. Custode delle Creature (+2 se\nPG Studente con Custode I) + Classificazione Creatura ± bonus/malus Scoperta del\nProblema + Uso di Oggetti/Conoscenze su 35\n<strong>Se la Creatura è una Femmina in Gravidanza:<\/strong> a ogni tentativo di Cura del\nProblema il PG lancia anche <strong>1d10<\/strong>:\n• <strong>1:<\/strong> muoiono sia la madre sia il feto;\n• <strong>2-5:<\/strong> muore il feto;\n• <strong>6-10:<\/strong> madre e feto sono salvi.<\/p>\n<p>Un <strong>PG Adulto che ha frequentato CDCM, senza Custode delle Creature Magiche<\/strong>,\ncon <strong>Empatia 20<\/strong> prova a scoprire il problema di un <strong>Graphorn<\/strong> (XXXX) ferito.\n• Empatia 20 → 1-20 Possibilità;\n• Adulto che ha frequentato CDCM, senza Custode delle Creature Magiche → +6 Possibilità;\n• Classificazione XXXX → -2 Possibilità.\n<strong>Totale:<\/strong> <strong>1-24 su 1d35<\/strong>.\nIl PG lancia 1d35 e ottiene 31: fallisce e accumula <strong>-3 Possibilità<\/strong> alla successiva\nCura del Problema. Ritenta la Scoperta e ottiene 7: riesce a individuare il problema e ottiene\nanche il previsto <strong>+3 Possibilità<\/strong> alla Cura.\nQuando passa alla Cura del Problema, il totale è quindi:\n<strong>20<\/strong> Empatia + <strong>6<\/strong> Adulto con CDCM - <strong>2<\/strong> Classificazione XXXX +\n<strong>3<\/strong> Scoperta riuscita - <strong>3<\/strong> precedente fallimento = <strong>24 Possibilità<\/strong>.\nIl PG riesce quindi a curare il Graphorn con <strong>1-24 su 1d35<\/strong>. Ottiene 23: la Cura\nriesce.<\/p>\n<p>• Se il PG <strong>fallisce<\/strong> la Cura del Problema, può effettuare un nuovo tentativo\napplicando normalmente tutti i modificatori già accumulati.\n• Se viene accumulato almeno <strong>1 fallimento<\/strong> durante la Cura del Problema, la\nCreatura riceve inoltre:<\/p>\n<ul>\n<li><strong>-1d2 cuccioli<\/strong>;<\/li>\n<li><strong>+5 post<\/strong> necessari per completare ogni Ciclo di Allevamento.\nQuesti malus non aumentano in seguito a ulteriori fallimenti nella stessa fase. Se la Creatura\naveva già ricevuto i malus derivanti da almeno un fallimento nella Scoperta del Problema, i\ndue effetti si sommano: il malus massimo derivante dall'intera procedura di Cura è quindi\n<strong>-2d2 cuccioli e +10 post<\/strong> per ogni Ciclo di Allevamento.• Se il PG fallisce <strong>tre volte consecutive<\/strong> nella Cura del Problema, deve lanciare\n<strong>1d5<\/strong>:<\/li>\n<li>con <strong>1-3<\/strong>, la Creatura muore;<\/li>\n<li>con <strong>4-5<\/strong>, la Creatura diventa ostile e utilizza le proprie ultime forze per attaccare,\nper poi morire.\nNel secondo caso la gestione autonoma della role termina immediatamente e deve essere\nrichiesto l'intervento del Narratore.\n• Se la Cura del Problema riesce, la Creatura viene curata, entra nella fase di\nConvalescenza e, se non è già addomesticata, il PG ottiene <strong>+3 Possibilità<\/strong> alla\nsuccessiva fase di Domesticazione.<\/li>\n<\/ul>\n<p><strong>CONVALESCENZA DELLA\nCREATURA<\/strong>\nDopo una Cura del Problema conclusa con successo, la Creatura entra automaticamente in\nConvalescenza.\nLa durata della Convalescenza dipende dal numero complessivo di fallimenti accumulati\ndurante <strong>Scoperta del Problema + Cura del Problema<\/strong>:\n• <strong>0 fallimenti:<\/strong> 10 post del PG;\n• <strong>1 fallimento:<\/strong> 15 post del PG;\n• <strong>2 fallimenti:<\/strong> 20 post del PG;\n• <strong>3 fallimenti:<\/strong> 25 post del PG;\n• <strong>4 o più fallimenti:<\/strong> 30 post del PG.\nI fallimenti vengono conteggiati sull'intera procedura relativa a quella specifica Creatura e\nnon vengono azzerati se i tentativi vengono effettuati da PG differenti.\nIl periodo di Convalescenza viene conteggiato attraverso post del PG di qualsiasi genere —\nfree role, Quest, Eventi ecc. — e può essere ridotto soltanto attraverso Pozioni, Oggetti o\naltre meccaniche che prevedano espressamente una riduzione dei tempi di recupero.\nDurante questo periodo:\n• se la Creatura <strong>non fa parte della Riserva del PG<\/strong>, può essere lasciata nel luogo\ndell'incontro oppure ospitata temporaneamente nella Medicheria della Riserva, se il PG ne\npossiede una. Al termine della Convalescenza può essere sottoposta alla fase di\nDomesticazione, beneficiando del <strong>+3 Possibilità<\/strong> ottenuto con la Cura del Problema,\noppure essere lasciata libera senza conseguenze;\n• se la Creatura è <strong>già addomesticata<\/strong> e fa parte della Riserva, può trascorrere la\nConvalescenza direttamente nella propria Riserva ma non può essere utilizzata per Cicli di\nProduzione o Riproduzione finché non è guarita. Se un Ciclo era già in corso, il conteggiodei post viene sospeso e riprende dal punto in cui era stato interrotto al termine della\nConvalescenza.<\/p>\n<p>Un PG trova durante una Ricerca una Creatura ferita e completa Scoperta del Problema e\nCura del Problema senza alcun fallimento. La Creatura entra quindi in <strong>Convalescenza\nper 10 post<\/strong>. Il PG può lasciarla nel luogo dell'incontro oppure, se ne ha la possibilità,\nospitarla temporaneamente nella Medicheria della propria Riserva. Al termine dei 10 post\npuò tentare la Domesticazione con il bonus di +3 Possibilità ottenuto attraverso la Cura.\nUna Creatura già parte della Riserva viene invece curata dopo aver accumulato\ncomplessivamente <strong>2 fallimenti<\/strong> fra Scoperta e Cura del Problema. La Convalescenza\ndura quindi <strong>20 post<\/strong>. Se al momento della ferita erano già stati completati 12 dei 20\npost necessari per un Ciclo di Produzione, il conteggio rimane sospeso durante la\nConvalescenza e riprende dal <strong>13° post<\/strong> una volta che la Creatura è guarita.<\/p>\n<h2 id=\"domesticazione\">Domesticazione<\/h2>\n<p>La procedura completa è nella pagina <a href=\"domesticazione/\">Domesticazione<\/a>: requisiti, costo in Fatica, tentativi successivi, conseguenze e gestione delle Creature addomesticate.<\/p>\n<h2 id=\"addomesticare-una-creatura-1d35\">Addomesticare una Creatura: 1d35<\/h2>\n<p>Consulta il <a href=\"domesticazione/#addomesticare-una-creatura-1d35\">lancio di Domesticazione e i relativi esempi<\/a>.<\/p>\n<h2 id=\"allevamento\">Allevamento<\/h2>\n<p><strong>Tool interattivo:<\/strong> La Magizoologia Facile\nIn questa fase relazionale il PG può allevare una Creatura Magica per far sì che la propria\nCreatura cresca e diventi una Creatura sana e forte che possa dare Ingredienti da vendere,\nsfruttare per le Pozioni, da sfruttare in occasioni di gioco varie e cuccioli per avere sempre\nnuove Creature da accudire.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Quando il PG porta in Riserva e alleva Creature Magiche Illegali (Domesticazione e\nAllevamento), segue quanto stabilito da questa Guida.<\/p>\n<p>Ogni Creatura Magica si sviluppa in <strong>4 diverse Fasi Vitali<\/strong>, ognuna con caratteristiche\ndifferenti.\n<strong>0. Uovo/Cucciolo:<\/strong> non è una vera Fase Vitale ma l'inizio di ogni Creatura Magica, si\ntratta di un Cucciolo nel caso in cui la Creatura sia mammifera.\n<strong>1. Infanzia:<\/strong> da quando il cucciolo cresce e diventa praticamente un \"bambino\", con\ntanta voglia di vivere e di esplorare il mondo.\n<strong>2. Adolescenza:<\/strong> da quando la Creatura termina la sua crescita maturando gran\nparte dei suoi tratti caratteriali, sebbene non sia ancora pronta per potersi riprodurre.\n<strong>3. Adultità:<\/strong> è il momento di adultità della Creatura Magica ormai fatta e finita e in cui\nciclicamente, sotto spinta del Magizoologo, dà cuccioli ed ingredienti.\n<strong>4. Vecchiaia:<\/strong> è il momento in cui la Creatura Magica invecchia e arriva al termine\ndella sua esistenza, iniziando ad appassire.\n<strong>Quanto dura ogni Fase Vitale?<\/strong>\nOgni Fase Vitale ha una durata differente a seconda della quantità di Cicli di Produzione che\nil PG può portare a termine con la Creatura in questione.\nSi definisce \"<strong>Ciclo di Produzione<\/strong>\" il processo che consente alla Creatura di produrre\nIngredienti utili per il PG e si misura nel numero di post necessari a terminare, per l'appunto,\nla produzione e produrre gli Ingredienti previsti dalla Creatura.\nNel caso in cui il PG non voglia produrre Ingredienti dalla Creatura ed utilizzarla in altri modi,\nle Creature passano da una fase all'altra anche una volta trascorso un certo tempo\nOFFGame, per la durata complessiva di un anno OFFGame. Il tutto è spiegato nel paragrafo\nsuccessivo.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>• PG Studenti con Eccezionale nel voto corrispondente alla Creatura di riferimento\ncapiscono soltanto il sesso e la Fase Vitale (es. Adolescenza);\n• PG con Sapienza Magizoologica 1+ capiscono l'età e il sesso della Creatura\nautoconclusivamente;\n• PG con Sapienza Magizoologica 10+ capiscono se Creature parte di un'orda sono\nimparentate fra di loro o se la Creatura che trova è in gestazione;\n• Altri PG possono chiedere pareri di esperti.<\/p>\n<blockquote class=\"callout why\">\n<p><strong>Perché?<\/strong><\/p>\n<\/blockquote>\n<p><strong>...la mia Creatura Magica non può produrre Ingredienti e cuccioli all'infinito, invecchiando\nsolo col tempo, ma invecchia anche producendo Ingredienti e cuccioli?<\/strong>\nPer una questione di equità e di bilanciamento. Se le Creature avessero una durata di vita\nmisurata soltanto in tempo OFFGame, la produzione degli Ingredienti risulterebbe un grosso\nvantaggio ed una fonte di guadagno gigantesca, soprattutto per i PG che giocano molto.\nInoltre, essendo i posti nelle Riserve e nelle Valigie limitati, una durata di vita medio-cortastimola i PG a cercare di liberarsi presto di quelle che hanno già, così da poterne cercare\naltre sempre nuove da poter coltivare.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>•PG Studenti e Adulti subiscono ONGame una ferita da taglio per via di una Creatura\nMagica contraggono l'Artigliatite se, lanciando 1d15,\npescano 1-3.\n• PG che allevano (il dado va lanciato assieme ad ogni dado di Produzione degli Ingredienti)\nuna Creatura Magica XXXX o XXXXX contraggono l'Ira se,\nlanciando 1d20, pescano 1.<\/p>\n<h2 id=\"i-cicli-di-produzioni-e-le-fasi-vitali-della-creatura-magica-dall-uovo-alla-vecchiaia\">I Cicli di Produzioni e le Fasi Vitali della Creatura Magica: dall'Uovo alla Vecchiaia<\/h2>\n<p>Ogni Creatura Magica ha\nbisogno di un certo lasso di tempo per crescere, diventare adulta e dare cuccioli e\nIngredienti.\nIl tempo di crescita di un uovo, di una Creatura Magica Infante/Adolescente/Adulta e/o del\nrilascio di uova e Ingredienti è regolato da un certo numero di Post che il Magizoologo deve\ngiocare ONGame - post di qualsiasi genere (free role, Eventi, Quest, ecc.) - che possano\ndare la misura dello scorrere del tempo utile alla Creatura da lui coltivata perché possa\ncrescere e/o rilasciare uova e ingredienti.\nQuesto lasso di tempo, e dunque il totale di post necessari alla Creatura, può essere\naccelerato grazie all'uso di particolari cibi o strumenti che è possibile acquistare nei Negozi\ndi Creature Magiche.\nOgni Creatura in ciascuna Fase Vitale ha a disposizione un certo numero di Cicli di\nProduzione di Ingredienti e, nella fase di Adultità, una produzione di cuccioli\n<strong>garantita<\/strong>. I Cicli di Produzione si misurano in post oppure tempo OFFGame,\ntrascorsi e passati i quali la Creatura passerà alla Fase Vitale successiva fino alla morte.\n<strong>0) Uovo/Neonato:<\/strong> il numero di post prima della schiusa dell'Uovo/incubazione del\nNeonato/nascita della Creatura viene deciso tramite il lancio del dado, oppure al passare di\n<strong>1 mese OFFGame dalla data di chiusura della role di ritrovamento<\/strong>\ndell'Uovo/Neonato/Creatura in gestazione. Dopo di che la Creatura passa alla fase di\nInfanzia.\n<strong>1) Infanzia:<\/strong> la Creatura, prima di passare alla Fase Vitale successiva, può portare a\ntermine <strong>2 Cicli di Produzione Ingredienti<\/strong>, la cui durata in post è decisa dal lancio dei\ndadi. Terminati i cicli, la Creatura passa immediatamente alla Fase Vitale successiva.\nAltrimenti, la Creatura passa in ogni caso alla fase di Adolescenza dopo <strong>2 mesi\nOFFGame dalla data di chiusura della role di ritrovamento<\/strong> o da quando è diventata\nInfante.\n<strong>2) Adolescenza:<\/strong> la Creatura, prima di passare alla Fase Vitale successiva, può\nportare a termine <strong>3 Cicli di Produzione Ingredienti<\/strong>, la cui durata in post è decisa dal\nlancio dei dadi. Terminati i cicli, la Creatura passa immediatamente alla Fase Vitale\nsuccessiva. Altrimenti, la Creatura passa in ogni caso alla fase di Adultità dopo <strong>3 mesiOFFGame dalla data di chiusura della role di ritrovamento<\/strong> o da quando è diventata\nAdolescente.\n<strong>3) Adultità:<\/strong> la Creatura, prima di passare alla Fase Vitale successiva, può portare a\ntermine <strong>5 Cicli di Produzione Ingredienti<\/strong>, la cui durata in post è decisa dal lancio dei\ndadi. Terminati i cicli, la Creatura passa immediatamente alla Fase Vitale successiva.\nAltrimenti, la Creatura passa in ogni caso alla fase di Vecchiaia dopo <strong>4 mesi OFFGame\ndalla data di chiusura della role di ritrovamento<\/strong> o da quando è diventata Adulta.\n• <strong>Soltanto in questa Fase Vitale:<\/strong> le Creature hanno a disposizione <em><strong>1\nRiproduzione<\/strong><\/em> - non obbligatoria, al di fuori del conteggio dei Cicli di Produzione\nIngredienti, che permette loro di produrre una certa quantità di cuccioli dopo un numero di\npost decisi dai dadi. La riproduzione e la produzione di Ingredienti può essere svolta\ncontemporaneamente.\nSe il PG non possiede un corrispettivo maschile/femminile della Creatura che vuole far\nriprodurre, può narrare e giustificare la riproduzione attraverso l'accoppiamento della\nCreatura in suo possesso con una Creatura proveniente da un'altra Riserva di Magizoologi.\n<strong>4) Vecchiaia:<\/strong> la Creatura, prima di passare alla Fase Vitale successiva, può portare\na termine <strong>2 Cicli di Produzione Ingredienti<\/strong>, la cui durata in post è decisa dal lancio\ndei dadi. Terminati i cicli, la Creatura muore. Altrimenti, la Creatura muore in ogni caso dopo\n<strong>2 mesi OFFGame dalla data di chiusura della role di ritrovamento<\/strong> o da quando è\ndiventata Anziana.<\/p>\n<p>Questo significa che ogni Creatura Magica, se sfruttata al massimo per la produzione di\nIngredienti e cuccioli, può portare a termine al massimo <strong>12 Cicli di Produzione\nIngredienti<\/strong> e <strong>1 ciclo di Riproduzione Cuccioli<\/strong>. Nel caso in cui si decida invece di\nsfruttarne il più possibile la durata in termini di sopravvivenza, per usarle in battaglia o in\naltre situazioni di gioco, la Creatura ha una durata di vita di al massimo <strong>1 anno\nOFFGame<\/strong>.\nMa entrambe le cose possono essere fatte contemporaneamente: per trarre il maggior\nbeneficio possibile dall'Allevamento di una Creatura, il PG può decidere di sfruttare soltanto\nparte dei Cicli di Produzione, così che la Creatura non invecchi prima, per poi lasciar\nscorrere il tempo OFF e far sì che abbia la vita più lunga possibile.<\/p>\n<p>Vien da sé che prima di far schiudere un Uovo o allevare una Creatura o prima di far\nriprodurre una Creatura, il PG deve lanciare un dado per decretare la riuscita generica\ndell'allevamento/ripdouzione, con relativi malus o bonus di tempi/post.\nLa formula per stabilire <em>SE<\/em> l'Allevamento riesce ed il corrispettivo numero di post\nnecessari a terminare ogni Ciclo di Produzione, e quindi a produrre Ingredienti, oppure il\nCiclo di Riproduzione è la seguente:<\/p>\n<h2 id=\"allevamento-tempi-di-produzione-ingredienti-e-riproduzione-1d10\">Allevamento - tempi di produzione Ingredienti e Riproduzione: 1d10<\/h2>\n<p><strong>Numero di partenza associato al voto nella singola Creatura/livello di Allevatore di\nCreature Magiche + Empatia - Classificazione della Creatura<\/strong><\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Il PG lancia un dado <strong>1d10<\/strong> per definire la riuscita definitiva della sua produzione.\nL'esito va interpretato in base alla somma ottenuta.<\/p>\n<p><strong>Numero associato al Voto nella singola Creatura (PG Studenti)<\/strong>\n<strong>T:<\/strong> 1\n<strong>D:<\/strong> 2\n<strong>S:<\/strong> 3\n<strong>A:<\/strong> 4\n<strong>O:<\/strong> 5\n<strong>E:<\/strong> 6\n<strong>PG Studente con Allevatore di Creature Magiche I:<\/strong> +2 al numero associato al\nproprio voto nella singola Creatura\n<strong>Numero associato ai PG Adulti<\/strong>\n<strong>PG Adulto senza Allevatore di Creature Magiche, che non ha frequentato CDCM:<\/strong> 3\n<strong>PG Adulto senza Allevatore di Creature Magiche, che ha frequentato CDCM:<\/strong> 7\n<strong>PG Adulto con Allevatore di Creature Magiche I:<\/strong> 8\n<strong>PG Adulto con Allevatore di Creature Magiche II:<\/strong> 9\n<strong>PG Adulto con Allevatore di Creature Magiche III:<\/strong> 10\n<strong>PG Adulto con Allevatore di Creature Magiche IV:<\/strong> 11\n<strong>PG Adulto con Allevatore di Creature Magiche V:<\/strong> 12\n<strong>Aggiungere Empatia:<\/strong> X (Voto nella singola Creatura/Allevatore di Creature; +2 a X\nse PG Studente con Allevatore I) + Empatia\n<strong>Classificazione<\/strong>\n<strong>X:<\/strong> //\n<strong>XX:<\/strong> -2\n<strong>XXX:<\/strong> -3\n<strong>XXXX:<\/strong> -4\n<strong>XXXXX:<\/strong> -5\n<em>Formula:<\/em> X (Voto nella singola Creatura/Allevatore di Creature; +2 a X se PG\nStudente con Allevatore I) + Empatia - Classificazione\nA seconda del risultato ottenuto, considera i seguenti range di riuscita al lancio di\n<strong>1d10<\/strong>. Le eventuali possibilità bonus fornite dall'utilizzo di un Oggetto o Conoscenza\nsi <strong>aggiungono al risultato del dado ottenuto<\/strong>:\n<strong>31+:<\/strong>\n• 0%: 1\n• 33%: 2\n• 66%: 3-4\n• 100%: 5-6-7-8-9-10\n<strong>27-30:<\/strong>• 0%: 1\n• 33%: 2\n• 66%: 3-4-5\n• 100%: 6-7-8-9-10\n<strong>21-26:<\/strong>\n• 0%: 1-2\n• 33%: 3-4\n• 66%: 5-6-7\n• 100%: 8-9-10\n<strong>14-20:<\/strong>\n• 0%: 1-2-3\n• 33%: 4-5\n• 66%: 6-7\n• 100%: 8-9-10\n<strong>7-13:<\/strong>\n• 0%: 1-2-3\n• 33%: 4-5-6\n• 66%: 7-8\n• 100%: 9-10\n<strong>0-6:<\/strong>\n• 0%: 1-2-3-4\n• 33%: 5-6-7\n• 66%: 8-9\n• 100%: 10<\/p>\n<p>• Un <strong>PG Studente<\/strong> tenta di fare accoppiare il suo <strong>Mooncalf<\/strong> (Classificazione\n<strong>XX<\/strong>).<\/p>\n<ul>\n<li>Voto della Conoscenza Mooncalf = <strong>Eccezionale<\/strong> → <strong>6<\/strong>;<\/li>\n<li><strong>Empatia 17<\/strong>;<\/li>\n<li>Classificazione XX = <strong>−2<\/strong>.\n<strong>Somma =<\/strong> 6 (Voto) + 17 (Empatia) − 2 (Classificazione) = <strong>21<\/strong>. La fascia è\n<strong>21–26<\/strong> ⇒ su <strong>1d10<\/strong>:\n• <strong>0%<\/strong>: 1–2\n• <strong>33%<\/strong>: 3–4\n• <strong>66%<\/strong>: 5–7\n• <strong>100%<\/strong>: 8–10\nQuindi, per ottenere il 100%, deve pescare 8–10; eventuali bonus in possibilità da Oggetti si\nsommano al risultato del dado.\n• • Un <strong>PG Adulto con Allevatore di Creature Magiche V<\/strong> vuole ottenere Ingredienti da\nun <strong>Unicorno<\/strong> (Classificazione <strong>XXXX<\/strong>).- Allevatore V → <strong>12<\/strong>;<\/li>\n<li><strong>Empatia 20<\/strong>;<\/li>\n<li>Classificazione XXXX = <strong>−4<\/strong>.\n<strong>Somma =<\/strong> 12 (Allevatore V) + 20 (Empatia) − 4 (Classificazione) = <strong>28<\/strong>. La\nfascia è <strong>27–30<\/strong> ⇒ su <strong>1d10<\/strong>:\n• <strong>0%<\/strong>: 1\n• <strong>33%<\/strong>: 2\n• <strong>66%<\/strong>: 3–5\n• <strong>100%<\/strong>: <strong>6–10<\/strong>\nQuindi, per ottenere il 100%, deve pescare 6–10; eventuali bonus in possibilità da Oggetti si\nsommano al risultato del dado.<\/li>\n<\/ul>\n<p>La percentuale ottenuta dal dado si traduce in un certo numero di post, a seconda della\ntipologia di PG che lo lancia, secondo lo schema qui sotto:<\/p>\n<p>Al numero di post ottenuto va eventualmente aggiunto il malus ottenuto nelle fasi di\nScoperta e Cura del Problema e, in caso di riuscita allo 0%, i seguenti malus:<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>• L'Allevamento di un <strong>Uovo/Neonato<\/strong> con riuscita allo <strong>0%<\/strong> significa che quel\ncucciolo non nascerà per problemi di salute. Esso è dunque da eliminare e non può essere\npiù utilizzato;\n• L'Allevamento di una <strong>Creatura Infante, Adolescente e Adulta<\/strong> allo <strong>0%<\/strong>,\nsignifica che la Creatura non produrrà nulla (nè Ingredienti nè cuccioli) per il Ciclo di\nProduzione o Riproduzione per cui si è lanciato il dado, il ciclo viene così \"sprecato\" e la\nCreatura, ipoteticamente, accorcia la sua vita.\n• L'Allevamento di una <strong>Creatura Anziana<\/strong> allo <strong>0% **significa che la Creatura\nnon riuscirà a produrre più nulla da quel momento in poi e quindi **morirà<\/strong>.<\/p>\n<p><strong>QUANTI INGREDIENTI O CUCCIOLI\nOTTENGO DALLA CREATURA MAGICA AL TERMINE DEL CICLO DI PRODUZIONE O\nRIPRODUZIONE?<\/strong>\nIl numero di Ingredienti e Cuccioli ottenuti dipende dall'esito dall'eventuale precedente Cura\ndella Creatura, dalla sua Classificazione e dal livello di conoscenza del PG rispetto alla\nCreatura Magica di riferimento. In caso di fallimento in fase di Cura (Scoperta e/o Cura del\nProblema), la Creatura Magica allevata darà da 1d2/2d2 Cuccioli in meno e impiegherà\n+5/10 post in più per completare ogni ciclo di Produzione o Riproduzione dell'Allevamento.\nOgni Creatura Magica produce un certo numero di Ingredienti e di cuccioli in base alla sua\nClassificazione.\n<strong>X:<\/strong> 1+1d5 Ingredienti e 1+1d4 Cuccioli in Riproduzione\n<strong>XX:<\/strong> 1+1d4 Ingredienti e 1+d3 Cuccioli in Riproduzione\n<strong>XXX:<\/strong> 1+1d3 Ingredienti e 1+1d2 Cuccioli in Riproduzione<strong>XXXX:<\/strong> 1+1d2 Ingredienti e 2 Cuccioli in Riproduzione\n<strong>XXXXX:<\/strong> 2 Ingredienti e 1 Cucciolo in Riproduzione\nQuesto significa che, al termine del Ciclo di Produzione/Riproduzione, il PG ottiene degli\nIngredienti e Cuccioli <strong>garantiti<\/strong> più degli extra che dipendono dal lancio di un dado,\nche dovrà lanciare in autonomia al termine di ogni ciclo.\n<strong>Ingredienti:<\/strong> sono utili per creare Pozioni o per essere\nvenduti e ricavarne un certo numero di Galeoni. Alcuni\npossono essere utilizzati anche in purezza e fornire bonus o malus.\n<strong>Cuccioli:<\/strong> sono utili perchè una volta cresciuti diventano nuove Creature da cui poter\nricavare Ingredienti ed ulteriori nuovi cuccioli, oppure utilizzarle sul campo di battaglia come\ndelle vere e proprie armi.\nSe la Creatura allevata può dare più di un Ingrediente diverso, il PG deve lanciare un dado\ncon facce corrispondenti ad ogni Ingrediente ottenibile per decretare quali raccoglie.<\/p>\n<p>Un PG si prende cura di un Unicorno. Ottiene da lui 1 ingrediente, ma l'Unicorno può dare\nsia Crini che polvere dal suo Corno.\nIl PG lancia 1d2 e stabilisce in partenza se 1 corrisponde al crine o al corno e viceversa. Il\nnumero estratto corrisponde all'ingrediente ottenuto.<\/p>\n<p><strong>CHE BONUS OTTENGO DALLA\nCREATURA CHE HO ALLEVATO PERSONALMENTE?<\/strong>\nDalla Creature Magiche che vengono allevate dai PG tramite tutto il processo di cui sopra si\npossono ottenere dei Bonus di Forza, Destrezza, Resistenza e/o Salute dall'Uovo/Cucciolo\ndi Creatura Magica che coltivano con successo.\nIl bonus è relativo <strong>a tutti i Parametri della Creatura Magica<\/strong> o alla <strong>durata degli\neffetti dei suoi attacchi/usi<\/strong> (es. Drakul).\n<strong>Allevatore di Creature Magiche I:<\/strong> +10%/+1 post\n<strong>Allevatore di Creature Magiche II:<\/strong> +15%/+1d2 post\n<strong>Allevatore di Creature Magiche III:<\/strong> +20%/+2 post\n<strong>Allevatore di Creature Magiche IV:<\/strong> +25%/+1+1d2 post\n<strong>Allevatore di Creature Magiche V:<\/strong> +30%/+3 post<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Le Creature possono dare anche parti del proprio corpo che però vengono considerate\ncome Oggetti da collezionismo e non come ingredienti, e che per questo possono essere\nprelevate soltanto con la forza tramite Remuvo. Di conseguenza, la\nloro vendita o il loro acquisto sono illegali.<\/p>\n<h2 id=\"le-orde\">Le Orde<\/h2>\n<p>Il PG che incontra\naccidentalmente un'orda di Creature, ovvero gruppi di Creature della stessa specie in piùesemplari (fino a 10 esemplari contemporaneamente), può provare a salvarsi in diversi modi\nse le Creature sono notoriamente pericolose e ostili:\n• Difendendosi con la magia;\n• Utilizzando incantesimi e tecniche Magizoologiche;\n• Utilizzando cibi o strumenti magici;\n• Provando ad interagire con loro contemporaneamente.\nIn quest'ultimo caso, più il livello di Amico delle Creature Magiche del PG è alto, più sono\nalte le probabilità che il PG riesca ad infondere fiducia nell'intera Orda.\nNella Fase di <strong>Fiducia<\/strong> con Creature Magiche appartenenti ad un'Orda, il PG\n<strong>divide le proprie possibilità per il numero di esemplari<\/strong> trovato.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p><strong>PG **senza **Amico delle Creature Magiche fra le Conoscenze<\/strong> che incontrano\nun'Orda di Creature (ossia più di una Creature contemporaneamente), possono provare ad\ninteragirvi contemporaneamente soltanto utilizzando cibi e/o strumenti magici, altrimenti il\ntentativo di interagirvi fallisce in partenza.\nNel caso in cui il PG riesca a interagire con tutte le Creature dell'Orda contemporaneamente,\nla gran parte di loro non si mostrerà comunque collaborativa per essere addomesticata:\nlanciando 1d2, ogni Creatura non sarà collaborativa, se 2, invece, ne troverà\n<strong>1dN°esemplari<\/strong> partecipi e ben disposti. Solo a quel punto il PG potrà provare a\nconquistare la loro Fiducia.<\/p>\n<p><strong>Con quante Creature il PG con Amico delle Creature Magiche interagisce\ncontemporaneamente?<\/strong>\nIl PG che incontra un'Orda e che vuole placarla senza utilizzare cibi o strumenti speciali,\ndopo aver eseguito quanto specificato dalla fase \"Fiducia\" (ricordando di dividere le\npossibilità base per il numero di esemplari trovati), lancia <strong>un dado corrispondente al\nnumero di Creature<\/strong> che si trova a fronteggiare contemporaneamente. L'esito del dado\ncorrisponde al totale di Creature con cui ha interagito contemporaneamente.\nAd esso aggiunge <strong>+1 possibilità<\/strong> per ogni livello di Amico delle Creature Magiche\nposseduto.<\/p>\n<h2 id=\"esempi\">Esempi:<\/h2>\n<p>• Un PG con <strong>Amico delle Creature II<\/strong> incontra un’Orda di <strong>7 Jarvey<\/strong>. Ha\neseguito la <strong>Fiducia<\/strong> dividendo le proprie possibilità totali per 7 e ha ottenuto <strong>esito\npositivo<\/strong>. Ora tira <strong>1d7<\/strong> e ottiene <strong>3<\/strong>; aggiunge <strong>+2<\/strong> (Amico II) =\n<strong>5<\/strong>. <strong>Risultato:<\/strong> il PG ha placato contemporaneamente <strong>5 Jarvey su 7<\/strong>.\n• Un PG con <strong>Amico delle Creature V<\/strong> incontra <strong>3 Matagot<\/strong>. Dopo aver\nsuperato la <strong>Fiducia<\/strong> (con le possibilità divise per 3), tira <strong>1d3<\/strong> e ottiene\n<strong>1<\/strong>; aggiunge <strong>+5<\/strong> (Amico V) = <strong>6<\/strong>.\n<strong>Risultato:<\/strong> ha placato <strong>tutti e 3<\/strong> i Matagot (l’eccesso oltre 3 è ininfluente). Se\nfossero stati <strong>10 Matagot<\/strong> e avesse ottenuto 1 su 1d10 (+5 = 6), avrebbe placato\n<strong>6 su 10<\/strong>, con <strong>4<\/strong> ancora ostili.<\/p>\n<p><strong>E se una o più Creature rimangono ostili al PG con Amico delle Creature Magiche?<\/strong>\nIl PG che riesce a difendersi dai loro attacchi, può tentare di placarle con l'uso di cibi o\nstrumenti magici, dell'incantesimo Imposium oppure riprovando ad interagirvi nello stesso\nmodo.\n<strong>Se il PG con Amico delle Creature Magiche placa un'intera orda di Creature, può\nprovare ad interagire con ognuna per portarle tutte nella sua Riserva?<\/strong>\nDelle Creature non più ostili, soltanto alcune si mostreranno disposte a farsi trasportare da\nlui. Il totale di Creature ben disposte corrisponde <strong>all'esito di un nuovo lancio di dado\nequivalente al totale di Creature facenti parte dell'orda<\/strong> in origine, +1 possibilità per ogni\nlivello di Amico delle Creature Magiche posseduto.\nIl PG può altresì scegliere volontariamente di concentrarsi solo su una di loro o su alcune.<\/p>\n<p>Il PG dell'esempio precedente riesce ad ammansire tutti e 7 i Jarvey. Lancia di nuovo 1d7 ed\nestrae il numero 1. A questo totale aggiunge 2, corrispondente al livello da lui posseduto di\nAmico delle Creature. 3 sono le Creature rimaste da lui che può adesso provare ad\naddomesticare contemporaneamente e a portare nella sua Riserva.<\/p>\n<h2 id=\"le-riserve\">Le Riserve<\/h2>\n<p>Perché una Creatura Magica possa crescere correttamente è necessario\naccudirla all'interno di una Riserva o in luoghi protetti dove venga ricreato magicamente il\nloro habitat e possano sopravvivere senza soffrire. Esse hanno anche una parte dedicata\nall'accoglienza momentanea di Creature ferite e in convalescenza, la Medicheria, da cui\npotranno essere liberate una volta guarite.\nLe Riserve o i Recinti (per PG\nStudenti) sono, ONGame, il luogo in cui i PG allevano fisicamente le Creature Magiche.\nOFFGame, la tracciatura delle creature, dei Cicli di Produzione e Riproduzione,\ndell'invecchiamento, della gestazione e schiusa è gestita automaticamente nella sezione\nRecinto/Riserva del proprio \"Il Mio Elfo Domestico\" (Adulti -\nStudenti).\nÈ possibile importare direttamente i dati dal Generatore di Magizoologia (mantenendo i\ncontrolli già risolti) e trasferire automaticamente i raccolti e gli ingredienti prodotti alla\nDispensa digitale.\nLo Staff ripone piena fiducia nei player e nella loro volontà di gestire in maniera corretta e\npulita il loro gioco senza ricorrere a scorciatoie o vie di fuga che potrebbero portare a\nspiacevoli disguidi e conseguenze, ma si riserva ovviamente di segnalare ai player eventuali\nscorrettezze notate nella gestione delle loro Riserve/Recinti.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Creature già addomesticate, ossia che fanno già parte della Riserva/Valigia del PG, in\nConvalescenza non hanno bisogno di essere spostate in Medicheria, poichè questa accoglie\nsoltanto Creature di passaggio\nQuest'ultime, una volta guarite, possono essere portate dal PG nella propria Riserva se\nsuperano positivamente la fase di \"Domesticazione\" oppure liberate.<\/p>\n<p>• Per ogni <strong>Studente<\/strong> di Hogwarts è messa a disposizione una piccola parte della\nRiserva nei Dintorni Ovest dove ciascuno può tenere il proprio\nRecinto, ma soltanto se i PG seguono Cura delle Creature\nMagiche.\nOgnuno di loro può accudire fino a 3, 5 o 7 Creature di Classificazione fra X e XXX in base\nall'anno di appartenenza, purché prima siano riusciti ad ottenere la loro Fiducia e ad\nAddomesticarle.\nONGame, allevare Creature XXXX o XXXXX o una Creatura eccedente le 3, 5 o 7\nconsentite, significa violare il Regolamento Scolastico e rischiare di incorrere in punizioni e\nperdita di Punti Casa.\nTuttavia, essi possono cercare di allevare cuccioli extra nel proprio Recinto, nella Foresta\nProibita, nella Stanza delle Necessità o in un altro luogo dei Dintorni di Hogwarts e sperare\ndi non essere scoperti. In questo caso, è necessario avvisare il Narratore perché narri per lui\nl'eventuale situazione e quel che potrebbe accadere.\nGli Studenti hanno inoltre all'interno del proprio recinto hanno anche uno spazio Medicheria\nper accudire momentaneamente 1 sola Creatura ferita, ammalata o in convalescenza che\nnon fa parte del suo Recinto, anche in questo caso fino a XXX.\nDiventati adulti, le creature presenti nel proprio Recinto possono essere spostate in\nun'eventuale nuova Riserva.\n• Agli <strong>Adulti non Magizoologi di Mestiere o PG Magizoologi di Mesterie con Prestigio\ninferiore a 36<\/strong> è consentito l'acquisto di <strong>Riserve Private<\/strong> in giro per il Mondo\nMagico. QUI il loro funzionamento.\nChi lo desidera, può scegliere di <strong>non<\/strong> registrare la Riserva Privata presso il Ministero\ndella Magia, compiendo tuttavia un'Azione Illegale a suo rischio e pericolo.\n<strong>Prezzi per le Riserve Private:<\/strong>\n• <strong>Riserva da 5 posti + 1 posto Medicheria<\/strong> per Creature Magiche di qualsiasi\nClassificazione, 500 Galeoni\n• <strong>Riserva da 10 posti + 2 posti Medicheria<\/strong> per Creature Magiche di qualsiasi\nClassificazione, 750 Galeoni\n• <strong>Riserva da 15 posti + 3 posti Medicheria<\/strong>, per Creature Magiche di qualsiasi\nClassificazione, 1000 Galeoni\n<strong>Prezzi per le Medicherie Private:<\/strong>\n• <strong>Medicheria da 3 posti,<\/strong> per Creature Magiche di qualsiasi Classificazione, 250\nGaleoni\n• <strong>Medicheria da 4 posti,<\/strong> per Creature Magiche di qualsiasi Classificazione, 350\nGaleoni\n• <strong>Medicheria da 5 posti<\/strong>, per Creature Magiche di qualsiasi Classificazione, 500\nGaleoni\nPG che possiedono una Riserva senza Medicheria possono accudire una Creatura in\nconvalescenza nella Medicheria della Riserva di un altro PG, se lo desiderano.\n• Ogni <strong>PG Magizoologo<\/strong> con <strong>Prestigio ≥ 36<\/strong> ha diritto ad avere una sua\nRiserva gratuita: ONGame il Ministero si occupa personalmente delle spese necessarie perla sua costruzione, OFFGame, invece, il PG ottiene gratuitamente una Riserva in cui posti\ndisponibili aumentano all'aumentare della Sapienza Magizoologica del PG.\nLa Riserva, dunque, è sempre la stessa, con la differenza che ONGame il PG acquista nuovi\nlotti di terra per espanderla di volta in volta grazie al sostegno del Ministero della Magia.\nOFFGame il PG che richiede l'acquisto di una nuova Sapienza Magizoologica, ossia di un\nnuovo pezzetto di Sapienza Magizoologica, può aumentare in autonomia il numero di posti\ndella propria Riserva. Qui come crearla.<\/p>\n<ul>\n<li><strong>Sapienza Magizoologica 1-5:<\/strong> Riserva da 3 posti e per Creature fino a XXX, 1 posto\nfino a XXXXX, 1 posto Medicheria per qualsiasi Classificazione;<\/li>\n<li><strong>Sapienza Magizoologica 6-11:<\/strong> Riserva da 5 posti per Creature fino a XXX, 3 posti\nfino a XXXXX, 2 posti Medicheria per qualsiasi Classificazione;<\/li>\n<li><strong>Sapienza Magizoologica 12-15:<\/strong> Riserva da 10 posti per Creature fino a XXX, 5\nposti fino a XXXXX, 3 posti Medicheria per qualsiasi Classificazione;<\/li>\n<li><strong>Sapienza Magizoologica 16-20:<\/strong> Riserva da 15 posti per Creature fino a XXX, 7\nposti fino a XXXXX. 4 posti Medicheria per qualsiasi Classificazione;<\/li>\n<li><strong>Sapienza Magizoologica 21-25:<\/strong> Riserva da 20 posti per Creature fino a XXX, 10\nposti fino a XXXXX, 5 posti Medicheria per qualsiasi Classificazione.\nUna Creatura può anche occupare un posto Riservato ad una Classificazione più alta di\nquella della propria (esempio una Creatura X può occupare un posto per Creature fino a\nXXXXX), ma non viceversa (una Creatura XXXXX non può occupare un posto per una\nCreature fino a XXX).<\/li>\n<\/ul>\n<h2 id=\"la-valigia-magica\">La Valigia Magica<\/h2>\n<p>Newt Scamander ha\ntrasmesso alle generazioni future di Erbologi e Magizoologi l'importanza di allevare e\ncoltivare <strong>Piante<\/strong> o <strong>Creature Magiche<\/strong> servendosi di una <strong>Valigia\nMagica<\/strong> — un artefatto incantato capace di contenere interi habitat, come una piccola\nserra o radura in miniatura.\nAttualmente il possesso di una Valigia Magica è <strong>consentito solo previa licenza ufficiale\ndel Ministero della Magia<\/strong>, rilasciata esclusivamente a <strong>maghi e streghe diplomati\nM.A.G.O.<\/strong> (o in possesso di un titolo equivalente per altre scuole di magia).\nSono pertanto <strong>illegali<\/strong> le valigie autoprodotte o acquistate tramite <strong>Commercio\nIllegale<\/strong>, e quindi i modelli venduti presso <em>Magie Sinister<\/em> senza regolare licenza\nministeriale.\n<strong>Funzione ed\nuso<\/strong>\nLa Valigia Magica consente di:\n• Procedere nelle Ricerche Casuali di Creature e Piante Magiche fino al <strong>Secondo e\nTerzo incontro consecutivo<\/strong> nella stessa role (vedi Ricerche Casuali - Creature e Ricerche Casuali - Piante);\n• <strong>Allevare o coltivare<\/strong> Creature e Piante al suo interno, utilizzandola come\n<strong>mini-Riserva<\/strong> o <strong>mini-Serra personale<\/strong>, a seconda delle necessità del PG;\n• <strong>Espandere<\/strong> la capacità di contenimento acquistando ulteriori <strong>posti\nclassificati<\/strong> (da X a XXXXX) secondo il\nprezzario relativo alla Valigia Magica.Una Valigia può essere <strong>rimpicciolita<\/strong> o <strong>nascosta<\/strong> per praticità, ma va sempre\nconsiderato l’effetto che questo ha sull’uso ONGame, ad esempio durante l’estrazione o il\nrichiamo delle Creature.\n<strong>Licenze, ruoli e\nlimiti<\/strong>\n— La <strong>licenza ufficiale<\/strong> è rilasciata unicamente a PG diplomati M.A.G.O. o\nequivalenti. Ogni licenza è valida per il possesso e l'acquisto di <strong>1 singola Valigia\nMagica<\/strong>. Ciò significa che per possedere più di una Valigia Magica, dalla seconda in poi\nè necessario <strong>produrla illegalmente ONGame, compiendo un'Azione Illegale, e compiere\nun'Azione Illegale ogni volta che si lancia un dado<\/strong> per qualsiasi tipologia di Fase della\ngestione di una Creatura/Pianta Magica ospitata al suo interno.\n— La Valigia è <strong>concessa gratuitamente<\/strong> ai <strong>PG Erbologi e Magizoologi di\nMestiere del Mondo Magico inglese<\/strong>, che rispettino i requisiti di cui sopra.\n— PG di altri mestieri possono invece <strong>acquistare la Valigia<\/strong> nei limiti di legge, al\ncosto indicato nel prezzario.\n— La Valigia può essere utilizzata sia nelle <strong>role libere<\/strong> che negli <strong>Eventi<\/strong>,\ncontando come <strong>1 Oggetto<\/strong> all’interno della\nBorsa del PG.\n— È possibile <strong>richiedere l’acquisto o le espansioni<\/strong> tramite la propria\nLista della Spesa.\nChi utilizza la Valigia come strumento stabile di ricerca o allevamento deve sempre\n<strong>tenere conto della Classificazione dei posti disponibili<\/strong>: una Creatura in allevamento\nall'interno di una Valigia occupa in modo permanente un posto, che non potrà più essere\nusato per Ricerche Casuali finché la Creatura ne occupa il posto.\n<strong>Valigie Illegali\n**\n— **Studenti<\/strong> non possono acquistare Valigie Magiche legali, ma possono ottenerne\nversioni <strong>illegali<\/strong> tramite autoproduzione o acquisto da\nMagie Sinister o il Corvo Candito.\n— L’incantesimo Adduco Maxima, se usato per creare\nuna Valigia, la rende <strong>illegale<\/strong> e <strong>danneggia permanentemente del 50%<\/strong> la\nSalute (e di conseguenza gli altri Parametri) delle Creature custodite, poiché l’habitat interno\nnon rispetta le condizioni minime di sopravvivenza.<\/p>\n<h2 id=\"i-collaboratori\">I Collaboratori<\/h2>\n<p>E' possibile assumere ONGame altri PG che possano gestire la Riserva\ndel PG, sia ONGame a livello di narrazione che OFFGame nel conteggio e nello svolgimento\ndei Cicli di Produzione.\nNon è tuttavia possibile assumere un Collaboratore soltanto OFFGame: il PG deve essere\nun Collaboratore anche ONGame.<strong>Collaboratori Magizoologi<\/strong>\nI PG in possesso di una Riserva, Magizoologi o meno, possono assumere dei Collaboratori\nMagizoologi di Mestiere che possano gestire per loro oppure collaborando la Riserva in\nquestione.\nEssi, infatti, ogni 10 Creature <strong>allevate<\/strong> da loro (ONGame e OFFGame) ottengono +1\nPrestigio, mentre i Proprietari, che possono godere di una migliore produttività, ricevono un\nbonus istantaneo di Galeoni per ogni Creatura allevata dal Collaboratore in base alla sua\nClassificazione.\n• <strong>X:<\/strong> 1 Galeone\n• <strong>XX:<\/strong> 2 Galeoni\n• <strong>XXX:<\/strong> 3 Galeoni\n• <strong>XXXX:<\/strong> 4 Galeoni\n• <strong>XXXXX:<\/strong> 5 Galeoni\nIl Collaboratore, avvertendo lo Staff dell'allevamento di una Creatura, segnala anche il bonus\nin Galeoni per il PG Proprietario della Riserva.\nInfine, Proprietario e Collaboratore, possono scegliere di dividersi i profitti delle Creature\nallevate (dal Collaboratore o da entrambi) in percentuali da loro stabilite.\n<strong>Collaboratori Non Magizoologi<\/strong>\nNon essendo Magizoologi di Mestiere, non ottengono il bonus di Prestigio previsto invece\nper Magizoologi di Mestiere. La collaborazione, dunque, è solo narrativa.<\/p>\n<h1 id=\"animali-e-creature-da-compagnia\">Animali e Creature da Compagnia<\/h1>\n<p>Tutti i\nPG del gioco, a prescindere dal fatto che siano o meno Magizoologi o che vogliano o meno\npossedere una Riserva o una Valigia in cui allevare Creature, possono possedere animali da\ncompagnia di piccola taglia (babbani o magici) e alcuni di questi possono dare perfino dei\nvantaggi ONGame.\n<strong>Ci sono però delle indicazioni da tenere a mente sia ONGame che OFFGame:\n**\n• I **PG Studenti<\/strong> possono introdurre ad Hogwarts <strong>un solo animale/creatura<\/strong> a\nscelta fra un gatto, un\nrospo, un gufo o una Puffola Pigmea: chiedendo il loro\nacquisto presso uno dei Negozi Magici è possibile poter\nsfruttare ONGame i bonus ad essi associati.\nAltri animali babbani di piccola taglia (come topi, conigli, criceti, ecc) possono essere accolti\nad Hogwarts, tuttavia senza dare alcun genere di vantaggio al PG proprietario, limitandosi\nad essere elementi puramente di colore; animali babbani di grossa taglia non possono\ninvece essere introdotti.\nAnimali babbani e Creature non acquistate o ottenute ONGame possono essere possedute\ne utilizzate senza ottenere da esse alcun vantaggio (continuando a rispettare anche in\nquesto caso i limiti di classificazione e numero imposti). L'acquisto può essere anche\nretroattivo: il PG che decide di voler sfruttare la creatura posseduta per ottenere dei vantaggi\nONGame può richiederne l'acquisto anche in un secondo momento.\nGli Studenti, infine, seguendo le direttive della Guida alla\nMagizoologia, possono tenere in un Recinto nella Radura di Curadelle Creature Magiche fino a tre Bestie (X-XXX), in aggiunta all'eventuale animale da\ncompagnia posseduto.\n• I <strong>PG Adulti<\/strong> possono possedere tutti gli animali babbani che desiderano. Tuttavia,\nsoltanto <strong>il gatto, il rospo e il gufo<\/strong> danno dei vantaggi ONGame: il PG deve\nacquistarli per poter sfruttare le loro capacità, oppure limitarsi a muoverli come elementi di\ncolore.\nEssi possono altresì acquistare presso il Serraglio Stregato anche Creature Magiche fra X e\nXXX <strong>fino a un massimo di tre<\/strong> in aggiunta ad eventuali animali babbani, numero oltre\nil quale sarà richiesta l'apertura di una Riserva Magica: PG che infrangono questa legge\npossono essere perseguitati penalmente ONGame; la stessa cosa accade se il PG acquista\ne possiede creature XXXX e XXXXX senza avere una Riserva.\nAnimali babbani e Creature non acquistate o ottenute ONGame possono essere possedute\ne utilizzate senza ottenere da esse alcun vantaggio (continuando a rispettare anche in\nquesto caso i limiti di classificazione e numero imposti). L'acquisto può essere anche\nretroattivo: il PG che decide di voler sfruttare la creatura posseduta per ottenere dei vantaggi\nONGame può richiederne l'acquisto anche in un secondo momento.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Per poter acquistare e possedere il , il Fiammagranchio, lo Fwooper, lo e il Jarvey è richiesta una\nspeciale licenza al prezzo di 150 Galeoni.\nEssa va ottenuta/acquistata se il PG decide di acquistare (o tenere con sé nel caso di una\nRicerca) una o più di queste Creature. Se il possesso della\nCreatura è di colore, l'acquisto non va effettuato.<\/p>\n<h2 id=\"continua-la-consultazione\">Continua la consultazione<\/h2>\n<ul>\n<li><a href=\"tecniche/\">Tecniche e Incantesimi Magizoologici<\/a><\/li>\n<li><a href=\"bestiario-guida/\">Come leggere il Bestiario<\/a><\/li>\n<li><a href=\"bestiario/\">Bestiario completo — 141 Creature<\/a><\/li>\n<\/ul>\n","aliases":["magizoologia","creature magiche","bestie","bestiario","riconoscimento","allevamento","riserve","snaso"]},"fiducia":{"title":"Magizoologia · Fiducia","subtitle":"Ottenere la Fiducia della Creatura Magica","crumb":["Regolamento","Manuali","Magizoologia","Fiducia"],"mode":"paper","html":"<p><strong>Tool interattivo:<\/strong> La Magizoologia Facile\nIl PG riesce ad infondere Fiducia nella Creatura Magica a partire dal proprio livello di\nconoscenze: più il livello è alto, più sono alte le possibilità di infondere fiducia nella Creatura\nMagica a partire dalla teoria precedentemente studiata e in più Creature magiche\ncontemporaneamente.\nPiù la Classificazione della Creatura è bassa, inoltre, più sono alte le possibilità di riuscire ad\navere la sua Fiducia.\nDi conseguenza, agli esiti sottostanti va aggiunto un certo numero di possibilità in base al\nlivello della Creatura con la quale si vuole interagire.\n• La procedura va eseguita <strong>per ogni PG<\/strong> che si trova ad interagire con la Creatura.\nSoltanto PG con \"<strong>Amico delle Creature<\/strong>\" possono estendere la Fiducia ricevuta da\nsé agli altri membri del suo gruppo ma soltanto perché non siano ostili nei loro confronti (non\npossono cioè anche portarle nella propria Riserva senza prima aver eseguito personalmente\nla ricerca di Fiducia da parte della Creatura).\n• La procedura va eseguita <strong>per ogni esemplare di Creatura Magica<\/strong> con cui si vuole\ninteragire. Con \"<strong>Amico delle Creature<\/strong>\" fra le Conoscenze, il PG sblocca la peculiare\ncapacità di poter infondere Fiducia <strong>contemporaneamente<\/strong> a più Creature. PG senza\nquesta Conoscenza possono farlo soltanto usando strumenti speciali (vedi <a href=\"../#le-orde\">Le Orde<\/a>).\n• Alcune Creature possono essere <strong>sempre ostili<\/strong> o <strong>mai ostili<\/strong>, di\nconseguenza:<\/p>\n<ul>\n<li>le Creature <strong>sempre ostili<\/strong> attaccano automaticamente i PG che non possiedono i\nrequisiti necessari per interagire con loro. Con <strong>Sapienza Magizoologica 1-15<\/strong> è\npossibile tentare la fase di Fiducia; con <strong>Sapienza Magizoologica 16+<\/strong>, dopo aver\nottenuto la Fiducia, è possibile procedere alla Domesticazione. Eventuali specie\nparticolarmente difficili possono prevedere requisiti o malus differenti, specificati nel relativo\nspecchietto;<\/li>\n<li>è estremamente semplice ottenere la Fiducia delle Creature <strong>mai ostili<\/strong>: qualsiasi\ntentativo di Fiducia riesce autoconclusivamente e non è necessario lanciare il dado.\nSvolgere questa azione costa <strong>-1 Fatica<\/strong>.<\/li>\n<\/ul>\n<h2 id=\"infondere-fiducia-nella-creatura-magica-1d30\">Infondere Fiducia nella Creatura Magica: 1d30<\/h2>\n<p><strong>Lancio 1d30<\/strong>: la Fiducia avviene correttamente se il PG pesca un esito favorevole,\ncon tante più possibilità quanto alto è il voto posseduto dallo Studente nella singola Creatura\no, per i PG Adulti, il valore previsto dalla propria preparazione e dall'eventuale livello di\n<strong>Amico delle Creature Magiche<\/strong>. Al totale previsto si aggiungono ulteriori possibilità in\nbase alla Classificazione della Creatura e all'Empatia del PG, più l'eventuale uso di\nOggetti/Conoscenze che forniscono un bonus in possibilità per questo lancio.\n<strong>Attenzione:<\/strong> se la Creatura trovata è nella Fase Vitale Uovo/Cucciolo, la Fiducia è\nautoconclusiva.<strong>Possibilità in base al Voto nella singola Creatura (PG Studenti)<\/strong>\n<strong>T:<\/strong> infonde Fiducia nella Creatura se 1-5\n<strong>D:<\/strong> infonde Fiducia nella Creatura se 1-6\n<strong>S:<\/strong> infonde Fiducia nella Creatura se 1-7\n<strong>A:<\/strong> infonde Fiducia nella Creatura se 1-8\n<strong>O:<\/strong> infonde Fiducia nella Creatura se 1-9\n<strong>E:<\/strong> infonde Fiducia nella Creatura se 1-10\n<strong>PG Studente con Amico delle Creature Magiche I:<\/strong> +2 possibilità al limite previsto dal\nproprio voto nella singola Creatura\n<strong>Possibilità per PG Adulti<\/strong>\n<strong>PG Adulto senza Amico delle Creature Magiche, che non ha frequentato CDCM:<\/strong>\ninfonde Fiducia nella Creatura se 1-7\n<strong>PG Adulto senza Amico delle Creature Magiche, che ha frequentato CDCM:<\/strong> infonde\nFiducia nella Creatura se 1-11\n<strong>PG Adulto con Amico delle Creature Magiche I:<\/strong> infonde Fiducia nella Creatura se\n1-12\n<strong>PG Adulto con Amico delle Creature Magiche II:<\/strong> infonde Fiducia nella Creatura se\n1-13\n<strong>PG Adulto con Amico delle Creature Magiche III:<\/strong> infonde Fiducia nella Creatura se\n1-14\n<strong>PG Adulto con Amico delle Creature Magiche IV:<\/strong> infonde Fiducia nella Creatura se\n1-15\n<strong>PG Adulto con Amico delle Creature Magiche V:<\/strong> infonde Fiducia nella Creatura se\n1-16\n<strong>Possibilità in aggiunta per livello di Classificazione della Creature:<\/strong>\n<strong>X:<\/strong> +3 possibilità\n<strong>XX<\/strong>: +2 possibilità\n<strong>XXX<\/strong>: //\n<strong>XXXX<\/strong>: -2 possibilità\n<strong>XXXXX<\/strong>: -3 possibilità\n<strong>Possibilità in aggiunta per Empatia:<\/strong>\nEmpatia/2, arrotondando per difetto\n<strong>Se il PG non ha riconosciuto la Creatura:<\/strong> -5 possibilità al totale\n<strong>1d30:<\/strong> se 1 - Voto nella singola Creatura/Lv. Amico delle Creature (+2 se PG\nStudente con Amico I) + Classificazione Creatura + (Empatia/2) + Uso di\nOggetti/Conoscenze su 30\nLa Fiducia diventa <strong>autoconclusiva<\/strong> se la somma raggiunge o supera il totale del\ndado (<strong>30<\/strong>).<\/p>\n<p>• Un PG Studente si trova ad avere a che fare con un Ippogrifo (Classificazione XXX). Ha\nvoto <strong>“O” nella Conoscenza dell'Ippogrifo<\/strong> (infonde Fiducia nella Creatura se 1-9) e\n<strong>Empatia 12<\/strong> → (Empatia/2 = +6). La Creatura è XXX → nessun modificatore.\n<strong>Totale=<\/strong> 1-9 + 6 = <strong>15 possibilità<\/strong>. Pertanto, il PG infonde Fiducia con un\nrisultato da <strong>1 a 15 su 1d30<\/strong>.\nIl PG che lo ha fra le Conoscenze, sa che bisogna prima inchinarsi per stabilire un contatto\ndi Fiducia. Se il PG pesca un possibilità, l'Ippogrifo si inchinerà, altrimenti si rifiuterà. Se\nottiene un successo, l’Ippogrifo si inchina al PG e riconosce la sua sicurezza; se fallisce, si\nrifiuta e resta diffidente.\n• Un <strong>Graphorn<\/strong> (XXXX) sembra pronto ad attaccare i PG intrusi. Uno dei PG\npossiede <strong>Amico delle Creature Magiche II<\/strong> (infonde Fiducia nella Creatura se 1-13),\n<strong>Empatia 10<\/strong> → (Empatia/2 = +5) e la Classificazione XXXX dà −2 possibilità.\n<strong>Totale= **1-13 + 5 − 2 = **16 possibilità<\/strong>. Pertanto, il PG infonde Fiducia con un\nrisultato da <strong>1 a 16 su 1d30<\/strong>.\nIn caso si esito positivo, riesce a infondere Fiducia e il Graphorn non lo attacca. Se fallisce\n(17–30), lancia 1d4 per determinare l’esito: 1–3 il Graphorn si allontana, 4 diventa ostile e\nserve il Narratore.<\/p>\n<p>In caso di fallimento il PG può tentare la fase di Fiducia tutte le volte che vuole, ma...<\/p>\n<p><strong>COSA SUCCEDE SE FALLISCO LA\nFASE DI FIDUCIA?<\/strong>\nL'esito negativo della fase di Fiducia può portare a diverse conseguenze a seconda della\nFase Vitale in cui si trova la Creatura Magica:\n• <strong>Uovo **• la Fiducia è **autoconclusiva **(non è necessario lanciare alcun\ndado);\n• **Creatura Infante<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d4<\/strong>: se\n1-2-3 la Creatura resta ed ignora i PG, se 4 si allontana;\n• <strong>Creatura Adolescente<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d4<\/strong>:\nse 1-2 la Creatura resta ed ignora i PG, se 3 la Creatura si allontana, se 4 diventa ostile;\n• <strong>Creatura Adulta<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d4<\/strong>: se 1-2\nla Creatura si allontana, se 3-4 diventa ostile;\n• <strong>Creatura Anziana<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d4<\/strong>: se\n1-2-3 la Creatura si allontana, se 4 la Creatura ha avuto modo di ripensarci e l’interazione\ndiventa positiva.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>• Nel caso in cui la Creatura diventi ostile, il PG deve chiamare il Narratore che seguirà il\nproseguo della role fino alla successiva fase dell'interazione.\nIl PG che ottiene dalla Creatura ostilità, dopo aver eventualmente scongiurato il pericolo,\npuò provare a placarla una seconda volta lanciando un nuovo dado Fiducia (con un malus di\n-3 possibilità) oppure utilizzando strumenti o altre tecniche che possano aumentarne le\npossibilità, come la Mimica-Limbica, l'Imitazione o l'incantesimo Imposium.\nPlacare una Creatura ostile significa avere successo nella fase di Fiducia.• Ciò che è specificato nella fase di Fiducia vale anche per provare ad interagire con alcuni\nEsseri e Spiriti senza scatenare la loro ostilità, salvo diverse specifiche negli specchietti delle\nsingole Creature.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>•PG Studenti e Adulti subiscono ONGame una ferita da taglio per via di una Creatura\nMagica contraggono l'Artigliatite se, lanciando 1d15,\npescano 1-3.\n• PG che allevano (il dado va lanciato assieme ad ogni dado di Produzione degli Ingredienti)\nuna Creatura Magica XXXX o XXXXX contraggono l'Ira se,\nlanciando 1d20, pescano 1.<\/p>\n<h2 id=\"continua-la-consultazione\">Continua la consultazione<\/h2>\n<ul>\n<li><a href=\"../#riconoscimento-della-creatura-magica\">Riconoscimento della Creatura Magica<\/a><\/li>\n<li><a href=\"../#cura\">Cura della Creatura<\/a><\/li>\n<li><a href=\"../domesticazione/\">Domesticazione<\/a><\/li>\n<li><a href=\"../\">Guida alla Magizoologia<\/a><\/li>\n<\/ul>\n","aliases":["fiducia","infondere fiducia","amico delle creature"]},"domesticazione":{"title":"Magizoologia · Domesticazione","subtitle":"Addomesticare e creare un rapporto stabile con la Creatura","crumb":["Regolamento","Manuali","Magizoologia","Domesticazione"],"mode":"paper","html":"<p><strong>Tool interattivo:<\/strong> La Magizoologia Facile\nLa fase di Domesticazione è quella fase in cui il PG, dopo aver ottenuto la Fiducia della\nCreatura, decide di portarla con sé nella propria Riserva per accudirla e sfruttarne le\ncapacità ed i vantaggi.\n<strong>Non è necessario<\/strong> svolgere questa fase per le Creature che nascono all'interno della\npropria Riserva, ovvero per le Creature che vengono trovate durante la Ricerca in fase di\nUovo/Cucciolo oppure per le Creature Uovo/Cucciolo nate dalla Fase di Riproduzione di una\nCreatura già Addomesticata.\nMaggiore è l'Empatia e la conoscenza del PG sulla Creatura di riferimento, maggiore è la\npossibilità di addomesticarla quanto prima.\nPiù è alta la Classificazione della Creatura di riferimento, maggiore è il rischio di farla\narrabbiare.\nIl PG che ottiene un esito favorevole da questa fase, riesce ad addomesticare\ncompletamente la Creatura, che adesso gli è fedele e ubbidiente; a portarla con sé nella sua\nRiserva o all'interno della sua Valigia Magica; a indurla a placarsi se sta combattendo con\naltre Creature.\nLe Creature addomesticate diventano parte della riserva del PG, che può dunque attribuire\nloro un nome per dare a ciascuna di esse una sua identità e distinguerla dalle altre.\nOFFGame può altresì dar loro delle caratteristiche comportamentali e caratteriali puramente\ndi colore.\nSvolgere questa azione costa <strong>-2 Fatica<\/strong>.<\/p>\n<h2 id=\"addomesticare-una-creatura-1d35\">Addomesticare una Creatura: 1d35<\/h2>\n<p><strong>Lancio di 1d35:<\/strong> il PG riesce ad addomesticare una Creatura Magica se pesca un\nesito compreso fra 1 e la sua Empatia + Bonus legato al voto nella singola Creatura/valore\nAdulto o Livello di Addestratore di Creature + Classificazione, aggiungendo se ottenuto ilbonus da Cura del Problema + l'eventuale uso di Oggetti/Conoscenze che forniscono un\nbonus in possibilità per questo lancio.\n<strong>Base:<\/strong> 1-Empatia su 1d35\n<strong>Aumento possibilità in base al Voto nella singola Creatura (PG Studenti)<\/strong>\n<strong>T:<\/strong> //\n<strong>D:<\/strong> //\n<strong>S:<\/strong> +1 possibilità\n<strong>A:<\/strong> +2 possibilità\n<strong>O:<\/strong> +3 possibilità\n<strong>E:<\/strong> +4 possibilità\n<strong>PG Studente con Addestratore di Creature Magiche I:<\/strong> +2 possibilità al valore\nprevisto dal proprio voto nella singola Creatura\n<strong>Possibilità per PG Adulti<\/strong>\n<strong>PG Adulto senza Addestratore di Creature, che non ha frequentato CDCM:<\/strong> +1\npossibilità\n<strong>PG Adulto senza Addestratore di Creature, che ha frequentato CDCM:<\/strong> +1d4\nPossibilità\n<strong>PG Adulto con Addestratore di Creature Lv I:<\/strong> +5 possibilità\n<strong>PG Adulto con Addestratore di Creature Lv II:<\/strong> +6 possibilità\n<strong>PG Adulto con Addestratore di Creature Lv III:<\/strong> +7 possibilità\n<strong>PG Adulto con Addestratore di Creature Lv IV:<\/strong> +8 possibilità\n<strong>PG Adulto con Addestratore di Creature Lv V:<\/strong> +9 possibilità\n<strong>Possibilità in aggiunta per livello di Classificazione della Creatura<\/strong>\n<strong>X:<\/strong> +3 possibilità\n<strong>XX<\/strong>: +2 possibilità\n<strong>XXX<\/strong>: //\n<strong>XXXX<\/strong>: -2 possibilità\n<strong>XXXXX<\/strong>: -3 possibilità\nAggiungere eventuale bonus da \"Cura del problema\"\n<strong>Formula:<\/strong> 1 - Empatia + Voto nella singola Creatura/Lv. Addestratore di\nCreature (+2 se PG Studente con Addestratore I) + Classificazione Creatura + Bonus Cura\ndel Problema + Uso di Oggetti/Conoscenze su 35<\/p>\n<p>• Un <strong>PG Studente<\/strong> prova ad addomesticare un <strong>Ippogrifo<\/strong> (Classificazione\nXXX).<\/p>\n<ul>\n<li><strong>Empatia 12<\/strong> → 1-12;<\/li>\n<li>voto <strong>E<\/strong> nella Conoscenza dell’Ippogrifo → <strong>+4 possibilità<\/strong> (tabella\nDomesticazione);<\/li>\n<li>Classificazione XXX → <strong>0<\/strong>; nessun bonus da Cura/oggetti.\n<strong>Totale =<\/strong> 1-12 (Empatia) + 4 (Voto) + 0 (Classificazione) = <strong>16<\/strong>. Pertanto, il\nPG riesce ad addomesticare l’Ippogrifo con un risultato da <strong>1 a 16 su 1d35<\/strong>.• Un <strong>PG Adulto con Addestratore di Creature Magiche II<\/strong> prova ad addomesticare\nun <strong>Jarvey<\/strong> (Classificazione XXX). <strong>Empatia 15<\/strong> → 1-15;<\/li>\n<li><strong>Addestratore II<\/strong> → <strong>+6 possibilità<\/strong>;<\/li>\n<li>Classificazione XXX → <strong>0<\/strong>; nessun bonus da Cura/oggetti.\n<strong>Totale =<\/strong> 1-15 (Empatia) + 6 (Addestratore II) + 0 (Classificazione) = <strong>21<\/strong>.\nPertanto, il PG riesce ad addomesticare il Jarvey con un risultato da <strong>1 a 21 su 1d35<\/strong>.\n• Un <strong>PG Adulto che ha frequentato CDCM, senza Addestratore di Creature\nMagiche<\/strong>, tenta di dare ordini a delle <strong>Fate<\/strong> (Classificazione XX).<\/li>\n<li><strong>Empatia 20<\/strong> → 1-20;<\/li>\n<li><strong>Adulto con CDCM, senza Addestratore<\/strong> → <strong>+1d4<\/strong> possibilità. Il PG lancia\n1d4 e ottiene <strong>2<\/strong>;<\/li>\n<li>Classificazione XX → <strong>+2<\/strong>; nessun bonus da Cura/oggetti.\n<strong>Totale =<\/strong> 1-20 (Empatia) + 2 (risultato 1d4) + 2 (Classificazione) = <strong>24<\/strong>.\nPertanto, impartisce ordini alle Fate con un risultato da <strong>1 a 24 su 1d35<\/strong>.<\/li>\n<\/ul>\n<p><strong>COSA SUCCEDE SE NON RIESCO\nAD ADDOMESTICARE LA CREATURA?<\/strong>\nSe il tentativo di addomesticare la Creatura <strong>fallisce<\/strong>, il PG può riprovare ad\naddomesticarla dopo 5 post qualsiasi del PG (nella stessa role o in altre role) o dopo una\nsettimana di tempo OFFGame.\nInoltre, il PG deve lanciare un dado nel caso in cui si tratta di una <strong>Creatura non già\naddomesticata e quindi che non è ancora parte della propria Riserva<\/strong>. L'esito negativo\ndella fase di Domesticazione può portare a diverse conseguenze a seconda della Fase\nVitale in cui si trova la Creatura Magica:\n• <strong>Creatura Infante<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d7<\/strong>: con\nrisultato 7 diventa ostile;\n• <strong>Creatura Adolescente<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d5<\/strong>:\ncon risultato 5 diventa ostile;\n• <strong>Creatura Adulta<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d5<\/strong>: con\ncon risultato 4-5 diventa ostile;\n• <strong>Creatura Anziana<\/strong> • se il risultato del dado è negativo, lanciare <strong>1d5<\/strong>: con\nrisultato 5 la Creatura ha avuto modo di ripensarci e la Domesticazione diventa positiva.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>• Nel caso in cui la Creatura diventi ostile, il PG deve chiamare il Narratore che seguirà il\nproseguo della role fino alla successiva fase dell'interazione.\nIl PG che ottiene dalla Creatura ostilità, dopo essersi eventualmente difeso, può provare a\nplacarla lanciando un nuovo dado Fiducia (con un malus di -3 possibilità) oppure utilizzando\nstrumenti o altre tecniche che possano aumentarne le possibilità, come la Mimica-Limbica,\nl'Imitazione o l'incantesimo Imposium.\n• Ciò che è specificato nella fase di Addomesticazione vale anche per provare ad interagire\ncon alcuni Esseri e Spiriti senza scatenare la loro ostilità, salvo diverse specifiche negli\nspecchietti delle singole Creature.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>•PG Studenti e Adulti subiscono ONGame una ferita da taglio per via di una Creatura\nMagica contraggono l'Artigliatite se, lanciando 1d15,\npescano 1-3.\n• PG che allevano (il dado va lanciato assieme ad ogni dado di Produzione degli Ingredienti)\nuna Creatura Magica XXXX o XXXXX contraggono l'Ira se,\nlanciando 1d20, pescano 1.<\/p>\n<p><strong>E' necessario tenere a mente le seguenti indi
