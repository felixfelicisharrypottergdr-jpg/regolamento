cazioni nel momento in cui si svolge la fase\ndi Domesticazione di una Creatura Magica:<\/strong>\n• Non è necessario lanciare il dado della Domesticazione quando si vuole accudire un Uovo.\n• La Domesticazione è utile anche se la Creatura che fa già parte della propria Riserva litiga\no assume atteggiamenti ostili nei confronti del padrone o di altre Creature. In questo caso\nnon è necessario ripetere la fase di Fiducia.\n• Una Creatura addomesticata può essere addestrata per\nrendersi utile ai Medimagi e curare delle vite.\n• <strong>Vendere, abbandonare, donare o in generale liberarsi<\/strong> una Creatura Infante,\nAdolescente, Adulta o Anziana <strong>già addomesticata<\/strong> (ossia già accolta in\nRiserva/Valigia) per fare posto ad un'altra comporta un malus di -5 Empatia per i successivi\n10 utilizzi utili del Parametro Empatia, a meno che essa non sia un Uovo o non venga\nvenduta prima di essere Addomesticata ai PNG commercianti.\n• E' possibile <strong>donare ad un altro PG<\/strong> una Creatura trovata dalla quale si è ottenuta\nFiducia se il PG donatore non possiede una Riserva o una Valigia Magica oppure non\nvuole/non può occuparsi della Creatura di cui ha ottenuto la Fiducia.\nIl PG a cui viene donata dovrà prima ottenere la sua Fiducia con un bonus di +5 possiblità\nper essersi già fidata del donatore.\n• Uccidere senza ragione una Creatura già addomesticata (ossia già accolta in Riserva) per\nfare posto ad un'altra comporta un malus di -15 Empatia per i successivi 20 utilizzi del\nParametro Empatia.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>• Con <strong>Sapienza Magizoologica 25<\/strong> il PG è in grado di capire alla perfezione i versi\ndelle Creature come riuscisse a leggerle nella mente.\n• Si ricorda che possedere la Conoscenza Avanzata Custode delle Creature Magiche\nsblocca le abilità: \"Insieme per sempre\", \"Creature Medimaghe\", \"Richiamare le Creature\nMagiche\" e \"Salvataggio del Padrone\" (vedi <a href=\"../tecniche/\">Tecniche e Incantesimi Magizoologici<\/a>).<\/p>\n<h2 id=\"continua-la-consultazione\">Continua la consultazione<\/h2>\n<ul>\n<li><a href=\"../fiducia/\">Fiducia<\/a><\/li>\n<li><a href=\"../#cura\">Cura della Creatura<\/a><\/li>\n<li><a href=\"../#allevamento\">Allevamento<\/a><\/li>\n<li><a href=\"../\">Guida alla Magizoologia<\/a><\/li>\n<\/ul>\n","aliases":["domesticazione","addomesticare","addestratore di creature"]},"manuale-incantesimi":{"title":"Manuale degli Incantesimi","subtitle":"Specchietti ricercabili singolarmente","crumb":["Regolamento","Manuali","Incantesimi"],"mode":"paper","html":"\n<h1 id=\"manuale-incantesimi\">Manuale degli Incantesimi<\/h1>\n<p>Pagina campione per verificare come la ricerca tratta i singoli specchietti: ogni Incantesimo è una voce autonoma e ricercabile.<\/p>\n<h2 id=\"incantesimi-autoconclusivi\">Incantesimi Autoconclusivi<\/h2>\n<article class=\"search-unit spell-card\" id=\"wingardium-leviosa\"\n  data-search-title=\"Wingardium Leviosa\"\n  data-search-path=\"Manuali › Incantesimi › Autoconclusivi\"\n  data-search-aliases=\"wingardium leviosa, leviosa\"\n  data-search-kind=\"Incantesimo\">\n  <h3>Wingardium Leviosa*<\/h3>\n  <p><strong>Fa levitare il bersaglio.<\/strong> Funziona soltanto sugli oggetti non magici e magici. Non funziona sugli esseri viventi.<\/p>\n  <dl class=\"spec-grid\">\n    <div><dt>Famiglia<\/dt><dd>Autoconclusivi<\/dd><\/div>\n    <div><dt>Parametro<\/dt><dd>Potenza<\/dd><\/div>\n    <div><dt>Forza<\/dt><dd>50<\/dd><\/div>\n    <div><dt>Fatica<\/dt><dd>0<\/dd><\/div>\n    <div><dt>Bersaglio<\/dt><dd>Singolo<\/dd><\/div>\n    <div><dt>Gittata<\/dt><dd>Lunga<\/dd><\/div>\n  <\/dl>\n  <details><summary><strong>Specifiche<\/strong><\/summary>\n    <p><strong>Durata:<\/strong> finché l’evocatore mantiene il controllo della levitazione.<\/p>\n    <p><strong>Parametro del bersaglio intaccato:<\/strong> //<\/p>\n    <p>Non è possibile utilizzare altri incantesimi contemporaneamente al Wingardium Leviosa.<\/p>\n  <\/details>\n<\/article>\n<p class=\"prototype-note\">Nel regolamento completo qui comparirebbero anche gli altri Incantesimi. Per il test ne abbiamo inserito uno soltanto.<\/p>\n","aliases":["incantesimi","manuale incantesimi"]},"bestiario-demo":{"title":"Bestiario","subtitle":"Specchietti delle Creature Magiche","crumb":["Regolamento","Manuali","Magizoologia","Bestiario"],"mode":"paper","html":"\n<h1 id=\"bestiario\">Bestiario<\/h1>\n<p>Pagina campione del Bestiario. Ogni Creatura è trattata dalla ricerca come una voce autonoma, anche quando molte Creature si trovano nella stessa pagina.<\/p>\n<h2 id=\"bestie\">Bestie<\/h2>\n<article class=\"search-unit creature-card\" id=\"snaso\"\n  data-search-title=\"Snaso\"\n  data-search-path=\"Manuali › Magizoologia › Bestiario › Bestie\"\n  data-search-aliases=\"snaso, niffler\"\n  data-search-kind=\"Creatura\">\n  <h3>Snaso<\/h3>\n  <p>Lo Snaso è una piccola Bestia magica originaria dell'Inghilterra, facilmente riconoscibile per il corpo ricoperto da una folta pelliccia nera e per il lungo muso. È una Creatura sotterranea e un'eccellente scavatrice, celebre soprattutto per l'attrazione quasi irresistibile per tutto ciò che luccica.<\/p>\n  <dl class=\"spec-grid\">\n    <div><dt>Categoria<\/dt><dd>Bestia<\/dd><\/div>\n    <div><dt>Classificazione<\/dt><dd>XXX<\/dd><\/div>\n    <div><dt>Legalità<\/dt><dd>Legale<\/dd><\/div>\n    <div><dt>Ostilità<\/dt><dd>Neutrale<\/dd><\/div>\n    <div><dt>Forza<\/dt><dd>30<\/dd><\/div>\n    <div><dt>Salute<\/dt><dd>50<\/dd><\/div>\n    <div><dt>Resistenza<\/dt><dd>15<\/dd><\/div>\n    <div><dt>Destrezza<\/dt><dd>25<\/dd><\/div>\n  <\/dl>\n  <h4 id=\"snaso-abilita\">Abilità<\/h4>\n  <p><strong>Cercatore di tesori:<\/strong> quando accompagna il PG può trovare Galeoni, piccoli oggetti preziosi o semplici cianfrusaglie luccicanti.<\/p>\n  <p><strong>Attrazione irresistibile:<\/strong> durante Quest ed Eventi la continua ricerca di oggetti brillanti distrae il Padrone.<\/p>\n  <h4 id=\"snaso-ingredienti\">Ingredienti ottenibili<\/h4>\n  <ul><li>Pelo di Snaso<\/li><li>Unghia di Snaso<\/li><\/ul>\n<\/article>\n<p class=\"prototype-note\">Nel Bestiario completo gli altri specchietti saranno indicizzati allo stesso modo.<\/p>\n","aliases":["bestiario","creature magiche","bestie"]},"scolastiche":{"title":"2. Conoscenze Scolastiche","subtitle":"Cosa sono e come si usano","crumb":["Regolamento","Conoscenze","Scolastiche"],"mode":"paper","html":"\n<p><a id=\"cosasono\"><\/a><\/p>\n<h2 id=\"cosasono\">Cosa sono e come si usano<\/h2>\n<p>Le Conoscenze Scolastiche (riconoscibili dal simbolo ) sono tutti quegli Incantesimi, Conoscenze, Pozioni, Creature, ecc., che vengono insegnate ai PG Studenti tra le mura di Hogwarts, durante le lezioni che gli studenti e le studentesse frequentano quotidianamente da background.<br/>\nSono suddivise per categoria (Offensive, Difensive, Erbologiche, Magizoologiche, ecc.) e per anno scolastico (V, VI e VII) e si posizionano all'interno del Piano di Studi dei PG Studenti ciascuna sotto una Materia Scolastica.<\/p>\n<ul>\n<li><strong>PG Studenti<\/strong> conoscono autoconclusivamente tutte le Conoscenze Scolastiche del Piano di Studi del loro anno e di quelli precedenti. Maturano la loro padronanza attraverso il miglioramento del Voto Scolastico della Conoscenza e della media del voto della materia a questa appartiene. Possono inoltre acquistareo apprendereConoscenze Scolastiche degli anni successivi che ancora non conoscono;<\/li>\n<li><strong>PG Adulti<\/strong> conoscono autoconclusivamente tutte le Conoscenze Scolastiche. Possono scegliere, alla creazione del PG, <strong>3 delle materie facoltative<\/strong> seguite durante la loro carriera scolastica tra Aritmanzia, Antiche Rune, Babbanologia, Cura delle Creature Magiche e Divinazione (se nati dal 2007 in su, obbligatoriamente Babbanologia) di cui acquisire da background le relative Conoscenze Scolastiche.<br/>\nL'uso delle Conoscenze Scolastiche può essere autoconcluso nelle Free role solo e soltanto se utilizzato per dare colore alle proprie role, ovvero se non offrono alcun tipo di vantaggio materiale né rischiano di causare danni a cose o persone. Per qualsiasi altro utilizzo che non sia una semplice nota per arricchire il proprio post, va richiesto l'intervento del Narratore che provvederà a descrivere l'esito dell'utilizzo della Conoscenza.<\/li>\n<\/ul>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Le Fatture, riconoscibili dal simbolo ( ) , sono incluse nelle Conoscenze Scolastiche perchè facili da evocare/creare/utilizzare ma il loro uso ad Hogwarts è vietato e per questo motivo non vengono insegnate.<br/>\nEsse dunque non fanno parte delle conoscenze degli studenti come tutte le altre Conoscenze Scolastiche, a meno che non vengano acquistate o ottenute in altro modo.<\/p>\n<p><a id=\"elencoscola\"><\/a><\/p>\n<h2 id=\"elencoscola\">Elenco delle Conoscenze Scolastiche<\/h2>\n<p><strong>ANTICHE RUNE<\/strong><\/p>\n<p>Benedizioni Runiche (VI)<br/>\nRunista Magico H (VII)<br/>\nScritture Runiche H (V)<\/p>\n<p><strong>ARCAICHE<\/strong><\/p>\n<p>Homenum Revelio H (V)<br/>\nProteus H (V)<br/>\nRevelio H (V)<\/p>\n<p><strong>ARITMANZIA<\/strong><\/p>\n<p>Sigillo di Archimede H (V)<br/>\nSigillo di Euclide H (VII)<br/>\nSigillo di Pitagora H (VI)<\/p>\n<p><strong>ASTRONOMIA<\/strong><\/p>\n<p>Magia Astrale Avanzata H (VI)<br/>\nMagia Astrale Base H (V)<br/>\nRiti Astronomici H (VII)<\/p>\n<p><strong>BABBANOLOGIA<\/strong><\/p>\n<p>Babbano Dentro H (VII)<br/>\nCultura Babbana H (V)<br/>\nManualità Babbana H (VI)<\/p>\n<p><strong>DIFENSIVE<\/strong><\/p>\n<p>Arania Exumai H (V)<br/>\nAscendio (VI)<br/>\nCarpe Retractum H (VI)<br/>\nExpecto Patronum H (VI)<br/>\nExpelliarmus H (V)<br/>\nFinite Incantatem H (V)<br/>\nLiberacorpus H (V)<br/>\nMobiliarbus H (V)<br/>\nProtego H (V)<br/>\nRelascio H (VI)<br/>\nRiddikulus H (V)<br/>\nSkurge H (V)<br/> ante eccetera di un livello già troppo avanzato per poter essere insegnate ad Hogwarts, la cui padronanza necessita un maggiore studio ed approfondimento. Sono Conoscenze di nicchia, prerogativa dei PG Adulti che possiedono la Sapienza affine e che sanno quindi eseguirle senza errori, ma possono comunque essere apprese, ottenute e conosciute da tutti gli altri PG Adulti e Studenti secondo le modalità spiegate di seguito.<\/p>\n<ul>\n<li>I <strong>PG Studenti<\/strong> non le conoscono di default, ma possono apprenderle acquistandoleoppure imparandoledai PNG di Hogwarts o da altri PG - con qualche malus sull'efficacia. Acquistare una Conoscenza Extra, per un PG Studente, significa aver approfondito in autonomia la branca magica di suo interesse, al punto da apprendere conoscenze precluse ai suoi coetanei, per esempio acquistando manuali, facendo ricerche in biblioteca, discutendo di specifici argomenti - a meno che non si tratti di Conoscenze Oscure - con i docenti della scuola. Questi sono degli esempi di spunti che servono a giustificare l'acquisto della Conoscenza OFFGame.<br/>\nProprio perché di livello superiore rispetto alle Conoscenze Scolastiche, anche le Conoscenze Extra posseggono un loro voto e vanno costantemente migliorate come le Conoscenze del Piano di Studi, per far sì che i PG Studenti possano padroneggiarle alla perfezione.<br/>\nNel vedere o sentire parlare di una Conoscenza Extra non presente nella loro Scheda PG, possono dire di sapere di cosa si tratta - ma senza sapere come evocarla - se, lanciando 1d2, <strong>pescano 1<\/strong>.<\/li>\n<li>I <strong>PG Adulti<\/strong> conoscono di default tutte le Conoscenza Extra affini alle Sapienze da loro possedute e sanno evocarle alla perfezione. PG Adulti senza Sapienza, invece, possono acquisire qualsiasi altra Conoscenza Extra acquistandola o imparandola da altri PG - con qualche malus di efficacia. Saranno ovviamente più efficaci nell'evocare le Conoscenze Extra affini alle loro Sapienze che non le altre. Esattamente come per i PG Studenti, anche per loro acquistare una Conoscenza Extra significa approfondire autonomamente la branca di interesse, studiando su manuali acquistati o libri presi in prestito o discutendo liberamente con esperti della materia.<br/>\nLe Conoscenze Extra sono 8 per ciascuna delle 12 Sapienze, più un gruppo di Pozioni Fatturanti. L'uso delle Conoscenze Extra può essere autoconclusivo nelle Free role solo e soltanto se utilizzato per dare colore alle proprie role, ovvero se non offrono alcun tipo di vantaggio materiale né rischiano di causare danni a cose o persone. Per qualsiasi altro utilizzo che non sia una semplice nota per arricchire il proprio post, va richiesto l'intervento del Narratore che provvederà a descrivere l'esito dell'utilizzo della Conoscenza.<\/li>\n<\/ul>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Le Conoscenze Extra Oscure e le Pozioni Fatturanti, riconoscibili dal simbolo (+ ), sono sempre Conoscenze illegali, il cui utilizzo è vietato dalla Legge Magica.<br/>\nInoltre, è vietato dalle Legge anche l'utilizzo di tutte quelle Conoscenze Pozionistiche Extra contrassegnate dal simbolo (+ ).<\/p>\n<p><a id=\"elencoextra\"><\/a><\/p>\n<h2 id=\"elencoextra\">Elenco delle Conoscenze Extra<\/h2>\n<p><strong>Conoscenze Extra Arcaiche<\/strong><br/>\nDissendium +<br/>\nFidelius +<br/>\nIterum Post Me +<br/>\nLinea +<br/>\nObliterate +<br/>\nAbsorbet +<br/>\nPrior Incantatio +<br/>\nPortus +<br/>\n<strong>Conoscenze Extra Difensive<\/strong><br/>\nAresto Momentum +<br/>\nCave Inimicum +<br/>\nFianto Duri +<br/>\nPartis Temporus +<br/>\nProtego Horribilis +<br/>\nRepello Babbanum +<br/>\nSalvio Hexia +<br/>\nSede Ubi Es +<br/>\n<strong>Conoscenze Extra Divinatorie<\/strong><br/>\nAstrologia +<br/>\nAtmosfera +<br/>\nDivinazione degli Specchi +<br/>\nDivinazione delle Viscere +<br/>\nIpnosi +<br/>\nProfezie +<br/>\nScaramanzia +<br/>\nSeduta Spiritica +<\/p>\n<p><strong>Conoscenze >\nChewing-Gum Salivante<br/>\nDiatsepum<br/>\nDolorFast<br/>\nLozione Lenitiva<br/>\nPastiglia Antiglobulosa<br/>\nPastiglia Focolosa<br/>\nPastiglia Svomitosa<br/>\nPozione Antipsicotica<br/>\nPozione Antispasmus<br/>\nPozione Cardioamica<br/>\nPozione Mangia-Morte<br/>\nSoluzione Mineralina<br/>\nTonico Tonificante<br/>\nSiero Aggiustaocchi<br/>\nSoluzione Acidosella<br/>\nSoluzione Espulsiva<br/>\nShampoo AntiChiz<\/p>\n<\/details>\n<details><summary><strong>Vaccini +<\/strong><\/summary>\n<p>AntiRadigordillo+<br/>\nGlowVax+<br/>\nKappaccino+<br/>\nMeduVax+<br/>\nSpinoVax +<br/>\nV. Absorbet+<br/>\nV. Appare+<br/>\nV. Ashes+<br/>\nV-Bundimun 1.0+<br/>\nV-Bundimun 2.0+<br/>\nV-Transmuto+<br/>\nVa.Ta+<br/>\nVaccino Algabrax+<br/>\nVaccino AntiFarfalle+<br/>\nVaccino AntiFertilizzante+<br/>\nVaccino AntiSchiuma+<br/>\nVaccino Messicano+<br/>\nVaccino di Semi di Fuoco+<br/>\nVaccino Stridulo+<br/>\nVaccino Vampiro+<br/>\nVaxerknoll+<br/>\nVaccino CanteriNO<br/>\nVacciNoCataratta<br/>\nVaccino AntiBorbottite<br/>\nVaccino AntiDirix<br/>\nVaccino AntiNundux<br/>\nVaccino AntIra<br/>\nVaccino AntiMalarica<br/>\nVaccino AntiLavandite<br/>\nVaccino AntiMetropolvere<br/>\nVaccino AntiRgliatite<br/>\nVaccino AntiSparizione<br/>\nVaccino AntiSpruzzolosi<br/>\nVaccino AntiVaiolo D<br/>\nVaccino AntiVetustella<\/p>\n<p><strong>Conoscenze Extra Trasfigurative<\/strong><br/>\nAdduco Maxima +<br/>\nAnimaleus Nobodyx +<br/>\nCadit +<br/>\nCaptio +<br/>\nIncarcifors +<br/>\nIncohatum Locomotor +<br/>\nHomophormus +<br/>\nPontis +<\/p>\n<p><strong>Pozioni Fatturanti<\/strong><br/>\nDecotto Dilatante +<br/>\nDoxycida +<br/>\nErbicida +<br/>\nMix Malevolo +<br/>\nPozione Alitosa +<br/>\nPozione della Debolezza +<br/>\nPozione Foruncolosa +<br/>\nPozione Gonfiocchi +<br/>\nPozione Starnutosa +<br/>\nRepellente per Lumache Carnivore +<br/>\nSoluzione Singhiozzante +<\/p>\n<\/details>\n","aliases":["conoscenze extra","Conoscenze Extra","Extra"]},"avanzate":{"title":"4. Conoscenze Avanzate","subtitle":"Cosa sono e come si usano","crumb":["Regolamento","Conoscenze","Avanzate"],"mode":"paper","html":"\n<p><a id=\"cosasono\"><\/a><\/p>\n<h2 id=\"cosasono\">Cosa sono e come si usano<\/h2>\n<p>Le Conoscenze Avanzate (seguite dai simboli ) sono tutti quegli Incantesimi o quelle pratiche magiche che possono essere padroneggiate alla perfezione soltanto da maghi e streghe che posseggono una certa esperienza nell'ambito magico di riferimento. Serve infatti essere abili maghi e streghe nel ramo della magia cui queste pratiche appartengono, tanto che nemmeno il più brillante stregone sulla faccia della Terra è capace di evocarle tutte al massimo della sua potenza.<br/>\nTuttavia, maghi e streghe particolarmente abili in un certo campo possono, col tempo e con lo studio, padroneggiare quelle a loro più affini ed eseguirle abbastanza facilmente.<\/p>\n<ul>\n<li>I <strong>PG Studenti<\/strong> non le conoscono di default, ma possono apprenderle acquistandole oppure imparandole dai PNG di Hogwarts o da altri PG - con qualche malus sull'efficacia. Acquistare una Conoscenza Avanzata, per un PG Studente, significa aver approfondito in autonomia la branca magica di suo interesse, al punto da apprendere conoscenze precluse ai suoi coetanei, per esempio acquistando manuali avanzati, facendo ricerche in biblioteca, discutendo di specifici argomenti - a meno che non si tratti di Conoscenze Oscure - con i docenti della scuola. Questi sono degli esempi di spunti che servono a giustificare l'acquisto della Conoscenza OFFGame.<br/>\nProprio perché di livello superiore rispetto alle Conoscenze Scolastiche e alle Extra, anche le Conoscenze Avanzate posseggono un loro voto e vanno costantemente migliorate come le Conoscenze del Piano di Studi, per far sì che i PG Studenti possano padroneggiarle, senza però raggiungere mai grandi picchi di efficacia.<br/>\nNel vedere o sentire parlare di una Conoscenza Avanzata non presente nella loro Scheda PG, possono dire di sapere di cosa si tratta - ma senza sapere come evocarla - se, lanciando 1d3, <strong>pescano 1<\/strong>.<br/>\nAllo stesso tempo, PG Studenti che possiedono una Conoscenza Avanzata sanno effettivamente utilizzarla soltanto se hanno come voto corrispondente a questa da <strong>Accettabile<\/strong> in su.<\/li>\n<li>I <strong>PG Adulti<\/strong> approcciano le Conoscenze Avanzate in maniera differente a seconda che possiedano la Sapienzaaffine o meno. I PG Adulti, infatti, conoscono di default tutte le Conoscenze Avanzate affini alle Sapienze a loro possedute: possono utilizzarle, però, solamente dal momento che ne acquistano o ottengono il Livello I, e possono approfondirne l'utilizzo fino al Livello V. PG Adulti senza Sapienza affine, invece, possono acquistare qualsiasi altra Conoscenza Avanzata acquistandola o imparandola da altri PG - con qualche malus di efficacia. Tuttavia, le Conoscenze Avanzate acquistate senza possedere la Sapienza relativa non possono essere migliorate oltre il Livello I.<br/>\nI PG Adulti saranno ovviamente più efficaci nell'evocare le Conoscenze Avanzate affini alle loro Sapienze che non le altre.<br/>\nEsattamente come per i PG Studenti, anche per loro acquistare una Conoscenza Avanzata significa approfondire autonomamente la branca di interesse, studiando su manuali acquistati o libri presi in prestito o discutendo liberamente con esperti della materia.<br/>\nLe Conoscenze Avanzate sono 5 per ciascuna delle 12 Sapienze. L'uso delle Conoscenze Avanzate può essere autoconclusivo nelle Free role solo e soltanto se utilizzato per dare colore alle proprie role, ovvero se non offrono alcun tipo di vantaggio materiale né rischiano di causare danni a cose o persone. Per qualsiasi altro utilizzo che non sia una semplice nota per arricchire il proprio post, va richiesto l'intervento del Narratore che provvederà a descrivere l'esito dell'utilizzo della Conoscenza.<\/li>\n<\/ul>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Le Conoscenze Avanzate Oscure, riconoscibili da simbolo , sono sempre Conoscenze illegali, il cui utilizzo è vietato dalla Legge Magica.<\/p>\n<p><a id=\"elencoavanz\"><\/a><\/p>\n<h2 id=\"elencoavanz\">Elenco delle Conoscenze Avanzate<\/h2>\n<p>**Conoscenze Avanzate Arcaiche **<br/>\nAppare Vestigium<br/>\nAvensegium<br/>\nEsorcista<br/>\nSpezzaincantesimi<br/>\nTracciante<br/>\n**Conoscenze Avanzate Difensive **<br/>\nEnergia Magica Difensiva<br/>\nProtego Maxima<br/>\nProtego Totalum<br/>\nProtego Volantis<br/>\nRepello Inimicum<br/>\n**Conoscenze Avanzate Divinatorie **<br/>\nChiaroveggenza<br/>\nProiezione Astrale<br/>\nPsicometria del Futuro<br/>\nPsicometria del Passato<br/>\nVisione del Passato<br/>\n**Conoscenze Avanzate Elementali **<br/>\nAqua Eructo<br/>\nDominusterra<br/>\nIncendio Maxima<br/>\nManipolo<br/>\nVentus Maxima<br/>\n**Conoscenze Avanzate Erbologiche **<br/>\nErborista<br/>\nAmico delle Piante Magiche<br/>\nCustode delle Piante Magiche<br/>\nColtivatore di Piante Magiche<br/>\nPax<br/>\n**Conoscenze Avanzate Magizoologiche **<br/>\nAmico delle Creature<br/>\nCustode delle Creature<br/>\nAddestratore delle Creature<br/>\nAllevatore delle Creature<br/>\nImposium<br/>\n**Conoscenze Avanzate Medimagiche **<br/>\nChirurgo<br/>\nDiagnosta<br/>\nEmendo<br/>\nTerapista<br/>\nVulnera Sanentur<br/>\n**Conoscenze Avanzate Mentali **<br/>\nDesiderium<br/>\nDissimulo<br/>\nLegilimens<br/>\nOblivion<br/>\nOcclumanzia<br/>\n**Conoscenze Avanzate Offensive **<br/>\nAd Caelum<br/>\nArdor<br/>\nBombarda Maxima<br/>\nConfractus<br/>\nEnergia Magica Offensiva<br/>\n**Conoscenze Avanzate Oscure **<br/>\nArdemonium<br/>\nDamnum<br/>\nDolohoferio<br/>\nRitualista Oscuro<br/>\nSectumsempra<br/>\n**Conoscenze Avanzate Pozionistiche **<br/>\nSpeziale<br/>\nChimico<br/>\nCalderaio<br/>\nTocco Magico<br/>\nDistillatore<br/>\n**Conoscenze Avanzate Trasfigurative **<br/>\nCommutatio<br/>\nEvanesco<br/>\nEvocatio<br/>\nLocomotor<br/>\nVerto<\/p>\n","aliases":["conoscenze avanzate","Conoscenze Avanzate","Avanzate"]},"ottenere-conoscenze":{"title":"6. Ottenere nuove Conoscenze","subtitle":"Acquistare e apprendere Conoscenze da PG e PNG","crumb":["Regolamento","Conoscenze","Ottenere nuove Conoscenze"],"mode":"paper","html":"\n<p><a id=\"acquistare\"><\/a><\/p>\n<h2 id=\"acquistare\">Acquistare Conoscenze<\/h2>\n<p>Qualsiasi PG, Studente o Adulto che sia, può ambire ad ottenere qualsiasi tipo di Conoscenza Scolastica, Extra o Avanzata. Uno dei due modi per ottenere una nuova Conoscenza è acquistarla, con i Galeoniche i PG ottengono mensilmente ruolando, attraverso la spesa di Felix Token, la conversione di PP oppure in altri modi ancora.<br/>\nOvviamente, in termini ONGame, questo non significa di certo che il PG che desidera acquistare una nuova Conoscenza andrà in un negozio qualsiasi a chiedere l'acquisto della Conoscenza \"Bombarda Maxima\". L'acquisto attraverso i Galeoni è un meccanismo puramente OFFGame, che può essere declinato e giustificato ONGame in diversi modi a discrezione del player. Tendenzialmente, si può dire che un PG che ha acquistato una nuova Conoscenza OFFGame l'ha ottenuta ONGame grazie allo studio autonomo ed intensivo.<\/p>\n<ul>\n<li><strong>Conoscenze Autoconclusive:<\/strong> non è necessario acquistarle, tutti i PG del gioco le conoscono e le possono evocare autoconclusivamente secondo quanto spiegato qui.<\/li>\n<li><strong>Conoscenze Scolastiche:<\/strong> tutti i PG Studenti posseggono già le Conoscenze Scolastiche appartenenti al loro anno di corso, sulla base del Piano di Studi da loro scelto. Possono acquistare le Conoscenze Scolastiche appartenenti ad anni superiori al proprio, così da poterle utilizzare in anticipo rispetto al loro anno di corso, così come possono acquistare le Conoscenze Scolastiche appartenenti alle materie che non fanno parte del loro Piano di studi. Da Ambientazione, Babbanologia è una materia obbligatoria per tutti i PG Studenti.<br/>\nPG Studenti che acquistano Conoscenze Scolastiche di anni precedenti o successivi a quello frequentato ottengono in Scheda la Conoscenza acquistata con un voto di partenza corrispondente a <strong>T<\/strong> se la materia affine alla Conoscenza <strong>non è presente<\/strong> nel Piano di studi, con voto <strong>A<\/strong> se invece <strong>è presente<\/strong>.<br/>\nPG Adulti conoscono già tutte le Conoscenze Scolastiche delle materie che hanno seguito ad Hogwarts, quindi tutte quelle obbligatorie più <strong>3 su 4 delle materie facoltative<\/strong> (Antiche Rune, Aritmanzia, Cura delle Creature Magiche, Divinazione), scelte al momento della creazione della Scheda PG. Possono acquistare le Conoscenze Scolastiche delle materie facoltative mancanti in un pacchetto unico che comprende le Conoscenze di tutti e tre gli anni scolastici giocabili (V, VI e VII).<\/li>\n<li><strong>Conoscenze Extra:<\/strong> i PG Studenti possono acquistare liberamente le Conoscenze Extra, che verranno inserite nella loro Scheda con un voto di partenza corrispondente a <strong>T<\/strong> se la materia affine alla Conoscenza <strong>non è presente<\/strong> nel Piano di studi, con voto <strong>A<\/strong> se invece <strong>è presente<\/strong>.<br/>\nI PG Adulti posseggono di default tutte le Conoscenze Extra affini alle loro Sapienze. Possono acquistare liberamente tutte le altre.<\/li>\n<li><strong>Conoscenze Avanzate:<\/strong> i PG Studenti possono acquistare liberamente le Conoscenze Avanzate, che verranno inserite nella loro Scheda con un voto di partenza corrispondente a <strong>T<\/strong> se la materia affine alla Conoscenza <strong>non è presente<\/strong> nel Piano di studi, con voto <strong>A<\/strong> se invece <strong>è presente<\/strong>. Non possono migliorare le Conoscenze Avanzate oltre il Livello I, che è quello base.<br/>\nI PG Adulti posseggono di default tutte le Conoscenze Avanzate che appartengono alle loro Sapienze e possono migliorarle dal Livello I al Livello V. Possono acquistare liberamente tutte le altre ma queste non possono essere migliorate oltre il Livello I.<br/>\nOgni tipologia di Conoscenza ha un prezzo differente ed il listino dei prezzi è presente in questo topic e nello specchietto in alto di questa sezione. E' possibile richiedere l'acquisto delle Conoscenze nella propria <strong>Lista della Spesa<\/strong>.<\/li>\n<\/ul>\n<p><a id=\"apprendere\"><\/a><\/p>\n<h2 id=\"apprendere\">Apprendere Conoscenze<\/h2>\n<p>Per ottenere nuove Conoscenze, i PG non sono soltanto costretti a dover studiare in autonomia centinaia e centinaia di tomi. Si sa che lo studio rende migliori ma è la pratica a rendere perfetti, ed ecco perchè i PG hanno anche la possibilità di ottenere nuove Conoscenze imparandole da altri PG o PNG.<\/p>\n<p><a id=\"apprenderePG\"><\/a><\/p>\n<h3 id=\"apprenderePG\">Apprendere Conoscenze da un altro PG<\/h3>\n<p>Ogni PG può insegnare ad un altro PG una Conoscenza di qualsiasi tipologia, a patto che il PG insegnante la conosca (la possegga quindi in Scheda) e che invece il PG \"apprendista\" non la conosca già. Lo scambio può avvenire sia tra PG Studenti che tra PG Adulti, ma anche tra un PG Adulto che insegna qualcosa ad un PG Studente e addirittura un PG Studente che insegna qualcosa ad un PG Adulto.<br/>\nL'apprendimento di una Conoscenza da un altro PG ha tuttavia delle limitazioni e segue un processo ben preciso. Gli step da seguire per apprendere una nuova Conoscenza da un PG sono i seguenti:<br/>\n<strong>1) Svolgere una role in cui il PG insegnante tenta di insegnare la Conoscenza al PG apprendista<\/strong><br/>\nL'apprendimento, ONGame, avviene secondo le modalità decise ovviamente in gioco dai PG coinvolti. OFFGame, invece, il PG apprendista riesce nel tentativo di apprendere la Conoscenza in questione sulla base del lancio di un dado. Il dado da lanciare è differente per ogni tipologia di Conoscenza che si sta tentando di apprendere:<\/p>\n<ul>\n<li><strong>Conoscenze Scolastiche:<\/strong> il PG apprende la Conoscenza se, <strong>lanciando **1d20<\/strong>, pesca 1-Parametro affine (fino ad un massimo di 19)** alla Conoscenza. Questo significa che PG con Parametro affine <em>maggiore o uguale<\/em> a 20 apprende la Conoscenza se 1-19. C'è sempre, quindi, almeno una possibilità di fallire.<\/li>\n<li><strong>Conoscenze Extra:<\/strong> il PG apprende la Conoscenza se, <strong>lanciando **1d30<\/strong>, pesca 1-Parametro affine** alla Conoscenza.<\/li>\n<li><strong>Conoscenze Avanzate:<\/strong> il PG apprende la Conoscenza se, <strong>lanciando **1d50<\/strong>, pesca 1-Parametro affine** alla Conoscenza.<br/>\nIl PG apprendista ha a disposizione <strong>1 lancio a post<\/strong> durante la role, per un massimo di 3 lanci e quindi <strong>3 tentativi, per ogni role<\/strong>. In caso di <em>fallimento *potrà comunque ritentare in un'altra role l'apprendimento insieme allo stesso PG, se questo fosse ancora disposto ad insegnargliela.<br/>\nIn caso di *successo<\/em> in uno dei tre tentativi, invece, il PG apprendista può considerare la Conoscenza appresa e passare allo step successivo.<br/>\n<strong>2) Acquistare la Conoscenza al termine della role di apprendimento, ma scontata<\/strong><br/>\nOttenere nuove Conoscenze in maniera del tutto gratuita significherebbe rendere quasi inutile il sistema di guadagno e spesa dei Galeoni da parte dei PG. Per questo motivo, una volta appresa la Conoscenza da un PG insegnante, il PG apprendista deve comunque procedere ad <strong>acquistare<\/strong> nella propria Lista della Spesa la Conoscenza in questione per poterla utilizzare. Potrà tuttavia acquistarla al <strong>70%<\/strong> del suo prezzo base.<br/>\nUna volta eseguito l'acquisto, la Conoscenza verrà inserita nella Scheda del PG apprendista con un <strong>malus del 20%<\/strong>.<br/>\nQuesto significa che qualsiasi Conoscenza che possegga una propria Forza base, avrà quest'ultima ridotta del 20% standard da ogni utilizzo. Conoscenze che non posseggono una propria Forza avranno invece un <strong>malus di -2 possibilità<\/strong> al lancio del dado per decretarne la riuscita.<br/>\n<strong>3) A questo punto, ottenuta la Conoscenza, il PG apprendista può scegliere 3 strade:<\/strong><\/li>\n<li>tenere e continuare ad utilizzare la Conoscenza con il malus del 20%;<br/>\noppure<\/li>\n<li>liberarsi del malus svolgendo un'ulteriore <strong>role<\/strong> di allenamento con il PG che gliel'ha insegnata;<br/>\noppure<\/li>\n<li>liberarsi del malus <strong>pagando<\/strong> il restante 30% del prezzo della Conoscenza appresa e acquistata;<br/>\nA questo punto, la Conoscenza può dirsi acquisita e ottenuta ufficialmente ed il PG apprendista può farne l'uso che desidera in role.<\/li>\n<\/ul>\n<blockquote class=\"callout why\">\n<p><strong>Perché?<\/strong><br/>\n<strong>...è così difficile e costoso apprendere una Conoscenza da un altro PG? Non mi converrebbe comprarla e basta?<\/strong><br/>\nIn effetti è proprio così: è certamente più conveniente comprarla.<br/>\nApprendere una Conoscenza da un altro PG è così difficile e costoso perché, se non lo fosse, sarebbe possibile per tutti i PG ottenere gratuitamente Conoscenze possedute da altri PG, che a loro volta le hanno ottenute magari attraverso la propria Sapienza o il proprio Piano di studi in maniera altrettanto gratuita. In questo modo, il sistema di guadagno e di spesa dei Galeoni sarebbe del tutto inutile, oltre al fatto che i PG rischiano di accumulare in Scheda Galeoni che possono utilizzare per comprare infiniti Oggetti e potenziamenti.<\/p>\n<\/blockquote>\n<blockquote class=\"callout example\">\n<p><strong>Esempio.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Harry Potter<\/strong> e <strong>Ron Weasley<\/strong> sono due PG Studenti. Svolgono una role insieme in cui Harry vuole insegnare a Ron l'IncantesimoFianto Duri(Conoscenza Extra, Difensiva).<br/>\nRon possiede 12 Potenza, che è il Parametro affine alla Conoscenza.<br/>\n<strong>1)<\/strong> Durante la role, <strong>Ron<\/strong> può lanciare <strong>1d30<\/strong> (Conoscenza Extra) e se pesca un esito compreso tra 1-12 (la sua Potenza, Parametro affine) riesce ad apprendere la Conoscenza. Al primo tentativo pesca 18, quindi fallisce.<br/>\nAl secondo tentativo pesca 2: Ron riesce ad apprendere la Conoscenza da <strong>Harry<\/strong>.<br/>\n<strong>2)<\/strong> Al termine della role, <strong>Ron **acquista la Conoscenza Extra Fianto Duri al **70% del suo costo<\/strong>. Quindi, per la Conoscenza Extra che normalmente costerebbe 50 G, Ron paga 35 G e Fianto Duri gli viene inserito in Scheda con un <strong>malus del 20%<\/strong>.<br/>\n<strong>3)<\/strong> Dopo di che, in un primo momento <strong>Ron **decide di continuare ad utilizzare <em>Fianto Duri<\/em> con il malus per un certo periodo di tempo per sua decisione (ad esempio per coerenza con il PG, oppure per non spendere ulteriori Galeoni o per qualsiasi altro motivo).<br/>\nAd un certo punto decide di volersi liberare del malus: svolge allora un'altra role con **Harry<\/strong> in cui si esercita nell'utilizzo di <em>Fianto Duri<\/em> e, al termine della role, riesce a liberarsi del malus del 20% e può utilizzare la Conoscenza a piena potenza.<br/>\nSe invece Ron non avesse avuto modo, tempo, voglia o qualsiasi altra cosa, di svolgere una nuova role con Harry per liberarsi dal malus, avrebbe potuto pagare la restante somma del prezzo base della Conoscenza e cominciare ad utilizzarla a piena potenza grazie ai Galeoni.<\/p>\n<p><a id=\"apprenderePNG\"><\/a><\/p>\n<h3 id=\"apprenderePNG\">Apprendere Conoscenze da un PNG<\/h3>\n<p>Oltre che dagli altri PG, è possibile ottenere delle Conoscenze da degli specifici PNG. Tuttavia, i PNG in questione si trovano all'interno di Hogwarts e quindi questa possibilità è limitata soltanto ai PG Studenti secondo le modalità quispiegate.<\/p>\n<blockquote class=\"callout why\">\n<p><strong>Perché?<\/strong><br/>\n<strong>... i PG Adulti non hanno dei PNG da cui ottenere gratuitamente delle Conoscenze?<\/strong><br/>\nPerchè i PG Adulti possono ottenere gratuitamente un certo range di Conoscenze Avanzate ed Extra già soltanto dal momento della loro creazione. Inoltre, i PG Adulti hanno un guadagno mensile di Galeoni raddoppiato rispetto a quello dei PG Studenti e quindi, potenzialmente, per loro è molto più semplice acquistare una Conoscenza che non possiedono già. Inoltre, la possibilità di ottenere delle Conoscenze dai PNG per i PG Studenti è comunque limitata e regolata da un meccanismo che non garantisce la riuscita certa.<\/p>\n<\/blockquote>\n","aliases":["ottenere nuove conoscenze","Ottenere nuove Conoscenze"]},"creare-conoscenze":{"title":"7. Creare una Conoscenza o un Oggetto Magico","subtitle":"Creare Incantesimi, Pozioni e Oggetti Magici","crumb":["Regolamento","Conoscenze","Creare una Conoscenza"],"mode":"paper","html":"\n<p>I Player che vogliono contribuire all'ampliamento delle Conoscenze e degli Oggetti del gioco possono farlo attraverso la creazione di nuovi Incantesimi, nuove Pozioni e nuovi Oggetti Magici. Si tratta, per l'appunto, di una <strong>creazione OFFGame<\/strong>. Ogni player può inventare <strong>una nuova Conoscenza o Oggetto al mese<\/strong>.<br/>\nNel caso in cui la creazione dovesse avvenire, oltre che OFFGame da parte del player, anche ONGame da parte del PG, quest'ultimo deve avere i seguenti requisiti:<\/p>\n<ul>\n<li><strong>PG Studenti:<\/strong> tutte le Conoscenze con voto E nella Materia Scolastica affine.<\/li>\n<li><strong>PG Adulti:<\/strong> almeno 10 Sapienza nella Sapienza affine.<br/>\nLe Conoscenze inventate dai player/PG saranno sempre Conoscenze Extra relative alla Sapienza affine alla Conoscenza.<br/>\n<strong>Cosa ottengo se creo delle Conoscenze o degli Oggetti Magici?<\/strong><br/>\nSe la creazione avviene <strong>soltanto OFFGame<\/strong>, il player riceve come ricompenza 50 Felix Token una tantum.<br/>\nSe la creazione avviene <strong>anche ONGame<\/strong>, il PG creatore ottiene anche il 15% da ogni vendita di ogni Conoscenza o Oggetto inventato, più Popolarità, Prestigio o Stima dei docenti a seconda della circostanza, su decisione del Narratore.<br/>\nAndrà quindi linkata a supporto dello specchietto di creazione la/le role in cui il PG inventa la Conoscenza in questione, così che il Narratore possa valutare quali bonus assegnare al PG che ha giocato lo spunto.<br/>\nLo Staff si riserva la possibilità di correggere e/o modificare le Conoscenze o gli Oggetti inventati dai player/PG al fine di adattarle e renderle il più possibile bilanciate rispetto ai sistemi e alle meccaniche di gioco.<br/>\n<strong>E' possibili creare Incantesimi, Pozioni ed Oggetti Illegali?<\/strong><br/>\nSì, è possibile. Se l'invenzione dovesse essere soltanto OFFGame, quindi del player, il PG non rischia alcun tipo di conseguenza.<br/>\nSe l'invenzione dovesse essere anche ONGame, il nome dell'inventore non sarà di dominio pubblico: la diffusione della conoscenza in maniera indiretta (quindi acquistata e non appresa direttamente dell'inventore) si giustifica tramite un passaparola ONGame che permette all'inventore di mantenere l'anonimato, a meno che non si riveli personalmente, rischiando le conseguenze previste per le Azioni Illegali.<br/>\n<strong>Come si possono ottenere le Conoscenze e gli Oggetti creati?<\/strong><br/>\nEsattamente come le Conoscenze e gli Oggetti normali: si acquistano oppure, nel caso delle Conoscenze, si apprendono direttamente dall'inventore o da chi ha già la Conoscenza tra quelle apprese in Scheda PG.<br/>\n<strong>Attenzione:<\/strong> queste Conoscenze, anche se Extra, non vengono apprese di default dai PG che possiedono la Sapienza affine. Devono comunque essere acquistate o apprese da PG che le possiedono già in Scheda.<\/li>\n<\/ul>\n<p><a id=\"creareinca\"><\/a><\/p>\n<h2 id=\"creareinca\">Creare un Incantesimo<\/h2>\n<p>Per creare un nuovo Incantesimo OFFGame, il Player può compilare il seguente specchietto compilato all'interno della sezione \"Proposte Nuove Creazioni\":<\/p>\n<details><summary><strong>Compila questo se vuoi creare un Incantesimo:<\/strong><\/summary>\n<blockquote class=\"callout\">\n<\/blockquote>\n<p><strong>Nome Incantesimo:<\/strong><br/>\n<strong>Tipologia:<\/strong> Arcaico/Difensivo/Elementale/Erbologico/Magizoologico/Medimagico/Mentale/Offensivo/Oscuro/Pozionistico/Trasfigurativo<br/>\n<strong>Immagine:<\/strong><br/>\n<strong>Descrizione ONGame:<\/strong><br/>\n<strong>Specifiche OFFGame:<\/strong><br/>\n<strong>Valori:<\/strong><br/>\n<strong>Parametro:<\/strong><br/>\n<strong>Forza:<\/strong><br/>\n<strong>Fatica:<\/strong><br/>\n<strong>Bersaglio:<\/strong><br/>\n<strong>Altro:<\/strong><\/p>\n<pre><code class=\"language-text\">**Nome Incantesimo:**\n**Tipologia:** Arcaico/Difensivo/Elementale/Erbologico/Magizoologico/Medimagico/Mentale/Offensivo/Oscuro/Pozionistico/Trasfigurativo\n**Immagine:**\n**Descrizione ONGame:**\n**Specifiche OFFGame:**\n**Valori:**\n**Parametro:**\n**Forza:**\n**Fatica:**\n**Bersaglio:**\n**Altro:**\n<\/code><\/pre>\n<p>Nel caso in cui il PG inventi l'Incantesimo in questione anche ONGame, il player ha liberta di scelta su come ruolare il processo di creazione, che può avvenire in una o più role, in solitaria o con l'aiuto di altri PG eccetera. L'importante ovviamente è mantenere il buon senso e rispettare la coerenza del PG, dell'Ambientazione, nonchè dei limiti e delle regole del gioco, evitando di fare PowerPlay.<\/p>\n<\/details>\n<p><a id=\"crearepoz\"><\/a><\/p>\n<h2 id=\"crearepoz\">Creare una Pozione<\/h2>\n<p>Per creare una nuova Pozione OFFGame, il Player può compilare il seguente specchietto compilato all'interno della sezione \"Proposte Nuove Creazioni\":<\/p>\n<details><summary><strong>Compila questo se vuoi creare una Pozione:<\/strong><\/summary>\n<blockquote class=\"callout\">\n<\/blockquote>\n<p><strong>Nome Pozione:<\/strong><br/>\n<strong>Immagine:<\/strong><br/>\n<strong>Descrizione ONGame:<\/strong><br/>\n<strong>Ingredienti e dosi:<\/strong><br/>\n<strong>Ricetta:<\/strong><br/>\n<strong>Specifiche OFFGame:<\/strong><br/>\n<strong>Valori:<\/strong><br/>\n<strong>Classificazione:<\/strong><br/>\n<strong>Tipologia:<\/strong> Curativa/Fatturante/Generica/Mentale/Offensiva/Rinvigorente/Sensoriale/Vaccino/Veleno<br/>\n<strong>Forza standard:<\/strong><br/>\n<strong>Somministrazione:<\/strong><br/>\n<strong>Durata:<\/strong><br/>\n<strong>Altro:<\/strong><\/p>\n<pre><code class=\"language-text\">**Nome Pozione:**\n**Immagine:**\n**Descrizione ONGame:**\n**Ingredienti e dosi:**\n**Ricetta:**\n**Specifiche OFFGame:**\n**Valori:**\n**Classificazione:**\n**Tipologia:** Curativa/Fatturante/Generica/Mentale/Offensiva/Rinvigorente/Sensoriale/Vaccino/Veleno\n**Forza standard:**\n**Somministrazione:**\n**Durata:**\n**Altro:**\n<\/code><\/pre>\n<p>Nel caso in cui il PG inventi la Pozione in questione anche ONGame, il player ha liberta di scelta su come ruolare il processo di creazione, che può avvenire in una o più role, in solitaria o con l'aiuto di altri PG eccetera. L'importante ovviamente è mantenere il buon senso e rispettare la coerenza del PG, dell'Ambientazione, nonchè dei limiti e delle regole del gioco, evitando di fare PowerPlay.<\/p>\n<\/details>\n<p><a id=\"creareoggettinuovi\"><\/a><\/p>\n<h2 id=\"creareoggettinuovi\">Creare un Oggetto Magico<\/h2>\n<p>Per creare un nuovo Oggetto Magico OFFGame, il Player può compilare il seguente specchietto compilato all'interno della sezione \"Proposte Nuove Creazioni\":<\/p>\n<details><summary><strong>Compila questo se vuoi creare un Oggetto Magico:<\/strong><\/summary>\n<blockquote class=\"callout\">\n<\/blockquote>\n<p><strong>Nome Oggetto:<\/strong><br/>\n<strong>Immagine:<\/strong><br/>\n<strong>Descrizione ONGame:<\/strong><br/>\n<strong>Ingredienti:<\/strong><br/>\n<strong>Capacità OFFGame:<\/strong><br/>\n<strong>Passaggi per la creazione:<\/strong> deve sempre essere previsto l'uso di Absorbet<br/>\n<strong>Prezzo:<\/strong><br/>\n<strong>Altro:<\/strong><\/p>\ input.addEventListener('input',()=>renderResults(input.value,false));input.addEventListener('focus',()=>{if(input.value.trim())renderResults(input.value)});resultsBox.addEventListener('click',e=>{if(e.target.closest('[data-show-all]')){renderResults(input.value,true);return}const btn=e.target.closest('.result');if(!btn)return;const r=currentResults[Number(btn.dataset.i)];input.value='';resultsBox.classList.remove('show');navigate(r.page,r.anchor)});input.addEventListener('keydown',e=>{const buttons=[...resultsBox.querySelectorAll('.result')];if(e.key==='ArrowDown'&&buttons.length){e.preventDefault();selectedResult=Math.min(buttons.length-1,selectedResult+1)}else if(e.key==='ArrowUp'&&buttons.length){e.preventDefault();selectedResult=Math.max(0,selectedResult-1)}else if(e.key==='Enter'&&selectedResult>=0){e.preventDefault();buttons[selectedResult].click();return}else if(e.key==='Escape'){resultsBox.classList.remove('show');input.blur();return}else return;buttons.forEach((b,i)=>b.classList.toggle('selected',i===selectedResult));buttons[selectedResult]?.scrollIntoView({block:'nearest'})});

sidebarNav.addEventListener('click',e=>{
  const levelBtn=e.target.closest('[data-side-level]');
  if(levelBtn){
    const nextLevel=levelBtn.dataset.sideLevel;
    sidebarForwardStack=[];
    sidebarLevel=nextLevel;
    renderSidebarLevel();
    return;
  }
  const p=e.target.closest('[data-side-page]');
  if(p){navigate(p.dataset.sidePage);closeSidebarDrawer();return}
  const a=e.target.closest('[data-side-anchor]');
  if(a){navigate(currentPage,a.dataset.sideAnchor);closeSidebarDrawer()}
});
sidebarBack.addEventListener('click',sidebarZoomOut);
sidebarForward.addEventListener('click',sidebarZoomIn);
sidebarClose.addEventListener('click',()=>{
  if(window.innerWidth<=950){closeSidebarDrawer();return}
  sidebarClosed=true;sidebar.classList.add('hidden');readingLayout.classList.add('no-sidebar');updateSidebarControls();
});
function reopenSidebar(){
  if(window.innerWidth<=950){openSidebarDrawer();return}
  sidebarClosed=false;sidebar.classList.remove('hidden');readingLayout.classList.remove('no-sidebar');renderSidebar();updateSidebarControls();
}
sidebarOpen.addEventListener('click',reopenSidebar);
if(sidebarTab) sidebarTab.addEventListener('click',reopenSidebar);
drawerBackdrop.addEventListener('click',closeSidebarDrawer);
window.addEventListener('resize',()=>{
  if(window.innerWidth>950)closeSidebarDrawer();
  updateSidebarControls();
});
$('#copyLink').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);showToast('Link copiato.')}catch{showToast('Copia non disponibile in apertura locale: usa il link dalla barra del browser.')}});
window.addEventListener('hashchange',renderPage);buildIndex();renderPage();
</script>
</body></html>
