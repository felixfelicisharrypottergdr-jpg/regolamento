/* ==========================================================
   v10 — sidebar strutturale + linguaggio visivo Sapienze
   Palette derivate dalle card Felix esistenti.
   ========================================================== */
:root{
  --arc:#5D2E0A; --arc-d:#281204; --arc-a:#8C501D; --arc-l:#D28A3B; --arc-p:#F9DDB0; --arc-e:#C99A53;
  --erb:#0C2902; --erb-d:#041200; --erb-a:#326522; --erb-l:#68A84B; --erb-p:#DDF8C9; --erb-e:#A9A252;

  --sap-c:#5d4435; --sap-d:#211915; --sap-a:#8a684d; --sap-l:#c49a61; --sap-p:#f4e5cf; --sap-e:#b78d51;

.side-level-breadcrumb{padding-top:.65rem;color:#897d6c}

const PAGES = {"home":{"title":"Regolamento","subtitle":"Indice generale","crumb":["Regolamento"],"mode":"dark","html":"\n<section class=\"landing\">\n  <div class=\"landing-kicker\">FELIX FELICIS GDR<\/div>\n  <h1>Regolamento<\/h1>\n  <p class=\"landing-lead\">Manuale di consultazione. La sezione <b>Le Conoscenze Magiche<\/b> è ora migrata integralmente; le altre aree restano campioni di sviluppo.<\/p>\n  \n<\/section>\n<section class=\"home-grid\">\n  <button class=\"home-link available\" data-route=\"conoscenze\"><span>✦<\/span><b>Le Conoscenze Magiche<\/b><small>Tipologie, uso, acquisizione e creazione<\/small><\/button>\n  <button class=\"home-link available\" data-route=\"magizoologia\"><span>✦<\/span><b>Manuali · Magizoologia<\/b><small>Guida, Fiducia, Domesticazione e Creature<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Le Regole del Gioco<\/b><small>Non importato nel prototipo<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Parametri Magici, Fisici e Sociali<\/b><small>Non importato nel prototipo<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Guida agli Scontri<\/b><small>Non importato nel prototipo<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Le Sapienze<\/b><small>Non importato nel prototipo<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Giocare un PG Studente<\/b><small>Non importato nel prototipo<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Giocare un PG Adulto<\/b><small>Non importato nel prototipo<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Vivere nel Mondo Magico<\/b><small>Non importato nel prototipo<\/small><\/button>\n  <button class=\"home-link\"><span>◇<\/span><b>Ricerche Casuali<\/b><small>Non importato nel prototipo<\/small><\/button>\n<\/section>\n","aliases":["regolamento","indice generale","home"]},"conoscenze":{"title":"Le Conoscenze Magiche","subtitle":"Tipologie, uso, acquisizione e creazione","crumb":["Regolamento","Conoscenze"],"mode":"dark","html":"<div class=\"category-intro\"><p>Le Conoscenze raccolgono le regole generali su ciò che i PG possono conoscere, apprendere e utilizzare. Scegli una voce oppure usa la ricerca globale per arrivare direttamente alla regola che ti serve.<\/p><\/div>\n<div class=\"directory-list\">\n  <button data-route=\"autoconclusive\"><span class=\"number\">1.<\/span><span><b>Conoscenze Autoconclusive<\/b><small>Cosa sono e come si usano<\/small><\/span><\/button>\n  <button data-route=\"scolastiche\"><span class=\"number\">2.<\/span><span><b>Conoscenze Scolastiche<\/b><small>Cosa sono e come si usano<\/small><\/span><\/button>\n  <button data-route=\"extra\"><span class=\"number\">3.<\/span><span><b>Conoscenze Extra<\/b><small>Cosa sono e come si usano<\/small><\/span><\/button>\n  <button data-route=\"avanzate\"><span class=\"number\">4.<\/span><span><b>Conoscenze Avanzate<\/b><small>Cosa sono e come si usano<\/small><\/span><\/button>\n  <button data-route=\"usare-conoscenze\"><span class=\"number\">5.<\/span><span><b>Usare le Conoscenze<\/b><small>Componenti, uso, annullamento degli effetti, Incantesimi non verbali<\/small><\/span><\/button>\n  <button data-route=\"ottenere-conoscenze\"><span class=\"number\">6.<\/span><span><b>Ottenere nuove Conoscenze<\/b><small>Acquistare e apprendere Conoscenze da PG e PNG<\/small><\/span><\/button>\n  <button data-route=\"creare-conoscenze\"><span class=\"number\">7.<\/span><span><b>Creare una Conoscenza o un Oggetto Magico<\/b><small>Incantesimi, Pozioni e Oggetti Magici<\/small><\/span><\/button>\n  <button data-route=\"glossario-conoscenze\"><span class=\"number\">8.<\/span><span><b>Glossario delle Conoscenze<\/b><small>Tutte le Conoscenze di Felix Felicis GdR<\/small><\/span><\/button>\n<\/div>","aliases":["conoscenze","conoscenze magiche","conoscenze pg","apprendere conoscenze"]},"autoconclusive":{"title":"1. Conoscenze Autoconclusive","subtitle":"Cosa sono e come si usano","crumb":["Regolamento","Conoscenze","Autoconclusive"],"mode":"paper","html":"\n<p><a id=\"cosasono\"><\/a><\/p>\n<h2 id=\"cosasono\">Cosa sono e come si usano<\/h2>\n<p>Le Conoscenze Autoconclusive (riconoscibili dal simbolo ✔) sono Incantesimi, Conoscenze o Pozioni che sia PG Studenti che PG Adulti conoscono e sanno riconoscere ed utilizzare in maniera <strong>autoconclusiva<\/strong> (maggiori info, punto 2), perchè di semplice esecuzione ed insegnate nei primi anni delle Scuole di Magia.<br/>\nLe Conoscenze Autoconclusive si dividono a loro volta in diversi sottogruppi, sulla base dell'uso che se ne può fare sia in Free role che in Role Masterate ed Eventi:<\/p>\n<ul>\n<li>gli Incantesimi <strong>senza alcun contrassegno<\/strong> sono sempre dalla riuscita indubbia e non necessitano mai di esito da parte del Narratore, ma è possibile utilizzarli nelle role per dare un tocco magico ai propri post.<\/li>\n<\/ul>\n<blockquote class=\"callout example\">\n<p><strong>Esempio.<\/strong><br/>\nPerché dire di recarsi fino alla finestra per aprirla quando è possibile usare un comodo Aberto dal divano?!<\/p>\n<\/blockquote>\n<ul>\n<li>gli Incantesimi contrassegnati da **un Asterisco*** sono Incantesimi Autoconclusivi che possono essere lanciati in maniera autonoma ed autoconclusiva, ma che nel momento in cui vanno ad impattare oppure rischiano di danneggiare un altro PG, un PNG o qualche tipo di elemento dell'ambientazione necessitano comunque dell'intervento del Narratore per scoprire quali sono le conseguenze dell'azione sul PG o su ciò che lo circonda.<\/li>\n<\/ul>\n<blockquote class=\"callout example\">\n<p><strong>Esempio.<\/strong><br/>\nPericulum di certo vi permetterà di lanciare scintille rosse in aria in caso di pericolo, ma chi verrà in vostro soccorso? Sarà il Narratore a stabilirlo!<br/>\nUsare Wingardium Leviosa per dire di spostare dei bicchieri durante una chiacchierata è un'azione autoconclusiva; usare <em>Wingardium Leviosa<\/em> per far cadere in testa ad un altro PG un vaso di vetro al fine di danneggiarlo, invece, non è un'azione autoconclusiva: sarà il Narratore a stabilire l'eventuale riuscita dell'azione e le sue conseguenze, avendo coinvolto un altro giocatore e coinvolto il suo PG in una situazione di gioco per lui potenzialmente dannosa.<\/p>\n<\/blockquote>\n<blockquote class=\"callout why\">\n<p><strong>Perché?<\/strong><\/p>\n<\/blockquote>\n<p><strong>...questa categoria di Incantesimi è autoconclusiva, sebbene con delle limitazioni?<\/strong><br/>\nPerché PG Adulti e Studenti imparano a maneggiarli con maestria durante il loro percorso di studi ad Hogwarts, essendo incantesimi molto semplici e alla portata di tutti, e di conseguenza difficilmente verrebbero eseguiti in maniera scorretta; essi, poi, in quanto generici e quindi slegati da Parametri di riferimento, possono essere lanciati dai PG senza alcun genere di prerequisito specifico.<\/p>\n<p><a id=\"elencoauto\"><\/a><\/p>\n<h2 id=\"elencoauto\">Elenco degli Incantesimi Autoconclusivi<\/h2>\n<p>Aberto<br/>\nAccio*<br/>\nAcutus*<br/>\nAerem Signum<br/>\nAlohomora*<br/>\nAparecium*<br/>\nAperio*<br/>\nBagaglius<br/>\nCalor<br/>\nChartanimus*<br/>\nCircumrota*<br/>\nCòlor Cangiàntis<br/>\nColloportus<br/>\nColovaria<br/>\nErecto<br/>\nFinestra*<br/>\nFlammula*<br/>\nGratta e Netta<br/>\nGuidami*<br/>\nImpervius*<br/>\nLumos<br/>\nLumos Maxima*<br/>\nNox<br/>\nPericulum*<br/>\nPluvia<br/>\nQuietus<br/>\nReparo*<br/>\nReverte*<br/>\nScripta Manent*<br/>\nSonorus*<br/>\nSui Exitium*<br/>\nTergeo<br/>\nWingardium Leviosa*<\/p>\n","aliases":["conoscenze autoconclusive","Conoscenze Autoconclusive","Autoconclusive"]},"usare-conoscenze":{"title":"5. Usare le Conoscenze","subtitle":"Componenti, uso, annullamento degli effetti e Incantesimi non verbali","crumb":["Regolamento","Conoscenze","Usare le Conoscenze"],"mode":"paper","html":"\n<p><a id=\"componenti\"><\/a><\/p>\n<h2 id=\"componenti\">Componenti di una Conoscenza<\/h2>\n<p>Ogni tipologia di Conoscenza, sia essa un Incantesimo, una Pozione, una Creatura o una Pianta Magica o qualsiasi altra Conoscenza possa essere lanciata da un PG all'interno del gioco, ha un suo specchietto che ne spiega tanto gli effetti ONGame che gli effetti OFFGame, rispettivi bonus e malus, ma anche tante altre indicazioni che contribuiscono a rendere ogni Conoscenza diversa dall'altra e che permettono di rendere il gioco dinamico e variegato, oltre a permettere di classificare ogni Conoscenza secondo dei criteri oggettivi che il Narratore può valutare nelle varie situazioni di gioco che si possono verificare.<br/>\nDi seguito sono mostrati degli esempi degli specchietti sopracitati, suddivisi per ogni tipologia di Conoscenza.<\/p>\n<h3 id=\"incantesimi\">Incantesimi<\/h3>\n<p>Bombarda Maxima<\/p>\n<p>Distrugge il bersaglio preso di mira con esplosioni di grande entità; è utile per abbattere porte, cancelli, muri, ostacoli di vario genere anche di grandi dimensioni. Di conseguenza, non funziona né se viene utilizzato contro il terreno (per il quale è necessario l'incantesimo Defodio) né su bersagli viventi, che possono essere feriti soltanto dai frammenti dell'esplosione; non distrugge oggetti resi indistruttibili dall'incantesimo Indissolubilis, né interi edifici o bersagli più grandi di una macchina, circa.<\/p>\n<ul>\n<li>PG con <strong>Sapienza Offensiva 25<\/strong> sono in grado di controllare e gestire i detriti e di indirizzarli a loro piacimento.<\/li>\n<\/ul>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<ul>\n<li>I blocchi di detriti hanno Destrezza pari alla Forza dell'esplosione/10 Schivare i blocchi di detriti, a prescindere dal numero, costa 1 Azione/Reazione, ma il dado Destrezza dei blocchi di detriti viene lanciato per ogni blocco. Se i PG che rischiano di essere colpiti dai frammenti sono più di uno, sarà il Narratore a stabilire - a seconda della Narrazione - chi viene colpito e da quanti detriti. In caso di free role senza Narratore, il PG evocatore può lanciare:<\/li>\n<\/ul>\n<ol>\n<li>1d(n° PG totali vicino all'esplosione) per vedere quanti PG vengono colpiti dai detriti, poi;<\/li>\n<li>associare un numero ad ogni PG vicino all'esplosione e lanciare Xd(n° PG totali vicino all'esplosione), dove X sta per il numero di PG che vengono colpiti, poi;<\/li>\n<li>Xd(n° detriti), dove X sta per il numero di PG colpiti, finché ogni detrito non ha un suo bersaglio.<\/li>\n<\/ol>\n<details><summary><strong>Specifiche<\/strong><\/summary>\n<p><strong>Durata:<\/strong> istantanea<br/>\n<strong>Parametro del bersaglio intaccato:<\/strong> nessuno, ma i frammenti causano un malus in Salute (vedi Encliclopedia Medimagica &gt; Lesioni da Incantesimi &gt; Bombarda Maxima)<br/>\n<strong>Bersagli colpiti contemporaneamente e quantità di frammenti<\/strong><br/>\nIl numero di bersagli che l'evocatore può colpire e far esplodere dipende dalla sua abilità. Se sono presenti esseri viventi vicino all'esplosione, può procurare loro un danno in Salute. La quantità di detriti prodotti dall'esplosione dipende dall'abilità dell'evocatore.<br/>\n<em>Incantesimo lanciato da PG Studenti<\/em><br/>\nSe la Potenza dell'incantesimo precedentemente evocato è...<\/p>\n<ul>\n<li>100%: max 2 bersagli; 2 blocchi di detriti<\/li>\n<li>33-66%: max 1 bersaglio; 1 blocco di detriti<br/>\n<em>Incantesimo lanciato da PG Adulti senza Sapienza Offensiva<\/em><br/>\nSe la Potenza dell'incantesimo precedentemente evocato è...<\/li>\n<li>100%: max 3 bersagli; 3 blocchi di detriti<\/li>\n<li>66%: max 2 bersagli; 2 blocchi di detriti<\/li>\n<li>33%: max 1 bersagli; 1 blocco di detriti<br/>\n<em>Incantesimo lanciato da PG Adulti con Sapienza Offensiva 1+<\/em><br/>\nSe la Potenza dell'incantesimo precedentemente evocato è...<\/li>\n<li>100%: max 5 bersagli; 5 blocchi di detriti<\/li>\n<li>66%: max 4 bersagli; 4 blocchi di detriti<\/li>\n<li>33%: max 3 bersagli; 3 blocchi di detriti<\/li>\n<\/ul>\n<p>Valori<\/p>\n<p>Tipo<\/p>\n<p>Parametro<\/p>\n<p>Forza<\/p>\n<p>Fatica<\/p>\n<p>Bersaglio<\/p>\n<p>Gittata<\/p>\n<p>Offensivo<\/p>\n<p>Potenza<\/p>\n<p>200<\/p>\n<p>-2<\/p>\n<p>Multiplo<\/p>\n<p>Corta<\/p>\n<p>Questo è un esempio di specchietto standard di un Incantesimo. Cosa è possibile trovare al suo interno?<\/p>\n<ul>\n<li><strong>Nome e tipologia:<\/strong> ogni Conoscenza ha il suo nome e grazie al colore dello specchietto e ai simboli associati è possibile capire a quale tipologia appartiene (Scolastica, Extra, Avanzata).<br/>\nNel nostro esempio, apprendiamo dallo specchietto che il Bombarda Maxima è una Conoscenza Avanzata.<\/li>\n<li><strong>Descrizione:<\/strong> ogni Conoscenza possiede una sua descrizione di quelli che sono gli effetti ONGame, cioè cosa accade materialmente nel momento in cui un PG utilizza la Conoscenza all'interno del gioco.<br/>\nNel nostro esempio, abbiamo la descrizione degli effetti ONGame dell'Incantesimo Bombarda Maxima.<\/li>\n<li><strong>Immagine:<\/strong> in ogni Conoscenza è presente una piccola immagine esplicativa che funziona da esempio. Tuttavia, le immagini sono soltanto indicative e necessarie per dare un'idea generica di come funzioni l'Incantesimo e di come ce lo possiamo immaginare. A fare fede per le dinamiche di gioco sono tuttavia le descrizioni ONGame e OFFGame.<br/>\nNel nostro esempio, <em>l'amatissima<\/em> Dolores Umbridge ci mostra i simpatici effetti dell'Incantesimo Bombarda Maxima.<\/li>\n<li><strong>Bonus:<\/strong> si tratta di un bonus accessibile soltanto ai PG che possiedono Sapienza 25 nella Sapienza affine all'Incantesimo. Quasi tutte le Conoscenze Avanzate ne hanno uno.<\/li>\n<li><strong>Specifiche:<\/strong> le specifiche sono ciò di cui bisogna tenere conto OFFGame quando si utilizza una Conoscenza. Sono utili tanto per i Player quanto per il Narratore per capire quali sono materialmente gli effetti che ha una certa Conoscenza all'interno del gioco, in termini di bonus e di malus. Tutto ciò di cui bisogna tenere conto quando si usa una Conoscenza è scritta in questa sezione.<br/>\nNel nostro esempio, apprendiamo grazie alle specifiche il Bombarda Maxima ha una durata istantanea, quindi che ha effetto nel momento in cui viene lanciata, e che intacca un certo Parametro (ovvero la Salute) se dei PG vengono colpiti dai blocchi di detriti che l'incantesimo genera. Apprendiamo anche che, a seconda della Forza con cui viene lanciato l'Incantesimo e a seconda di chi è a lanciarlo (PG Studente, PG Adulto senza o con Sapienza affine), a variare è il numero di bersagli che può colpire contemporaneamente e la quantità di dretiti che genera.<br/>\n<strong>Attenzione:<\/strong> nel corso di Quest ed Eventi, la durata degli incantesimi e le modalità in cui essa si stabilisce può essere definita dal Narratore in base alle circostanze.<\/li>\n<li><strong>Valori:<\/strong> all'interno di questa tabella sono presenti, in breve, tutti quei Parametri che, esattamente come i PG, ogni Conoscenza ha. Sono Parametri necessari a valutare in maniera oggettiva il funzionamento della Conoscenza. Nel caso degli Incantesimi, questi Parametri sono:<ul>\n<li><strong>Tipo:<\/strong> la tipologia di Incantesimo (Offensivo, Difensivo, Elementale, Arcaico ecc.). Nel nostro caso, Bombarda Maxima è un Incantesimo Offensivo.<\/li>\n<li><strong>Parametro:<\/strong> il Parametro Magico su cui si basa l'Incantesimo. Più è alto il Parametro Magico di riferimento del PG che lancia l'incantesimo, più alti saranno gli effetti che avrà l'Incantesimo sul bersaglio. Nel nostro caso, il Parametro di riferimento è Potenza.<\/li>\n<li><strong>Forza:<\/strong> la Forzadell'Incantesimo è un Parametro che aiuta a determinare gli effetti dell'Incantesimo. Il valore numerico è necessario a capire, in parole povere, se un Incantesimo è più forte di un altro. Più la Forza è alta, maggiori sono gli effetti che l'Incantesimo è in grado di provocare. Gli effetti finali dipendono però sia dalla Forza dell'Incantesimo in tabella (che è quella standard), sia da diversi fattori come l'abilità del PG evocatore o altri bonus e malus. Nel nostro caso, la Forza del Bombarda Maxima è 200.<\/li>\n<li><strong>Fatica:<\/strong> è il valore di Fatica che il PG consuma ogni volta che lancia l'Incantesimo, a prescindere dalla Forza con cui lo lancia, anche se questa dovesse essere 0 e quindi fallire. Nel nostro caso, il Bombarda Maxima consuma -1,5 Fatica del PG.<\/li>\n<li><strong>Bersaglio:<\/strong> la tipologia di bersaglio che l'Incantesimo può colpire, che genericamente può essere \"Singolo\" (un punto preciso), \"Multiplo\" (più punti nella stessa zona), \"Area\" (un'area di una certa estensione variabile). Nel nostro caso, il Bombarda Maxima è a Bersaglio \"Area\" quindi colpisce e causa i propri effetti su una certa area decisa dall'evocatore.<\/li>\n<li><strong>Gittata:<\/strong> la gittata del nostro incantesimo, che può essere \"Corta\" (l'Incantesimo colpisce al massimo a qualche metro di distanza dal nostro PG, come nel caso degli scontri 1 vs 1) e \"Lunga\" (l'Incantesimo può colpire ad una distanza più lunga, fino a coprire una certa area).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<h3 id=\"pozioni\">Pozioni<\/h3>\n<p>Distillato del Chiodo Fisso<\/p>\n<p>Simile al mercurio liquido, ma insapore e inodore, questa pozione può indurre chi la beve a pensare ossessivamente ad un argomento o ad una persona, anche senza un motivo specifico. Questa pozione può essere messa in qualsiasi bevanda senza perdere le sue proprietà e chiunque ne subisce gli effetti difficilmente troverà pace dall'unico pensiero che lo/la tormenta fino anche a subirne l'impatto fisicamente.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Il protagonista dell'ossessione può essere scelto dalla vittima.<\/p>\n<details><summary><strong>Ingredienti e dosi<\/strong><\/summary>\n<ul>\n<li>1 Misurino di Ingrediente Base<\/li>\n<li>6 Lacrime di Banshee<\/li>\n<li>10 Unghie di Clabbert<\/li>\n<li>4 Spine di Rosa<\/li>\n<li>1 Foglia di Artemisia<\/li>\n<li>1 Testa di Papavero<\/li>\n<\/ul>\n<\/details>\n<details><summary><strong>Ricetta<\/strong><\/summary>\n<ul>\n<li>Aggiungere al mortaio La testa di papavero, le foglie di artemisia e l'ingrediente base<\/li>\n<li>Pestare fino a raggiungere una pappetta molle<\/li>\n<li>Aggiungere l'intruglio al calderone già rovente<\/li>\n<li>Lasciare cuocere per 10 secondi mescolando energicamente in senso antiorario<\/li>\n<li>Aggiungere al calderone 500 ml di acqua distillata<\/li>\n<li>Aggiungere al calderone un'unghia di clabbert e lasciare cuocere a fuoco basso per 24 ore senza mescolare<\/li>\n<li>Ripetere l'operazione per 4 volte in totale. Al termine di ogni giorno di cottura, la pozione passa dal verde, all'argento, al blu, al rosso<\/li>\n<li>Aggiungere al calderone la quinta unghia di clabbert e una lacrima di banshee e lasciare cuocere a fuoco moderato per 36 ore, mescolando ogni ora in senso orario<\/li>\n<li>Ripetere l'operazione un'altra volta. Al termine del secondo giorno di cottura, la pozione passa dal rosso al giallo<\/li>\n<li>Aggiungere al calderone la settima unghia di clabbert, la terza lacrima di bashee e una spina di rosa e lasciare cuocere a fuoco intenso per 48 ore, mescolando energicamente ogni mezz'ora in senso orario e ogni mezz'ora in senso antiorario<\/li>\n<li>Ripetere l'operazione fino ad aggiungere al calderone tutte le unghie di clabber disponibili, le lacrime di banshee e le spine di rosa. La pozione passa dal giallo, al turchese, al viola, al dorato<\/li>\n<li>Agitare la bacchetta per completare la pozione, che sarà grigio perlato<\/li>\n<\/ul>\n<\/details>\n<details><summary><strong>Specifiche<\/strong><\/summary>\n<p>Chi l'assume subisce un malus di Percezione, Acume, Volontà, Salute.<\/p>\n<p>Valori<\/p>\n<p>Classificazione<\/p>\n<p>Tipologia<\/p>\n<p>Forza Standard<\/p>\n<p>Somministrazione<\/p>\n<p>Durata<\/p>\n<p>xxxxx<\/p>\n<p>Mentale<\/p>\n<p>300<\/p>\n<p>Va bevuta<\/p>\n<p>7 post del bevitore<\/p>\n<p>Questo è un esempio di specchietto standard di un Incantesimo. Cosa è possibile trovare al suo interno?<\/p>\n<ul>\n<li><strong>Nome e tipologia:<\/strong> ogni Conoscenza ha il suo nome e grazie ai simboli associati è possibile capire a quale tipologia appartiene (Scolastica, Extra, Avanzata).<br/>\nNel nostro esempio, apprendiamo dallo specchietto che il Distillato del Chiodo Fisso è una Conoscenza Scolastica del VII anno.<\/li>\n<li><strong>Descrizione:<\/strong> ogni Conoscenza possiede una sua descrizione di quelli che sono gli effetti ONGame, cioè cosa accade materialmente nel momento in cui un PG utilizza la Conoscenza all'interno del gioco.<br/>\nNel nostro esempio, abbiamo la descrizione degli effetti ONGame del Distillato del Chiodo Fisso.<\/li>\n<li><strong>Immagine:<\/strong> in ogni Conoscenza è presente una piccola immagine esplicativa che funziona da esempio. Tuttavia, le immagini sono soltanto indicative e necessarie per dare un'idea generica di come funzioni la Conoscenza e di come ce la possiamo immaginare. A fare fede per le dinamiche di gioco sono tuttavia le descrizioni ON e OFF.<br/>\nNel nostro esempio, un'immagine di fialetta del Distillato del Chiodo Fisso.<\/li>\n<li><strong>Ingredienti e dosi:<\/strong> qui sono elencati tutti gli Ingredientinecessari per la preparazione della Pozione ONGame da parte dei PG ed in che dosi sono questi richiesti. Nel caso delle Pozioni acquistate o ottenute in altri modi, non è necessario tener conto di queste informazioni.<\/li>\n<li><strong>Ricetta:<\/strong> ogni Pozione ha la sua ricetta, esattamente come un piatto preparato in cucina. La ricetta, tuttavia, va seguita solo nel caso in cui un PG decida di ruolare ONGame la preparazione della pozione, pur rimanendo soltanto un aspetto di colore: non è obbligatorio ruolare ogni passaggio nè è necessario che questo venga descritto nei minimi dettagli. Nel caso delle Pozioni acquistate o ottenute in altri modi, non è necessario tener conto di queste informazioni.<\/li>\n<li><strong>Specifiche:<\/strong> le specifiche sono ciò di cui bisogna tenere conto OFFGame quando si utilizza una Conoscenza. Sono utili tanto per i player quanto per il Narratore per capire quali sono materialmente gli effetti che ha una certa Conoscenza all'interno del gioco, in termini di bonus e di malus. Tutto ciò di cui bisogna tenere conto quando si usa una Conoscenza è scritta in questa sezione.<br/>\nNel nostro esempio, apprendiamo grazie alle specifiche che il Distillato del Chiodo Fisso fornisce a chi l'assume un malus di Percezione, Acume, Volontà, Salute.<\/li>\n<li><strong>Valori:<\/strong> all'interno di questa tabella sono presenti, in breve, tutti quei Parametri che, esattamente come i PG, ogni Conoscenza ha. Sono Parametri necessari a valutare in maniera oggettiva il funzionamento della Conoscenza. Nel caso delle Pozioni, questi Parametri sono:<ul>\n<li><strong>Classificazione:<\/strong> il grado di Classificazionedi una Pozione. Più X ci sono, più questo è alto, più la Pozione è difficile da preparare e pericolosa. Nel nostro caso, il Distillato della Morte Vivente è una Pozione XXXX (pericolosa, serve un mago esperto).<\/li>\n<li><strong>Tipologia:<\/strong> le Pozioni sono suddivise per Tipologiea seconda dell'effetto che ha sul bersaglio.<br/>\nIl Distillato della Morte Vivente è una Pozione Offensiva, quindi che punta rallentare, distrarre o ferire il nemico in maniera tendenzialmente reversibile.<\/li>\n<li><strong>Forza standard:<\/strong> la Forza standard della Pozione è un Parametro che aiuta a determinare gli effetti di questa. Il valore numerico è necessario a capire, in parole povere, se una Pozione è più potente di un'altra. Più è alta la Forza, maggiori sono gli effetti, in termini di bonus e di malus, che la Pozione è in grado di provocare. Gli effetti finali dipendono però sia dalla Forza standard della Pozione in tabella, sia da diversi fattori come l'abilità del PG evocatore o altri bonus e malus. Nel nostro caso, la Forza standard del Distilalto del Chiodo Fisso è 300.<\/li>\n<li><strong>Somministrazione:<\/strong> il modo in cui deve essere utilizzata per attivarne gli effetti. A seconda del tipo di Pozione, queste possono essere bevute, lanciate, iniettate (nel caso dei Vaccini), mangiate, inalate, eccetera.<\/li>\n<li><strong>Durata:<\/strong> La durata degli effetti della Pozione.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<p><a id=\"creature\"><\/a><\/p>\n<h3 id=\"creature\">Creature Magiche<\/h3>\n<p>Snaso<\/p>\n<p>Lo Snaso è una bestia inglese. Soffice, nera e dotata di un lungo muso, questa creatura sotterranea ha una predilezione per tutte le cose luccicanti. Gli Snasi vengono spesso allevati dai Goblin per scavare nel profondo della terra in cerca di tesori. Benché lo Snaso sia gentile e anche affettuoso, può rivelarsi devastante nei confronti delle proprietà di un mago e non dovrebbe mai essere tenuto in casa. Gli Snasi vivono in tane fino a sei metri di profondità e danno alla luce da sei a otto piccoli per cucciolata.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<ul>\n<li>Se ostile, si attacca alla caviglia del bersaglio cercando di farlo rallentare causandogli un danno di Destrezza finché gli rimane addosso.<\/li>\n<\/ul>\n<p><strong>Ingredienti ottenibili<\/strong><br/>\nPelo<br/>\nUnghie<\/p>\n<details><summary><strong>Specifiche<\/strong><\/summary>\n<p><strong>Trovare oro<\/strong><br/>\nLo Snaso è un amante dell'oro e di tutto ciò che luccica. Nell'istante in cui un PG ruola con la compagnia del suo Snaso, egli può lanciare 1d10 e riesce a mettere le mani su qualcosa di:<br/>\n<em>Veramente prezioso, dal valore di 1d100 Galeoni:<\/em> 1 su 20<br/>\n<em>Placcato d'oro:<\/em> 2-9 su 20<br/>\n<em>1d100 Galeoni:<\/em> 10 su 20<br/>\n<em>Nulla:<\/em> 11-20 su 20<br/>\nIl PG può lanciare il dado una sola volta per ogni post in cui si trova con lui.<br/>\n<strong>Portare lo Snaso in Eventi<\/strong><br/>\nLo Snaso è imprevedibile: per ogni post in cui lo si porta con sé, il PG deve eseguire il lancio di cui sopra <strong>obbligatoriamente<\/strong>, dimostrandosi una distrazione continua per il suo Padrone che per questo motivo ottiene un malus del 10% della sua Destrezza a causa dello Snaso.<br/>\n<strong>Prendere l'oro a uno Snaso<\/strong><br/>\nIl vero problema, tuttavia, è provare a riprendere dalle sue mani ciò che ruba: il PG riesce a riprenderli lanciando due dadi 1dResistenza di cui è vincente il più alto fra i due. Può provare ogni volta che vuole ONGame.<br/>\n<strong>Rubare in case d'altri<\/strong><br/>\nLo Snaso, per quanto carino, non è dotato di grande intelligenza: nel momento in cui viene mandato in casa d'altri per rubare qualcosa avrà anche alte possibilità di farsi scoprire, poiché rumoroso e per niente discreto (1-8 su 10 viene scoperto).<\/p>\n<p>Valori<\/p>\n<p>Classificazione<\/p>\n<p>Forza attacco<\/p>\n<p>Fatica<\/p>\n<p>Salute<\/p>\n<p>Resistenza<\/p>\n<p>Destrezza<\/p>\n<p>xxx<\/p>\n<p>30<\/p>\n<p>40<\/p>\n<p>50<\/p>\n<p>150<\/p>\n<p>5<\/p>\n<p>Abilità<\/p>\n<p>Scova galeoni e oggetti dorati<\/p>\n<p>Questo è un esempio di specchietto standard di una Creatura Magica. Cosa è possibile trovare al suo interno?<\/p>\n<ul>\n<li><strong>Nome e tipologia:<\/strong> ogni Conoscenza ha il suo nome e ai simboli associati è possibile capire a quale tipologia appartiene (Scolastica, Extra, Avanzata).<br/>\nNel nostro esempio, apprendiamo dallo specchietto lo Snaso è una Conoscenza Scolastica del VI anno.<\/li>\n<li><strong>Descrizione:<\/strong> ogni Conoscenza possiede una sua descrizione di quelle che sono le caratteristiche ONGame della Creatura in questione, la sua descrizione fisica e qualche altro dettaglio che il PG deve tenere in considerazione nel momento in cui si trova faccia a faccia con questa.<br/>\nNel nostro esempio, abbiamo la descrizione ONGame dello Snaso.<\/li>\n<li><strong>Immagine:<\/strong> in ogni Conoscenza è presente una piccola immagine esplicativa che funziona da esempio. Tuttavia, le immagini sono soltanto indicative e necessarie per dare un'idea generica di come funzioni la Conoscenza e di come ce la possiamo immaginare. A fare fede per le dinamiche di gioco sono tuttavia le descrizioni ON e OFF.<br/>\nNel nostro esempio, il dolce Snaso si intasca senza pietà qualche Galeone.<\/li>\n<li><strong>Ingredienti ottenibili:<\/strong> qui sono elencati, se ce ne sono, gli Ingredienti che è possibile ottenere dalla Creatura secondo le modalità previste dallaGuida alla Magizoologia.<br/>\nDa uno Snaso, per esempio, è possibile ottenere Pelo ed Unghie.<\/li>\n<li><strong>Specifiche:<\/strong> le specifiche sono ciò di cui bisogna tenere conto OFFGame quando si utilizza una Conoscenza. Sono utili tanto per i player quanto per il Narratore per capire quali sono materialmente gli effetti che ha una certa Conoscenza all'interno del gioco, in termini di bonus e di malus. Tutto ciò di cui bisogna tenere conto quando si usa una Conoscenza è scritta in questa sezione.<br/>\nNel nostro esempio, apprendiamo grazie alle specifiche che l'abilità dello Snaso gli permette di recuperare Galeoni e altri oggetti, ed in che modo, se il PG lo porta con sè durante le role.<\/li>\n<li><strong>Valori:<\/strong> all'interno di questa tabella sono presenti, in breve, tutti quei Parametri che, esattamente come i PG, ogni Conoscenza ha. Sono Parametri necessari a valutare in maniera oggettiva il funzionamento della Conoscenza. Nel caso degli Incantesimi, questi Parametri sono:<ul>\n<li><strong>Classificazione:<\/strong> il grado di Classificazionedi una Creatura. Più X ci sono, più questo è alto, più la Creatura è pericolosa e difficile da addomesticare. Nel nostro caso, la Snaso è una Creatura XXX (un mago capace dovrebbe cavarsela).<\/li>\n<li><strong>Forza attacco:<\/strong> esattamente come per gli Incantesimi, ogni Creatura Magica è in grado di attaccare il bersaglio con una certa Forza. La Forza della Creatura è un Parametro che aiuta a determinare gli effetti del suo attacco. Il valore numerico è necessario a capire, in parole povere, se una Creatura è più forte di un'altra. Più è alta la Forza, maggiori sono gli effetti che l'attacco della Creatura è in grado di provocare. Gli effetti finali dipendono però sia dalla Forza dell'attacco in tabella (che è quella standard), sia da diversi fattori come la fase vitale della Creatura o altri bonus e malus.<br/>\nNel nostro caso, la Forza attacco dello Snaso è 30.<\/li>\n<li><strong>Fatica, Salute, Resistenza, Destrezza:<\/strong> esattamente come per i PG, in quanto esseri viventi anche le Creature Magiche posseggono dei Parametri Fisici di cui è necessario dover tenere conto nel momento in cui le si affronta. Questi possono variare a seconda della Creatura specifica e delle sue abilità, nonché delle sue caratteristiche fisiche, ma tendenzialmente sono Fatica, Salute, Resistenza e Destrezza.<\/li>\n<li><strong>Abilità:<\/strong> ogni Creatura Magica possiede un'abilità specifica, ovvero cosa nel pratico può e sa fare la Creatura all'interno del gioco.<br/>\nLo Snaso sa scovare Galeoni e oggetti dorati.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<p><a id=\"piante\"><\/a><\/p>\n<h3 id=\"piante\">Piante Magiche<\/h3>\n<p>Stupefiore +<\/p>\n<p>Lo Stupefiore è una pianta tipica del Sudafrica che grazie agli esperimenti degli Erbologi si è diffusa anche in Brasile e in molteplici zone dell'Amazzonia, dove ha trovato un habitat altrettanto fecondo per la sua diffusione. Nonostante il nome, lo Stupefiore è una pianta senza fiori così chiamata per la sua caratteristica forma all'apertura. Appare come un grosso bocciolo di rosa alto 6 metri, che si apre ogni volta che si sente minacciata: si mostra come un fiore a quattro petali di uno sgargiante arancione e dal foro esce un tentacolo rosa a tutta velocità con cui stordisce i malcapitati.<br/>\nNon ama i rumori e lo scricchiolio delle foglie ed è in tutto e per tutto una pianta scorbutica. Essere travolti dal suo tentacolo, tuttavia, potrebbe risultare molto pericoloso vista la forza dell'impatto e la velocità del tentacolo.<br/>\nPurtroppo, i suoi ingredienti utili stanno proprio nel tentacolo, che va reciso di netto per accaparrarsi semi e baccelli.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<ul>\n<li>Se incontrata ONGame questa pianta è <strong>sempre ostile<\/strong>. Di conseguenza, la sua coltivazione (dentro Serre e non) è illegale e il PG che lo fa può rischiare di essere scoperto, denunciato e sanzionato.<\/li>\n<li>L'acquisto o la vendita di questa Pianta è illegale per tutti i PG. Chiunque ne richieda l'acquisto o lo venda rischia di essere scoperto, denunciato e sanzionato.<\/li>\n<\/ul>\n<p><strong>Fasi di sviluppo<\/strong><br/>\n<strong>Germinazione:<\/strong> Una pianta simile ad una rosa cresce e si dimena nel terreno<br/>\n<strong>Vegetazione:<\/strong> La pianta cresce fino al 50% ma non è pronta a schiudersi<br/>\n<strong>Riproduzione:<\/strong> La pianta cresce al massimo della forma e al minimo rumore si apre, lasciando agire il tentacolo<br/>\n<strong>Senescenza:<\/strong> La pianta rimane chiusa, col bocciolo che pende verso terra<br/>\n<strong>Ingredienti ottenibili<\/strong><br/>\nBaccelli<br/>\nTentacolo<\/p>\n<details><summary><strong>Specifiche<\/strong><\/summary>\n<p>Subire un colpo dal suo tentacolo significa beccarsi un occhio nero e un malus di Salute.<\/p>\n<p>Valori<\/p>\n<p>Classificazione<\/p>\n<p>Forza<\/p>\n<p>Salute<\/p>\n<p>Resistenza<\/p>\n<p>Destrezza tentacolo<\/p>\n<p>Abilità<\/p>\n<p>xxxxx<\/p>\n<p>130<\/p>\n<p>150<\/p>\n<p>100<\/p>\n<p>22<\/p>\n<p>Colpisce con forza il bersaglio<\/p>\n<p>Questo è un esempio di specchietto standard di una Pianta Magica. Cosa è possibile trovare al suo interno?<\/p>\n<ul>\n<li><strong>Nome e tipologia:<\/strong> ogni Conoscenza ha il suo nome e ai simboli associati è possibile capire a quale tipologia appartiene (Scolastica, Extra, Avanzata).<br/>\nNel nostro esempio, apprendiamo dallo specchietto lo Stupefiore è una Conoscenza Extra.<\/li>\n<li><strong>Descrizione:<\/strong> ogni Conoscenza possiede una sua descrizione di quelle che sono le caratteristiche ONGame della Pianta in questione, la sua descrizione fisica e qualche altro dettaglio che il PG deve tenere in considerazione nel momento in cui si trova faccia a faccia con questa.<br/>\nNel nostro esempio, abbiamo la descrizione ONGame dello Stupefiore.<\/li>\n<li><strong>Immagine:<\/strong> in ogni Conoscenza è presente una piccola immagine esplicativa che funziona da esempio. Tuttavia, le immagini sono soltanto indicative e necessarie per dare un'idea generica di come funzioni la Conoscenza e di come ce la possiamo immaginare. A fare fede per le dinamiche di gioco sono tuttavia le descrizioni ON e OFF.<br/>\nNel nostro esempio, un esemplare di Stupefiore in tutta la sua... bellezza.<\/li>\n<li><strong>Fasi di sviluppo:<\/strong> ogni Pianta Magica attraversa diverse fasi vitali e si presenta al PG con un'aspetto diverso a seconda della fase vitale che sta attraversando. Qui è elencato ciò che il PG può vedere ONGame a seconda della fase vitale della Pianta Magiche con cui si trova ad avere a che fare<\/li>\n<li><strong>Ingredienti ottenibili:<\/strong> qui sono elencati, se ce ne sono, gli Ingredienti che è possibile ottenere dalla Pianta secondo le modalità previste dallaGuida all'Erbologia.<br/>\nDa uno Stupefiore, per esempio, è possibile ottenere i Baccelli ed il Tentacolo, ma sono entrambi Ingredienti Illegali.<\/li>\n<li><strong>Specifiche:<\/strong> le specifiche sono ciò di cui bisogna tenere conto OFFGame quando si utilizza una Conoscenza. Sono utili tanto per i player quanto per il Narratore per capire quali sono materialmente gli effetti che ha una certa Conoscenza all'interno del gioco, in termini di bonus e di malus. Tutto ciò di cui bisogna tenere conto quando si usa una Conoscenza è scritta in questa sezione.<br/>\nNel nostro esempio, apprendiamo grazie alle specifiche che subire un colpo dal tentacolo dello Stupefiore provoca un malus.<\/li>\n<li><strong>Valori:<\/strong> all'interno di questa tabella sono presenti, in breve, tutti quei Parametri che, esattamente come i PG, ogni Conoscenza ha. Sono Parametri necessari a valutare in maniera oggettiva il funzionamento della Conoscenza. Nel caso degli Incantesimi, questi Parametri sono:<ul>\n<li><strong>Classificazione:<\/strong> il grado di Classificazionedi una Pianta. Più X ci sono, più questo è alto, più la Creatura è pericolosa e difficile da addomesticare. Nel nostro caso, la Stupefiore è una Pianta XXXXX (nota Pianta rara, talvolta ammazzamaghi, difficile da controllare).<\/li>\n<li><strong>Forza:<\/strong> esattamente come per gli Incantesimi, ogni Pianta Magica è in grado di attaccare il bersaglio con una certa Forza. La Forza della Pianta è un Parametro che aiuta a determinare gli effetti del suo attacco. Il valore numerico è necessario a capire, in parole povere, se una Pianta è più forte di un'altra. Più è alta la Forza, maggiori sono gli effetti che l'attacco della Pianta è in grado di provocare. Gli effetti finali dipendono però sia dalla Forza dell'attacco in tabella (che è quella standard), sia da diversi fattori come la fase vitale della Pianta o altri bonus e malus.<br/>\nNel nostro caso, la Forza dello Stupefiore è 130.<\/li>\n<li><strong>Salute, Resistenza, Destrezza:<\/strong> esattamente come per i PG, in quanto esseri viventi anche le Piante Magiche posseggono dei Parametri Fisici di cui è necessario dover tenere conto nel momento in cui le si affronta. Questi possono variare a seconda della Creatura specifica e delle sue abilità, nonché delle sue caratteristiche fisiche, ma tendenzialmente sono Salute, Resistenza e Destrezza.<\/li>\n<li><strong>Abilità:<\/strong> ogni Pianta Magica possiede un'abilità specifica, ovvero cosa nel pratico può e sa fare la Creatura all'interno del gioco.<br/>\nLo Stupefiore colpisce con forza il bersaglio.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<p><a id=\"altre\"><\/a><\/p>\n<h3 id=\"altre\">Altre Conoscenze<\/h3>\n<p>Addestratore di Creature<\/p>\n<p>Con questa capacità, il PG è tanto abile ad empatizzare con le Creature Magiche da riuscire ad addomesticarle e a creare con più facilità un rapporto di fiducia stabile e reciproco. Le Creature hanno più probabilità di obbedire al PG, ascoltare le sue direttive, seguirlo nella sua riserva e in giro per il mondo. In caso di pericolo, corrono in soccorso del PG dovunque si trovino e percepiscono che il padrone si trova in pericolo pur essendo lontane da lui.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Utilizzando la tecnica Imitazione il PG può ottenere un maggiore numero di possibilità per la riuscita della Domesticazione nelle sue varie fasi.<\/p>\n<p>Seduta Spiritica +<\/p>\n<p>Una seduta spiritica è un rituale in cui un gruppo di persone, noto come i partecipanti, cerca di comunicare con gli spiriti dei defunti o altre entità non fisiche. Questo processo è spesso condotto da un medium, una persona che agisce come tramite tra il mondo fisico e il mondo spirituale.<br/>\nDurante una seduta spiritica, i partecipanti di solito si siedono intorno a un tavolo o in cerchio, spesso tenendo le mani unite. Il medium può entrare in uno stato di trance o utilizzare altre tecniche per facilitare la comunicazione con gli spiriti. Gli spiriti possono essere invitati a partecipare alla seduta attraverso invocazioni o richieste di comunicazione.<br/>\nLe comunicazioni durante una seduta spiritica possono avvenire in vari modi, tra cui voci udite solo dal medium o da alcuni dei partecipanti, movimenti fisici degli oggetti presenti nella stanza (come il tavolo che si muove o batte), scrittura automatica (il medium scrive messaggi senza rendersene conto) o visioni mentali.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>In base alla riuscita i PG possono utilizzare questa tecnica per comunicare con i defunti.<br/>\nSe l'interazione è di colore, le comunicazioni possono essere gestite dai player. Se invece la seduta riguarda eventi di trama o elementi di ambientazione è sempre il Narratore ad intervenire e masterare.<\/p>\n<details><summary><strong>Specifiche<\/strong><\/summary>\n<p>In base alla riuscita della Conoscenza il PG Divinatore è più o meno abile nella gestione delle comunicazioni coi defunti.<\/p>\n<ul>\n<li>Con esito <strong>100%<\/strong>, il PG viene posseduto dal Defunto: parlerà con una voce differente poiché l'anima del defunto sarà entrata dentro di lui. Al termine della possessione, non ricorderà cosa è stato detto.<\/li>\n<li>Con esito <strong>66%<\/strong>, il PG è l'unico a sentire delle voci e può riassumerle ai partecipanti.<\/li>\n<li>Con esito <strong>33%<\/strong>, il PG comunica coi defunti soltanto attraverso colpi e segni fisici (es. \"Se ci sei batti un colpo!\").<\/li>\n<li>Con riuscita allo <strong>0%<\/strong>, il PG non riesce a comunicare con i defunti in alcun modo.<\/li>\n<\/ul>\n<p>Valori<\/p>\n<p>Parametro<\/p>\n<p>Fatica<\/p>\n<p>Percezione<\/p>\n<p>-4 Fatica<\/p>\n<p>Vaccinatore +<\/p>\n<p>Il PG è molto abile nel somministrare Vaccini per prevenire l'Insorgere di Malattie Magiche, riducendo al minimo le possibilità di complicazioni.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<ul>\n<li>In caso di complicazioni il PG deve necessariamente rivolgersi al Narratore.<\/li>\n<li>Anche in caso di complicazioni, il Vaccino ha comunque effetto.<\/li>\n<\/ul>\n<\/details>\n<details><summary><strong>Complicazioni<\/strong><\/summary>\n<p><strong>Se somministrato da PG Studenti...<\/strong><\/p>\n<ul>\n<li>100%: vaccinazione eseguita perfettamente<\/li>\n<li>66%: il PG reagisce con Irritazione, Shock, Convulsioni<\/li>\n<li>33%: il PG reagisce con Irritazione, Shock, Convulsioni e Coma<br/>\n<strong>Se somministrato da PG Adulti senza Sapienza Medimagica...<\/strong><\/li>\n<li>100%: vaccinazione eseguita perfettamente<\/li>\n<li>66%: il PG reagisce con Irritazione<\/li>\n<li>33%: il PG reagisce con Irritazione e Shock<br/>\n<strong>Se somministrato da PG Adulti con Sapienza Medimagica 1+...<\/strong><\/li>\n<li>100%: vaccinazione eseguita perfettamente<\/li>\n<\/ul>\n<p>Questi sono degli esempi di specchietti standard di Conoscenze che non sono proprio Incantesimi né altro, ma abilità specifiche che sanno mettere in pratica i PG che la possiedono. Cosa è possibile trovare al loro interno? In realtà, a differenza delle altre tipologie di specchietti, questi variano a seconda della Conoscenza specifica. In linea di massima però è possibile incontrare elementi più o meno simili.<\/p>\n<ul>\n<li><strong>Nome e tipologia, Descrizione, Immagine, Specifiche:<\/strong> funzionano esattamente come per gli Incantesimi, le Creature Magiche, le Piante Magiche e le Pozioni.<\/li>\n<li><strong>Valori:<\/strong> all'interno di questa tabella sono presenti, in breve, tutti quei Parametri che, esattamente come i PG, ogni Conoscenza ha. Sono Parametri necessari a valutare in maniera oggettiva il funzionamento della Conoscenza. Questi possono essere diversi a seconda della Conoscenza specifica che si decide di utilizzare, ma tendenzialmente sono:<ul>\n<li><strong>Parametro:<\/strong> il Parametro su cui si basa l'utilizzo della Conoscenza.<\/li>\n<li><strong>Forza:<\/strong> la Forza della Conoscenza, che funziona esattamente come per gli Incantesimi.<\/li>\n<li><strong>Fatica:<\/strong> è il valore di Fatica che il PG consuma ogni volta che lancia la Conoscenza, a prescindere dalla Forza con cui lo lancia, anche se questa dovesse essere 0 e quindi fallire. Dove non specificato diversamente, la Fatica persa viene recuperata normalmente, ovvero +1 Punto Fatica per ogni post in cui non si utilizza nessun Incantesimo o nessun'altra Conoscenza.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<p><a id=\"usoconoscenze\"><\/a><\/p>\n<h2 id=\"usoconoscenze\">L'uso delle Conoscenze<\/h2>\n<p>Tutti i PG del gioco, sia Studenti che Adulti, possono ambire a possedere ed utilizzare qualsiasi genere di Conoscenza, da quelle Scolastiche a quelle Avanzate.<br/>\nA cambiare, in base a tipo di Conoscenza e del PG che la utilizza, sono le possibilità che il PG che di usare la Conoscenza al massimo della sua Forza. Questa, infatti, viene calcolata in base agli esiti di <strong>1d10<\/strong>.<br/>\nOgni volta che un PG usa infatti una Conoscenza, si lancia <strong>1d10<\/strong>: più la Conoscenza è avanzata, più è difficile evocarla a piena Forza.<br/>\nI livelli di Forza possibili sono 4:<br/>\n<strong>• 0%:<\/strong> la Conoscenza non ha nessun effetto, non funziona, il PG fallisce nell'uso e rischia un Ritorno di Fiamma della Bacchetta (solo durante le free role);<br/>\n<strong>• 33%:<\/strong> la Conoscenza viene applicata al minimo della sua Forza;<br/>\n<strong>• 66%<\/strong>: la Conoscenza viene applicata quasi al massimo della sua Forza<br/>\n<strong>• 100%:<\/strong> la Conoscenza viene applicata al massimo della sua Forza.<br/>\nVien da sé che evocare una Conoscenza con Forza fra il 66% e lo 0% significa ricevere dei malus di Forza nell'efficacia della Conoscenza.<\/p>\n<blockquote class=\"callout example\">\n<p><strong>Esempio.<\/strong><br/>\nUn PG Adulto evoca un Protego Maxima, una Conoscenza Avanzata, senza avere la Sapienza Difensiva.<br/>\nLancia 1d10 e pesca 5: a questo esito, senza Sapienza affine, corrisponde una potenza del 66%. L'Incantesimo riesce quindi al 66% della sua Forza (che è 100), per cui avrà effetto come se la sua Forza fosse 66 (il 66% di 100).<\/p>\n<\/blockquote>\n<p>Va ricordato che la Forza base di una Conoscenza, oltre che essere mediata dal risultato dell'<strong>1d10<\/strong>, viene influenzata anche dal Parametro Magico di riferimento del PG evocatore.<\/p>\n<blockquote class=\"callout example\">\n<p><strong>Esempio.<\/strong><br/>\nLo Stupeficium di un PG con Potenza 18 è più potente di quello di un PG con Potenza 10 anche se entrambi riescono ad evocarlo con Forza 100%.<\/p>\n<\/blockquote>\n<p>E' necessario ricordare anche che ogni Conoscenza consuma un certo quantitativo di <strong>Fatica<\/strong>, che deve essere recuperata nei modi specificati qui.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>La Divinazione segue un procedimento differente, per cui quanto segue non vale per le Conoscenze Divinatorie.<\/p>\n<p><a id=\"advsstud\"><\/a><\/p>\n<h3 id=\"advsstud\">PG Adulti vs PG Studenti: Sapienze e Materie Scolastiche<\/h3>\n<p>Non tutte le Conoscenze esistenti vengono insegnate ad Hogwarts. Mentre quindi ogni Conoscenza Scolastica possiede una propria materia di riferimento, non tutte le Conoscenze Extra o Avanzate possono essere collegate in maniera diretta ad una materia.<br/>\nPG Studenti che apprendono o comprano quindi Conoscenze Extra o Avanzate possono tener conto di essere più o meno bravi in un certo ambito sulla base della seguente corrispondenza tra Materia Scolastica e Conoscenze.<br/>\n<strong>Corrispondenza tra Materia Scolastica e Conoscenze<\/strong><br/>\n<strong>Incantesimi e Conoscenze Elementali e Magizoologiche<\/strong> → Cura delle Creature Magiche<br/>\n<strong>Incantesimi e Conoscenze Difensive e Offensive<\/strong> → Difesa Contro le Arti Oscure<br/>\n<strong>Incantesimi e Conoscenze Erbologiche<\/strong> → Erbologia<br/>\n<strong>Incantesimi e Conoscenze Arcaiche, Mentali, Oscure<\/strong> → Incantesimi<br/>\n<strong>Incantesimi e Conoscenze e Pozionistiche e Medimagiche<\/strong> → Pozioni<br/>\n<strong>Incantesimi e Conoscenze Trasfigurative<\/strong>→ Trasfigurazione<\/p>\n<p><a id=\"conscol\"><\/a><\/p>\n<h3 id=\"conscol\">Conoscenze Scolastiche<\/h3>\n<p>A partire dal lancio di 1d10 è possibile decretare la riuscita dell'incantesimo evocato. Ogni categoria di PG ha delle probabilità di riuscita differenti. Le eventuali possibilità bonus fornite dall'utilizzo di un Oggetto o Conoscenza si <strong>aggiungono al risultato del dado ottenuto<\/strong>.<\/p>\n<details><summary><strong>Usare una Conoscenza Scolastica:<\/strong><\/summary>\n<blockquote class=\"callout\">\n<\/blockquote>\n<p><strong>PG Studenti:<\/strong><br/>\n<em>Troll:<\/em><\/p>\n<ul>\n<li>1-4= 0%<\/li>\n<li>5-7= 33%<\/li>\n<li>8-9= 66%<\/li>\n<li>10= 100%<br/>\n<em>Desolante:<\/em><\/li>\n<li>1-3= 0%<\/li>\n<li>4-6= 33%<\/li>\n<li>7-8= 66%<\/li>\n<li>9-10= 100%<br/>\n<em>Scadente:<\/em><\/li>\n<li>1-2= 0%<\/li>\n<li>3-4= 33%<\/li>\n<li>5-7= 66%<\/li>\n<li>8-10= 100%<br/>\n<em>Accettabile:<\/em><\/li>\n<li>1 = 0%<\/li>\n<li>2-3= 33%<\/li>\n<li>4-5= 66%<\/li>\n<li>6-10= 100%<br/>\n<em>Oltre Ogni Previsione:<\/em><\/li>\n<li>1= 33%<\/li>\n<li>2-3= 66%<\/li>\n<li>4-10= 100%<br/>\n<em>Eccezionale:<\/em><\/li>\n<li>100%<br/>\n<strong>PG Adulti:<\/strong><\/li>\n<li>100%<\/li>\n<\/ul>\n<\/details>\n<p><a id=\"conex\"><\/a><\/p>\n<h3 id=\"conex\">Conoscenze Extra<\/h3>\n<p>A partire dal lancio di 1d10 è possibile decretare la riuscita dell'incantesimo evocato. Ogni categoria di PG ha delle probabilità di riuscita differenti. Le eventuali possibilità bonus fornite dall'utilizzo di un Oggetto o Conoscenza si <strong>aggiungono al risultato del dado ottenuto<\/strong>.<\/p>\n<details><summary><strong>Usare una Conoscenza Extra:<\/strong><\/summary>\n<blockquote class=\"callout\">\n<\/blockquote>\n<p><strong>PG Studenti<\/strong><br/>\n<em>Troll:<\/em><\/p>\n<ul>\n<li>1-7 = 0%<\/li>\n<li>8-9 = 33%<\/li>\n<li>10 = 66%<br/>\n<em>Desolante:<\/em><\/li>\n<li>1-5= 0%<\/li>\n<li>6-7= 33%<\/li>\n<li>8-9= 66%<\/li>\n<li>10= 100%<br/>\n<em>Scadente:<\/em><\/li>\n<li>1-3= 0%<\/li>\n<li>4-5= 33%<\/li>\n<li>6-8= 66%<\/li>\n<li>9-10= 100%<br/>\n<em>Accettabile:<\/em><\/li>\n<li>1-2= 0%<\/li>\n<li>3-4= 33%<\/li>\n<li>5-6= 66%<\/li>\n<li>7-10= 100%<br/>\n<em>Oltre Ogni Previsione:<\/em><\/li>\n<li>1= 0%<\/li>\n<li>2-3= 33%<\/li>\n<li>4-5= 66%<\/li>\n<li>6-10= 100%<br/>\n<em>Eccezionale:<\/em><\/li>\n<li>1= 0%<\/li>\n<li>2= 33%<\/li>\n<li>3-4= 66%<\/li>\n<li>5-10= 100%<br/>\n<strong>PG Adulti senza Sapienza affine:<\/strong><\/li>\n<li>1= 0%<\/li>\n<li>2= 33%<\/li>\n<li>3= 66%<\/li>\n<li>4-10= 100%<br/>\n<strong>PG Adulti con Sapienza affine:<\/strong><\/li>\n<li>100%<\/li>\n<\/ul>\n<\/details>\n<p><a id=\"conava\"><\/a><\/p>\n<h3 id=\"conava\">Conoscenze Avanzate<\/h3>\n<p>A partire dal lancio di 1d10 è possibile decretare la riuscita dell'incantesimo evocato. Ogni categoria di PG ha delle probabilità di riuscita differenti. Le eventuali possibilità bonus fornite dall'utilizzo di un Oggetto o Conoscenza si <strong>aggiungono al risultato del dado ottenuto<\/strong>.<\/p>\n<details><summary><strong>Usare una Conoscenza Avanzata:<\/strong><\/summary>\n<blockquote class=\"callout\">\n<\/blockquote>\n<p><strong>PG Studenti<\/strong><br/>\n<em>Troll, Desolante, Scadente:<\/em><\/p>\n<ul>\n<li>0%<br/>\n<em>Accettabile:<\/em><\/li>\n<li>1-4= 0%<\/li>\n<li>5-6= 33%<\/li>\n<li>7-8= 66%<\/li>\n<li>9-10= 100%<br/>\n<em>Oltre Ogni Previsione:<\/em><\/li>\n<li>1-3= 0%<\/li>\n<li>4-5= 33%<\/li>\n<li>6-7= 66%<\/li>\n<li>8-10= 100%<br/>\n<em>Eccezionale:<\/em><\/li>\n<li>1-2= 0%<\/li>\n<li>3-4= 33%<\/li>\n<li>5-6= 66%<\/li>\n<li>7-10= 100%<br/>\n<strong>PG Adulti senza Sapienza affine:<\/strong><\/li>\n<li>1= 0%<\/li>\n<li>2-3= 33%<\/li>\n<li>4-5= 66%<\/li>\n<li>6-10= 100%<br/>\n<strong>PG Adulti con Sapienza Lv. 1:<\/strong><\/li>\n<li>1-2= 33%<\/li>\n<li>3-4= 66%<\/li>\n<li>5-10= 100%<br/>\n<strong>PG Adulti con Sapienza Lv. 2:<\/strong><\/li>\n<li>1= 33%<\/li>\n<li>2-3= 66%<\/li>\n<li>4-10= 100%<br/>\n<strong>PG Adulti con Sapienza Lv. 3:<\/strong><\/li>\n<li>1= 33%<\/li>\n<li>2= 66%<\/li>\n<li>3-10= 100%<br/>\n<strong>PG Adulti con Sapienza Lv. 4:<\/strong><\/li>\n<li>1= 66%<\/li>\n<li>2-10= 100%<br/>\n<strong>PG Adulti con Sapienza Lv. 5:<\/strong><\/li>\n<li>100%<\/li>\n<\/ul>\n<\/details>\n<p><a id=\"narraesito\"><\/a><\/p>\n<h3 id=\"narraesito\">Narrare gli esiti del dado<\/h3>\n<p>Quindi, a ciascun risultato ottenuto dal lancio del 1d10, e quindi a ciascuna percentuale di riuscita ottenuta, corrisponde un certo effetto. L'utilizzo di una Conoscenza al <strong>100%<\/strong>, <strong>66%<\/strong>, <strong>33%<\/strong> o <strong>0%<\/strong>, di conseguenza, porta ad una narrazione differente delle azioni del PG Evocatore.<br/>\nSia i player che ruolano in autonomia, sia il Narratore possono tenere conto delle seguenti linee guida per gestire proprio nel pratico gli effetti che corrispondono a ciascun esito ottenuto.<br/>\nRicorda: nessuno è perfetto, né nella vita reale né ONGame. Quante volte ci capita di far cadere un arnese o sbagliare qualcosa al di là del numero di volte che si è eseguita quell'operazione?<br/>\nDistrazioni, stress, pensieri per la testa: tante sono le ragioni per cui è possibile fallire nello svolgimento di un'azione normalmente banale e questo non implica che sia la fine del mondo: per maghi e streghe è normale non riuscire nell'immediato in un'evocazione, soprattutto se appartenente ad una disciplina a lui ancora ostica.<\/p>\n<ul>\n<li>Riuscire nell'evocazione della Conoscenza allo <strong>0%<\/strong> significa evocare dalla bacchetta uno sbuffo, creare una pozione acquosa, non riuscire ad attirare le attenzioni di una Creatura o far marcire una Pianta Magica.<br/>\nNon implica dunque un totale fallimento nell'evocazione/riuscita: dalla bacchetta, dal calderone, qualsiasi cosa il PG stia facendo, viene sempre fuori qualcosa, semplicemente non alla potenza o nel modo sperati.<\/li>\n<li>Riuscire nell'evocazione della Conoscenza al <strong>33%<\/strong> significa evocare dalla bacchetta flebili scintille o fasci di luce, riuscire a canalizzare la magia evocata ma senza darle la potenza sperata; creare una Pozione che dà effetti molto deboli a chi li ingerisce, attirare appena le attenzioni delle Creature o salvare una Pianta Magica per il rotto della cuffia.<\/li>\n<li>Riuscire nell'evocazione della Conoscenza al <strong>66%<\/strong> significa evocare un buon Incantesimo o una Pozione decente; attirare le attenzioni di una Creatura Magica o saper trattare con una Pianta nel modo giusto.<br/>\nTuttavia, c'è sempre qualcosa che manca, qualcosa che allontana l'evocatore/utilizzatore dalla perfezione e che può essere raggiunta con una migliore pratica.<\/li>\n<li>Riuscire nell'evocazione della Conoscenza al <strong>100%<\/strong> significa evocare un Incantesimo perfetto, creare una Pozione perfetta, interagire nella maniera migliore possibile con Creature o Piante Magiche, o per lo meno \"perfetta\" per le potenzialità del PG evocatore/utilizzatore: il PG è in grado di incanalare la magia nel modo a lui più congeniale, ottenendo da essa esattamente ciò che desidera.<br/>\nPer migliorare ancora non gli resta che accrescere l'abilità specifica di riferimento e avviarsi allo sviluppo futuro di Sapienze e Sapienza.<\/li>\n<\/ul>\n<p><a id=\"annullare\"><\/a><\/p>\n<h2 id=\"annullare\">Annullare gli effetti di una Conoscenza<\/h2>\n<p>Esattamente come nella vita vera, anche in Felix Felicis GdR nulla è davvero <em>irreversibile<\/em>. Gli effetti di una Conoscenza possono essere sempre annullati tranne casi eccezionali.<br/>\nTendenzialmente, per annullare gli effetti di una Conoscenza che abbia una certa Forza, è necessario fare *qualcosa *(come per esempio un controincantesimo, usare un antidoto o simili) che abbia <strong>Forza maggiore<\/strong> di quella con cui è stata evocata la Conoscenza che si vuole annullare.<\/p>\n<p><a id=\"anninc\"><\/a><\/p>\n<h3 id=\"anninc\">Annullare un Incantesimo<\/h3>\n<p>Di seguito sono elencati alcuni dei più comuni controincantesimi per annullare gli effetti di un Incantesimo lanciato da un certo PG.<\/p>\n<ul>\n<li><strong>Finite Incantatem<\/strong> e <strong>Surgito<\/strong> annullano la gran parte degli effetti di Fatture, Incantesimi Offensivi o Maledizioni, purché la loro Forza sia maggiore della Forza degli Incantesimi precedentemente evocati sul bersaglio.<br/>\nÈ possibile lanciare più di un Finite Incantatem o Surgito contemporaneamente per accumulare e sommare la Forza di ciascuno.<\/li>\n<li><strong>Reparifarge<\/strong> annulla qualsiasi genere di Trasfigurazione, intera o parziale, corretta o non corretta, purché la sua Forza sia maggiore della Forza degli Incantesimi precedentemente evocati sul bersaglio. Alle stesse condizioni, è in grado di riportare sulla terra un bersaglio fatto evanescere per metà all'interno del limbo.<\/li>\n<li><strong>Evocatio<\/strong> riporta sulla Terra un bersaglio umano o di grandi dimensioni fatto evanescere in precedenza per intero purché la sua Forza sia maggiore della Forza degli Incantesimi precedentemente evocati sul bersaglio.<\/li>\n<li>L'<strong>Esorcismo<\/strong> è una disciplina magica avanzata dedicata alla rimozione di malefici potenti come il Flagello e il Maleficio da oggetti, luoghi o persone.<\/li>\n<li>Lo <strong>Spezzamento<\/strong> una disciplina magica dedicata alla rimozione di riti oscuri di media entità come Scherno, Malocchio e Piaga da oggetti, luoghi o persone.<br/>\nCiò che è neessario ricordare è che ogni incantesimo può essere annullato con il proprio controincantesimo <strong>se la Forza del controincantesimo è maggiore della Forza dell'Incantesimo da annullare<\/strong>. Questo significa che per annullare Incantesimi troppo potenti potrebbe essere necessario:<\/li>\n<li>o lanciare più volte lo stesso controincantesimo;<\/li>\n<li>o collaborare affinchè più PG, insieme, riescano ad annullarlo.<\/li>\n<\/ul>\n<p><a id=\"annpoz\"><\/a><\/p>\n<h3 id=\"annpoz\">Annullare gli effetti di una Pozione<\/h3>\n<p>Salvo dove diversamente specificato o a discrezione del Narratore, è sempre possibile annullare gli effetti di una Pozione mentre questi sono in corso, in base al tipo di danno riportato ed alla tipologia di Pozione:<\/p>\n<ul>\n<li>nel caso in cui una Pozione comporti la perdita di Punti Saluti, è possibile curarsi attraverso il ricorso alla Medimagia;<\/li>\n<li>nel caso invece di alcune Pozioni specifiche, è possibile utilizzare i rispettivi <strong>Antidoti<\/strong>;<\/li>\n<li>inoltre, nel caso di Pozioni minori, è efficace l'Incantesimo <strong>Surgito<\/strong>.<br/>\nNelle Specifiche di ogni Pozione è evidenziato quali di questi mezzi è possibile utilizzare per annullare anticipatamente gli effetti delle Pozioni.<br/>\n<strong>Annullare gli effetti di una Pozione: chi, quando e come?<\/strong><\/li>\n<li><strong>Chi può annullare gli effetti di una Pozione in corso?<\/strong> Sia la vittima della Pozione, sia un altro PG/altri PG possono annullare gli effetti di una Pozione in corso, a patto che:<\/li>\n<\/ul>\n<ol>\n<li>abbia capito di essere vittima/che il PG è vittima di una Pozione che agisce secondo quanto spiegato qui;<\/li>\n<li>abbia riconosciuto la Pozione di cui è vittima secondo quanto spiegato qui.<br/>\nSe entrambe queste condizioni si verificano, il PG o altri PG possono tentare di liberare la vittima della Pozione dai suoi effetti.<\/li>\n<\/ol>\n<ul>\n<li><strong>Quando è possibile annullare gli effetti di una Pozione in corso?<\/strong> E' possibile annullarli in qualsiasi momento, mentre questi sono in corso nel PG vittima. Allo scadere della durata della Pozione, ovviamente, gli effetti saranno automaticamente annullati.<\/li>\n<li><strong>Come è possibile annullare gli effetti di una Pozione in corso?<\/strong> Una volta capito di quale Pozione il PG è sotto gli effetti, è necessario utilizzare l'Antidoto/Incantesimo specificato nello Specchietto di ciascuna Pozione. Tuttavia:<\/li>\n<\/ul>\n<ol>\n<li>è possibile utilizzare l'Antidoto/Incantesimo solo se questo è tra le Conoscenze del PG che ha intenzione di annullare gli effetti della Pozione;<\/li>\n<li>l'Antidoto/Incantesimo funziona ed annulla gli effetti della Pozione in corso soltanto se ha più <strong>Forza<\/strong> della Pozione di cui si vogliono annullare gli effetti.<br/>\nSe entrambe queste condizioni si verificano, il PG o altri PG possono tentare di liberare la vittima della Pozione dai suoi effetti.<\/li>\n<\/ol>\n<p><a id=\"resistenze\"><\/a><\/p>\n<h3 id=\"resistenze\">Resistenza mentale<\/h3>\n<p>Come spiegato nella sezione dedicata ai Parametri Magici:<\/p>\n<blockquote class=\"callout\">\n<\/blockquote>\n<p>La Volontà descrive la capacità del PG di tendere con decisione e piena autonomia alla realizzazione di scopi precisi al di là della fatica, dello sforzo, del dolore e dei sacrifici richiesti da questa realizzazione, come anche la <strong>capacità di resistere ai tentativi di intromissione di magia esterna contro la propria psiche o il proprio fisico<\/strong>.<\/p>\n<p>Per questo motivo, PG che subiscono una Trasfigurazione, un'illusione, l'intromissione di un altro PG nella propria mente a causa della Maledizione Imperio o della Legilimanzia, possono provare a resistervi e ad annullarne gli effetti con l'utilizzo della propria Volontà - e non di un incantesimo - nelle modalità specificate in ciascuna delle Conoscenze sopracitate.<\/p>\n<p><a id=\"nonverb\"><\/a><\/p>\n<h2 id=\"nonverb\">Incantesimi non verbali<\/h2>\n<p>Maghi e streghe che cominciano ad acquisire parecchia esperienza con la magia diventano ad un certo punto abbastanza abili nell'evocazione di Incantesimi non verbali. Questa tecnica consente loro di evocare Incantesimi senza pronunciarne la formula magia e quindi di ottenere sull'avversario un effetto sorpresa a discapito di un costo maggiore di Fatica nell'evocazione dell'incantesimo per lo sforzo fatto.<br/>\nEvocare magie non verbali significa dunque lanciare Incantesimi con più precisione o velocità, rendendo tuttavia la loro riuscita più faticosa.<br/>\n<strong>Bonus e Malus ottenuti dagli Incantesimi Non Verbali<\/strong><br/>\nOgni incantesimo non verbale fornisce un <strong>bonus del 20% della Destrezza al PG evocatore<\/strong>, al costo del <strong>50% in più della Fatica<\/strong> normalmente spesa per l'Incantesimo evocato.<\/p>\n<blockquote class=\"callout example\">\n<p><strong>Esempio.<\/strong><br/>\nHarry, PG Studente del VII anno con Destrezza 12, lancia un Expulso non verbale con costo di base -1 Fatica.<br/>\nIl suo Expulso verrà così lanciato non verbalmente con 14 Destrezza (12+20%= 14) ma al costo di 1,5 Fatica (1+50%= 1,5).<\/p>\n<\/blockquote>\n<p><strong>Chi può lanciarli e quali?<\/strong><br/>\nServe però una certa abilità nel lanciare magie non verbalmente.<\/p>\n<ul>\n<li>PG Studenti del **V anno **non sanno usare la magia non verbale, perché insegnata ad Hogwarts dall'anno successivo.<\/li>\n<li>PG Studenti del <strong>VI anno<\/strong> sanno lanciare non verbalmente tutti gli Incantesimi delle Conoscenze Autoconclusive e quelle Scolastiche che conoscono.<\/li>\n<li>PG Studenti del <strong>VII anno<\/strong> sanno lanciare non verbalmente tutti gli Incantesimi delle Conoscenze Autoconclusive, Scolastiche ed Extra che conoscono.<\/li>\n<li><strong>PG Adulti **sanno lanciare non verbalmente tutti gli Incantesimi delle Conoscenze Autoconclusive, Scolastiche, Extra e Avanzate che conoscono.<br/>\n**Accorgersi degli Incantesimi Non Verbali<\/strong><br/>\nUn incantesimo lanciato non verbalmente può risultare molto difficile da notare, soprattutto se non lo si subisce direttamente. Infatti esistono delle distinzioni importanti da fare in base al ruolo del personaggio coinvolto nella scena.<\/li>\n<li>Il PG che è un <strong>bersaglio diretto<\/strong> di un incantesimo non verbale, <strong>può sempre accorgersi di essere stato colpito da una magia<\/strong> e <strong>chi è che lo sta bersagliando<\/strong> (a meno che il post di in cui si viene bersagliati non sia nella sezione Orecchie Indiscrete).<br/>\nNon serve alcun tiro di dado: il PG se ne può accorgere e quindi reagire di conseguenza.<\/li>\n<li>PG che invece <strong>osservano esternamente la scena<\/strong> – quindi non sono direttamente coinvolti e/o bersagli dell'incantesimo non verbale – <strong>non possono accorgersi autoconclusivamente<\/strong> che qualcuno sta lanciando un incantesimo non verbale.<br/>\nIn questo caso, per capire che è stata lanciata una magia non verbale su qualcun altro, è necessario effettuare un tiro di Tracciatura - Percezione Intuitiva, seguendo <strong>le regole relative alla Conoscenza<\/strong>, quindi, consumare un'Azione/Azione Bonus e la relativa perdita di Fatica.<\/li>\n<\/ul>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>In ogni caso, ricordiamo che la magia non verbale, per quanto silenziosa, non è del tutto invisibile: piccoli gesti, movimenti della bacchetta, effetti magici improvvisi o reazioni del bersaglio possono fornire indizi utili, a patto sia coerente che il PG abbia modo e ragione di notare tali dettagli.<\/p>\n","aliases":["usare le conoscenze","Usare le Conoscenze"]},"magizoologia":{"title":"5. Magizoologia","subtitle":"Guida alla Magizoologia, Tecniche, Creature e Bestiario","crumb":["Regolamento","Manuali","Magizoologia"],"mode":"paper","html":"<p>Magizoologia\n<strong>INDICE<\/strong><\/p>\n<p>• Guida alla Magizoologia<\/p>\n<p>○ Riassunto introduttivo per i deboli di\ncuore<\/p>\n<p>○ Relazionarsi alle Creature Magiche<\/p>\n<p>○ Riconoscimento della Creatura\nMagica<\/p>\n<p><em>- Cosa succede se non riconosco la\nCreatura?<\/em><\/p>\n<p>○ Il Generatore: La Magizoologia<\/p>\n<p>○ <a href=\"fiducia/\">Fiducia<\/a><\/p>\n<p><em>- Cosa succede se fallisco la fase di\nFiducia?<\/em><\/p>\n<p>○ Cura<\/p>\n<p><em>- Scoperta del problema della\nCreatura<\/em><\/p>\n<p><em>- Cura del problema<\/em><\/p>\n<p><em>- Convalescenza della\nCreatura<\/em><\/p>\n<p>○ <a href=\"domesticazione/\">Domesticazione<\/a><\/p>\n<p><em>- Cosa succede se non riesco ad\naddomesticare la Creatura?<\/em><\/p>\n<p>○ Allevamento<\/p>\n<p>○ Cicli di Produzione Fasi Vitali<\/p>\n<p><em>- Quanti ingredienti o cuccioli ottengo dalla Creatura\nMagica al termine del ciclo di Produzione o Riproduzione?<\/em><\/p>\n<p><em>- Che bonus ottengo dalla Creatura che ho allevato\npersonalmente?<\/em><\/p>\n<p>○ Le Orde<\/p>\n<p>○ Le Riserve<\/p>\n<p>○ La Valigia Magica<\/p>\n<p>○ I Collaboratori<\/p>\n<p>• Animali e Creature da Compagnia<\/p>\n<p>• Tecniche e Incantesimi Magizoologici<\/p>\n<p>○ Conoscenze Extra<\/p>\n<p>○ Conoscenze Avanzate<\/p>\n<p><em>- Addestratore di Creature Magiche: insieme per\nsempre<\/em><\/p>\n<p><em>- Addestratore di Creature Magiche: richiamare le\nCreature Magiche<\/em><\/p>\n<p><em>- Addestratore di Creature Magiche: Creature\nMedimaghe<\/em><\/p>\n<p>• Bestiario<\/p>\n<p>○ Esseri<\/p>\n<p>○ Spiriti e Non-Esseri<\/p>\n<p>○ Bestie<\/p>\n<p>○ Glossario delle Creature Magiche<\/p>\n<h1 id=\"guida-alla-magizoologia\">Guida alla Magizoologia<\/h1>\n<p>La Magizoologia\nè una disciplina magica fondata sulla relazione fra mago-strega e Creatura Magica, portata\navanti da Magizooologi e Magizoologhe che, con la loro Empatia, possono interagire con le\nCreature Magiche sparse per il Mondo Magico, ottenere la loro fiducia, addomesticarle,\ncavalcarle e perfino sfruttarne le capacità sul campo di battaglia.\nAd Hogwarts gli studenti che frequentano il corso facoltativo di Cura delle Creature Magiche\nimparano a conoscere le proprietà, le debolezze e i punti di forza delle Bestie di ogni\nClassificazione - ad eccezione delle Creature Esotiche - e di tutti gli Esseri e ad interagirvi\ncon il solo uso dell'Empatia, senza cioè ricorrere alle arti magiche. E' infatti durante le ore di\nDifesa Contro le Arti Oscure che gli studenti imparano ad affrontare con la magia gli Spiriti,\nalcune delle più pericolose Bestie XXXXX e gli Esseri e Non-Esseri oscuri.\nLa differenza principale fra i due insegnamenti, dunque, sta nel modo in cui si affrontano le\nCreature Magiche: attraverso la relazione per i più esperti, o con l'uso della magia per la\ndifesa personale dei meno espferti.\nLa stessa distinzione vale per gli Adulti, ossia Magizoologi, Auror e Numen\nI primi conoscono tutto ciò che c'è da sapere sulle Bestie, sugli Esseri e sugli Spiriti a livello\nteorico e relazionale, mentre gli Auror e Numen sanno mettere in pratica gli incantesimi utili\nad allontanarli in caso di pericolo.<\/p>\n<h2 id=\"riassunto-introduttivo-per-i-deboli-di-cuore\">Riassunto introduttivo per i deboli di cuore<\/h2>\n<p>Esploratori del Mondo Magico e delle Creature Magiche, non abbiate paura\ndella mole di roba da leggere a seguire!\nTuttavia, se doveste averla, questo riassuntone introduttivo è proprio per voi.<\/p>\n<p>Su Felix Felicis GDR le Creature Magiche (Bestie, Esseri e Spiriti) si possono scovare o\ntrovare ONGame durante Quest o free role.\nI più esperti possono inoltre portarle con sé per accoglierle nella propria Riserva,\nprendersene cura, addestrarle e allevarle per ottenere da loro cuccioli e ingredienti e\nutilizzarle sul campo di battaglia.\n• <strong>Volete cercare una Bestia da portare nella vostra Riserva (gli Esseri e gli Spiriti è\nmeglio lasciarli perdere...) ?<\/strong>Allora date un'occhiata alla Ricerca Creature Magiche - e fate attenzione alle Orde! - alla descrizione delle Riserve e al modo in cui poterne costruire\nuna.\nAh, dimenticavamo: anche alla Valigia Magica, con cui\npotrete portarne sempre un certo numero in giro con voi!\n• <strong>Avete trovato una Bestia grazie alla Ricerca o durante una Quest e volete sapere come\nammansirla o portarla nella vostra Riserva?<\/strong>\nAllora non vi resta che leggere la Guida alla Magizoologia, dove\nsono spiegate le varie fasi attraverso cui vi è possibile diventare amici della Creatura Magica\ncontro cui vi trovate.\nEsse sono:<\/p>\n<ul>\n<li>Riconoscimento, per sapere di quale Creatura Magica si\ntratta;<\/li>\n<li>Fiducia, per ottenere la Fiducia della Creatura Magica e a cui\ncorrisponde la Conoscenza Avanzata Amico delle Creature;<\/li>\n<li>Cura, per curare e far guarire Creature in difficoltà e a cui corrisponde\nla Conoscenza Avanzata Custode delle Creature;<\/li>\n<li>Domesticazione, per addomesticare e portare con sé la\nCreatura Magica e a cui corrisponde la Conoscenza Avanzata\nAddestratore di Creature;<\/li>\n<li>Allevamento, per aiutare la Creatura a riprodursi e ottenere\nda lei cuccioli e Ingredienti, e a cui corrisponde la Conoscenza Avanzata\nAllevatore di Creature.\n• <strong>Volete sapere quali sono gli Incantesimi e le Tecniche che potete utilizzare ONGame\nper avvicinarvi alle Creature Magiche?<\/strong>\nAllora sfogliate le Conoscenze Magizoologiche, dove potrete\ntrovare degli specchietti esplicativi, incluse le descrizioni delle varie parti che compongono la\nSapienza Magizoologica!\n• <strong>...Come? Non sapete quali sono le Creature Magiche di Felix Felicis GDR?<\/strong>\nAllora non vi resta che consultare il Bestiario!\nVi basta anzitutto sapere che le Bestie sono suddivise per Classificazione da X a XXXXX, e\nche gli Esseri e gli Spiriti possono intralciare la ricerca del vostro PG ONGame come ospiti\npiù o meno indesiderati.\nSia Bestie, che Esseri che Spiriti hanno caratteristiche fisiche e abilità peculiari: le Bestie\nche riuscite a portare nella vostra Riserva possono dimostrarsi utili sul campo di battaglia o\nnella vita di ogni giorno!<\/li>\n<\/ul>\n<h2 id=\"relazionarsi-alle-creature-magiche\">Relazionarsi alle Creature Magiche<\/h2>\n<p>Oltre a cavalcare e volare sulle Creature Magiche come previsto\nper i Trasporti Magici, è possibile relazionarsi ad esse in quattro\nmodi diversi e per motivi diversi:- Cercare Creature sparse per il Mondo Magico e renderle parte della propria Riserva;<\/p>\n<ul>\n<li>Prendersi cura di una Creatura ferita o ammalata;<\/li>\n<li>Difendersi dall'ostilità di Creature incontrate per caso;<\/li>\n<li>Far nascere cucciolate di Creature e ottenere da loro Ingredienti spontaneamente.\nLa riuscita di ognuna di queste fasi è governata dal lancio di uno o più dadi.\nPiù l'abilità Magizoologica del PG è alta, più sono alte le possibilità di riuscire a relazionarsi\ncorrettamente con le Creature.<\/li>\n<\/ul>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Quale valore si usa nelle fasi della Guida?<\/strong>\n• <strong>PG Studenti:<\/strong> si usa il <strong>voto posseduto nella singola Creatura<\/strong> con cui il PG\nsta interagendo, così come compare nel suo Piano di Studi. Se lo Studente possiede al\n<strong>Livello I<\/strong> la Conoscenza Avanzata associata alla fase che sta eseguendo, aggiunge\n<strong>+2 possibilità<\/strong> al valore previsto dal proprio voto per quella sola fase. Il voto effettivo\nnella Creatura non cambia.\n• <strong>PG Adulti senza la Conoscenza Avanzata associata alla fase:<\/strong> se da Studenti\n<strong>non hanno frequentato Cura delle Creature Magiche<\/strong>, usano il valore previsto per un\nPG Studente con voto <strong>S<\/strong> nella singola Creatura; se invece <strong>hanno frequentato\nCura delle Creature Magiche<\/strong>, usano il valore indicato nella voce \"Adulto senza...\" della\nrelativa tabella.\n• <strong>PG Adulti con la Conoscenza Avanzata associata alla fase:<\/strong> usano il valore\nprevisto dal proprio Livello I-V, indipendentemente dal precedente Piano di Studi. I valori\ndegli Adulti specializzati restano pertanto invariati.<\/p>\n<p><strong>0) Riconoscimento:<\/strong> in questa fase relazionale il PG cerca di capire che tipo di\nCreatura Magica gli si para davanti tramite l'osservazione e l'uso delle sue conoscenze\nteoriche e pregresse riguardo le Creature Magiche. Il PG che riconosce la Creatura Magica\nconosce i suoi punti di forza e di debolezza, ma è perlopiù una fase di colore per quanto\nriguarda le Creature Magiche, in quanto non vi è nessun dado da lanciare e non v'è alcuna\nConoscenza Avanzata Magizoologica associata a questa fase, però può dare un malus nel\ncaso in cui il PG non riconosca la Creatura che ha davanti.\n<strong>1) Fiducia:<\/strong> in questa fase relazionale il PG tenta di infondere\nnella Creatura la fiducia necessaria perché non lo attacchi e non diventi ostile nei suoi\nconfronti.\nE' necessario applicare Fiducia quando si vogliono cercare Creature sparse per il Mondo\nMagico per portarle nella propria Riserva (a questa fase segue <em>obbligatoriamente<\/em> la\nDomesticazione della Creatura) o provare a difendersi da Creature, Esseri o Non-Esseri\nostili incontrate per caso senza ricorrere a incantesimi o strumenti magici, per poi lasciarle\nlibere di tornare nel proprio habitat.\nE' sostanzialmente la fase iniziale di qualsiasi relazione con una Creatura appena\nconosciuta.\nLa Conoscenza Avanzata della Sapienza Magizoologica associata a questa fase relazionale\nè \"Amico delle Creature\".\n<strong>2) Cura:<\/strong> in questa fase relazionale il PG prova a relazionarsi\nfisicamente alla Creatura ferita, ammalata o in difficoltà senza scatenare la sua opposizioneo ostilità, prendendosene cura, toccandola, somministrandole pozioni o incantesimi curativi,\nfacendo tutto ciò che serve per farla sentire meglio e al sicuro.\nE' necessario applicare Cura quando si vuole curare una Creatura ferita, ammalata o in\ndifficoltà, sia essa parte della sua Riserva o incontrata casualmente per il Mondo Magico, e\nquindi potenzialmente ostile. Non è necessario affrontare questa fase la Creatura che si\nincontra nel Mondo Magico è in salute.\nLa Conoscenza Avanzata della Sapienza Magizoologica associata a questa fase relazionale\nè \"Custode delle Creature\".\n<strong>3) Domesticazione:<\/strong> in questa fase relazionale il PG\ntenta di empatizzare con le Creature Magiche per riuscire ad addomesticarle, addestrarle e\ncreare con loro un rapporto di affetto e affinità stabile e reciproco.\nE' necessario applicare Domesticazione quando si trovano Creature sparse per il Mondo\nMagico e si vogliono portare nella propria Riserva (in questo caso è necessario aver svolto\nprima la fase di Fiducia), oppure dare degli ordini o provare a placare l'ostilità fra Creature\nche fanno già parte della propria Riserva.\nE' sostanzialmente la fase relazionale con la quale il PG instaura un rapporto maturo e\nduraturo con la Creatura.\nLa Conoscenza Avanzata della Sapienza Magizoologica associata a questa fase relazionale\nè \"Addestratore di Creature\".\n<strong>4) Allevamento:<\/strong> in questa fase relazionale il PG prova\na creare un ambiente adatto alla riproduzione di Creature che fanno parte della propria\nRiserva e ad avere da loro degli ingredienti in maniera <strong>spontanea<\/strong>, senza cioè\nutilizzare incantesimi o facendo loro del male.\nLa Conoscenza Avanzata della Sapienza Magizoologica associata a questa fase relazionale\nè \"Allevatore di Creature\".\nPer svolgere questa fase è necessario prima aver completato la fase di Domesticazione,\nsenza la quale la Creatura non può far parte della Riserva del PG.<\/p>\n<blockquote class=\"callout note\">\n<p><strong>Nota.<\/strong><\/p>\n<\/blockquote>\n<p>Ognuna delle precedenti fasi è consequenziale all'altra. Ciò significa che non è possibile:\n• Curare una Creatura ferita o ammalata senza prima aver ottenuto la sua Fiducia (prima\nFiducia e poi Cura);\n• Addomesticare una Creatura senza prima aver ottenuto la sua Fiducia, ed eventualmente\nanche curata (prima Fiducia - e Cura se necessario - e poi Domesticazione);\n• Allevare una Creatura Magica senza prima aver ottenuto la sua fiducia, averla\neventualmente curata e addomesticata (prima Fiducia - e Cura se necessario -,\nDomesticazione e poi Allevamento).\nNel caso in cui la Cura avvenga su Creature già parte della propria Riserva, significa che la\nfase di Fiducia e Domesticazione sono già state portate a termine con successo e non sarà\nnecessario ripeterle di nuovo.<\/p>\n<p><strong>Inoltre:<\/strong>\n• Le Creature possono dare anche parti del proprio corpo che però vengono considerate\
